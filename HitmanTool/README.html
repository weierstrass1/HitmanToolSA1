<html lang="en">
<head>
<meta charset="utf-8">

<title>Hitman Tool — Documentation</title>
<style>:root{color-scheme:light;--bg:#f6f7f9;--paper:#fff;--ink:#202b3b;--muted:#647184;--line:#dfe5eb;--accent:#07658b;--tint:#e0f4fb;--code:#f2f4f7;--shadow:0 10px 30px #182d4312;font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#131923;--paper:#1a2230;--ink:#e0e7ef;--muted:#9facbd;--line:#344053;--accent:#80dbff;--tint:#153647;--code:#121a25;--shadow:0 10px 30px #0002}
*{box-sizing:border-box}html{scroll-padding-top:105px}body{margin:0;background:var(--bg);color:var(--ink)}a{color:var(--accent);text-underline-offset:3px}a:hover{text-decoration:underline}button,input,select{font:inherit}button,select{cursor:pointer}button{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.skip-link{position:fixed;left:1rem;top:-100px;background:var(--paper);padding:1rem;z-index:20}.skip-link:focus{top:1rem}
.masthead{position:sticky;top:0;z-index:5;min-height:88px;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 34px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}.brand img{object-fit:contain;background:#102438;border-radius:12px;border:1px solid #395469}.brand-title{font-size:22px;line-height:1.3;font-weight:760;letter-spacing:-.6px;display:block}.brand-subtitle{display:block;font-size:12px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}.header-actions{display:flex;align-items:center;gap:12px}.header-actions label{font-size:13px;color:var(--muted)}select{border:1px solid var(--line);border-radius:8px;padding:7px 30px 7px 12px;background:var(--paper);color:var(--ink)}button{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:6px 12px}#theme{font-size:23px;line-height:1.4}#menu{display:none}
.layout{display:grid;grid-template-columns:290px minmax(0,1050px);max-width:1440px;margin:auto}.sidebar{position:sticky;top:88px;height:calc(100dvh - 88px);overflow-y:auto;border-right:1px solid var(--line);padding:30px 22px 20px}.nav-label{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:1.25px;color:var(--muted);display:block;margin:0 0 9px}.search-field{display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px}.search-field input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}.article-label{margin-top:28px}#articles{display:grid;gap:3px}#articles a{padding:8px 11px;border-radius:7px;font-size:13px;font-weight:550;line-height:1.5;text-decoration:none;color:var(--muted);display:flex;gap:10px}#articles a .nav-number{font-size:10px;line-height:2;color:var(--muted);font-variant-numeric:tabular-nums}#articles a:hover{background:var(--code);color:var(--ink)}#articles a[aria-current=page]{background:var(--tint);color:var(--accent)}#contents{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}summary{font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}#toc{margin-top:12px;display:grid;gap:6px}#toc a{font-size:12px;line-height:1.5;color:var(--muted);text-decoration:none;border-left:2px solid transparent;padding:3px 0 3px 10px;overflow-wrap:anywhere}#toc a:hover,#toc a[aria-current=location]{color:var(--accent);border-left-color:var(--accent)}#toc a[data-level="3"]{padding-left:22px}#toc a[data-level="4"],#toc a[data-level="5"]{padding-left:32px}.sidebar-footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sidebar-footer a{margin-left:auto}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
main{padding:45px 54px 24px;min-width:0;background:var(--paper);min-height:calc(100vh - 88px)}.article-topline{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:1.8px;font-weight:700;margin-bottom:15px}h1{font-size:clamp(27px,3vw,40px);line-height:1.18;letter-spacing:-1.2px;margin:0 0 10px;overflow-wrap:anywhere}.credits{font-size:13px;color:var(--muted);margin:0 0 32px;padding-bottom:25px;border-bottom:1px solid var(--line)}.credits a{font-weight:650}article p{margin:0 0 17px}article h2{font-size:25px;line-height:1.35;margin:40px 0 18px;padding-bottom:11px;border-bottom:1px solid var(--line);letter-spacing:-.5px}article h3{font-size:20px;margin:28px 0 13px;line-height:1.4}article h4{font-size:17px;margin:25px 0 12px}article h5,article h6{font-size:16px;margin:22px 0 12px}article h2,article h3,article h4,article h5,article h6{overflow-wrap:anywhere}.heading-link{color:var(--ink);text-decoration:none}.heading-link:hover{color:var(--accent)}article ul,article ol{padding-left:24px;margin:10px 0 22px}article li{padding-left:3px;margin:6px 0}.list-detail{font-size:.95em;margin-top:4px;color:var(--muted)}code{font: .87em/1.65 Consolas,"Cascadia Code",ui-monospace,monospace;background:var(--code);border-radius:4px;padding:2px 5px;overflow-wrap:anywhere}pre{margin:0;overflow:auto;tab-size:4;padding:22px 20px;max-height:650px}pre code{display:block;min-width:max-content;padding:0;background:transparent;font-size:12px;line-height:1.75;white-space:pre;overflow-wrap:normal}.code-block{position:relative;border:1px solid var(--line);border-radius:9px;background:var(--code);margin:18px 0 24px}.copy-code{position:sticky;float:right;top:0;right:0;margin:7px 7px -35px 0;font-size:10px;padding:3px 9px;z-index:1;background:var(--paper);box-shadow:var(--shadow)}.table-wrap{overflow-x:auto;max-width:100%;margin:18px 0 25px;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.65}th,td{text-align:left;vertical-align:top;padding:11px 13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:95px;overflow-wrap:anywhere}th{background:var(--code);font-weight:700}th:last-child,td:last-child{border-right:0}tr:last-child td,tr:last-child th{border-bottom:0}table code{font-size:11px}figure{margin:24px 0;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--code);text-align:center}figure img{max-width:100%;height:auto;image-rendering:pixelated}figcaption{font-size:12px;color:var(--muted);margin-top:10px}.pose-image{min-width:160px}.page-nav{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:40px 0 30px;border-top:1px solid var(--line);padding-top:24px}.page-nav a{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:13px 16px;text-decoration:none;line-height:1.5}.page-nav a:last-child{text-align:right}.page-nav small{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.page-nav strong{font-size:14px;margin-top:4px}.main-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:22px;font-size:11px;color:var(--muted)}.main-footer button{border:0;color:var(--accent);padding:0}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:8px;font-size:13px;z-index:20;display:none}.notice.visible{display:block}#search-results{margin-top:15px;font-size:12px}#search-results a{display:block;margin:8px 0;padding:9px;border:1px solid var(--line);border-radius:7px;text-decoration:none}#search-results small{display:block;color:var(--muted);line-height:1.5}#search-results mark{background:#d6edab;color:#182b19}.no-script{padding:20px}.empty-search{color:var(--muted)}
@media(min-width:1500px){main{padding-right:70px;padding-left:70px}}@media(max-width:1000px){.layout{grid-template-columns:240px minmax(0,1fr)}.sidebar{padding:24px 16px}main{padding:32px 28px}}@media(max-width:720px){.masthead{padding:12px 16px;min-height:76px}.brand-title{font-size:18px}.brand img{width:40px;height:40px}.brand-subtitle{font-size:9px}.header-actions{gap:7px}.header-actions label{display:none}#menu{display:block;font-size:12px}#theme{font-size:17px;padding:5px 9px}select{padding:5px 7px;max-width:100px;font-size:12px}.layout{display:block}.sidebar{display:none;position:fixed;left:0;top:76px;width:285px;height:calc(100dvh - 76px);background:var(--paper);z-index:4;box-shadow:var(--shadow)}body.menu-open .sidebar{display:block}main{padding:28px 20px}h1{font-size:30px}.credits{margin-bottom:25px}article h2{font-size:23px}pre{padding:18px 12px}th,td{padding:8px 10px}.page-nav{gap:9px}.page-nav a{padding:10px}.main-footer{align-items:flex-start}}
@media(max-width:720px){.masthead{gap:8px}.brand{gap:8px}.brand img{width:32px;height:32px}.brand-title{font-size:16px;white-space:nowrap;letter-spacing:-.4px}.brand-subtitle{font-size:8px;letter-spacing:1px}.header-actions select{max-width:82px}.table-wrap table{min-width:620px}.table-wrap th,.table-wrap td{min-width:125px}}
@media print{.masthead,.sidebar,.copy-code,.page-nav,.main-footer,.article-topline,.notice{display:none!important}.layout{display:block}main{padding:0;background:#fff;color:#000}.credits{margin-bottom:18px}a{color:inherit;text-decoration:none}.table-wrap,pre{overflow:visible;max-height:none}pre code{white-space:pre-wrap;min-width:0}h2,h3,h4{break-after:avoid}.code-block,tr,figure{break-inside:avoid}}
[hidden]{display:none!important}

<script id="documentation-data" type="application/json">{"en":{"main":{"title":"Hitman Tool","html":"\u003cp>\u003cstrong>Hitman Tool\u003c/strong> is a tool by anonimzwx for handling collisions and interactions in \u003cem>Super Mario World\u003c/em>. It lets you configure interactions from the original game (vanilla) and write custom responses for your sprites.\u003c/p>\n\u003ch2 id=\"Features\">\u003ca class=\"heading-link\" href=\"#en/main/Features\">Features\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Configurable hitboxes.\u003c/strong> A custom sprite can use the original game&#x27;s clipping, a single box whose size and position are set in code, or several boxes per pose.\u003c/li>\n\u003cli>\u003cstrong>Per-hitbox callbacks.\u003c/strong> For interactions with Mario, each box can run one routine when it collides and another when it does not.\u003c/li>\n\u003cli>\u003cstrong>Configurable vanilla interactions.\u003c/strong> Read flags to see what hit a sprite or assign callbacks to respond immediately. Supported events include Mario and Yoshi fireballs, explosions, Quake sprites, and collisions between sprites. An enemy can react to a shell hit or turn around when it runs into another sprite.\u003c/li>\n\u003cli>\u003cstrong>Extended sprite collisions.\u003c/strong> A custom projectile can use its own hitboxes to check for collisions with Mario or a Normal sprite.\u003c/li>\n\u003cli>\u003cstrong>Custom properties.\u003c/strong> Add properties to Normal sprites, both vanilla and custom. For example, other sprites can read a property that says whether an enemy is large or small and respond accordingly.\u003c/li>\n\u003cli>\u003cstrong>Reusable collision routines.\u003c/strong> Hitman includes routines that prepare hitboxes, check for collisions, and handle responses such as bouncing.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"Quick_Start\">\u003ca class=\"heading-link\" href=\"#en/main/Quick_Start\">Quick Start\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#en/quick-start\">Quick Start\u003c/a>\u003c/p>\n\u003ch2 id=\"Files_and_Formats\">\u003ca class=\"heading-link\" href=\"#en/main/Files_and_Formats\">Files and Formats\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#en/formats\">Hitman Tool files and formats\u003c/a>\u003c/p>\n\u003ch2 id=\"Hitman_Tool_and_Sprites\">\u003ca class=\"heading-link\" href=\"#en/main/Hitman_Tool_and_Sprites\">Hitman Tool and Sprites\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#en/sprites\">Using Hitman Tool with sprites\u003c/a>\u003c/p>\n\u003ch2 id=\"Hitman_Tool_with_UberASM\">\u003ca class=\"heading-link\" href=\"#en/main/Hitman_Tool_with_UberASM\">Hitman Tool with UberASM\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#en/uberasm\">Using Hitman Tool with UberASM\u003c/a>\u003c/p>\n\u003ch2 id=\"API\">\u003ca class=\"heading-link\" href=\"#en/main/API\">API\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#en/api\">Hitman Tool ASM API reference\u003c/a>\u003c/p>\n\u003ch2 id=\"How_Hitman_Tool_Works\">\u003ca class=\"heading-link\" href=\"#en/main/How_Hitman_Tool_Works\">How Hitman Tool Works\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#en/internals\">How Hitman Tool works\u003c/a>\u003c/p>","headings":[{"id":"Features","title":"Features","level":2},{"id":"Quick_Start","title":"Quick Start","level":2},{"id":"Files_and_Formats","title":"Files and Formats","level":2},{"id":"Hitman_Tool_and_Sprites","title":"Hitman Tool and Sprites","level":2},{"id":"Hitman_Tool_with_UberASM","title":"Hitman Tool with UberASM","level":2},{"id":"API","title":"API","level":2},{"id":"How_Hitman_Tool_Works","title":"How Hitman Tool Works","level":2}]},"quick-start":{"title":"Quick Start","html":"\u003cp>This guide shows how to install \u003ca href=\"#en/main\">Hitman Tool\u003c/a> on Windows or Linux.\u003c/p>\n\u003ch2 id=\"Requirements\">\u003ca class=\"heading-link\" href=\"#en/quick-start/Requirements\">Requirements\u003c/a>\u003c/h2>\n\u003cp>Install the \u003ca href=\"https://dotnet.microsoft.com/download/dotnet/8.0\">.NET 8 runtime\u003c/a> for your operating system. The runtime is enough.\u003c/p>\n\u003cp>Download Hitman Tool from \u003ca href=\"https://snestorage.dev/\">SNEStorage\u003c/a> and extract the entire package.\u003c/p>\n\u003ch2 id=\"Prepare_your_resources\">\u003ca class=\"heading-link\" href=\"#en/quick-start/Prepare_your_resources\">Prepare your resources\u003c/a>\u003c/h2>\n\u003ch3 id=\"PIXI_sprites\">\u003ca class=\"heading-link\" href=\"#en/quick-start/PIXI_sprites\">PIXI sprites\u003c/a>\u003c/h3>\n\u003cp>Copy each sprite package to the matching PIXI folder. Keep its files and subfolders together.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>sprites/\u003c/code> for Normal sprites.\u003c/li>\n\u003cli>\u003ccode>cluster/\u003c/code> for Cluster sprites.\u003c/li>\n\u003cli>\u003ccode>extended/\u003c/code> for Extended sprites.\u003c/li>\n\u003c/ul>\n\u003cp>Add the sprite to the PIXI list. If its ASM links files with \u003ccode>;#inchbi\u003c/code> or \u003ccode>;#inchmprop\u003c/code>, keep those files at the paths specified in the ASM.\u003c/p>\n\u003ch3 id=\"UberASMTool_resources\">\u003ca class=\"heading-link\" href=\"#en/quick-start/UberASMTool_resources\">UberASMTool resources\u003c/a>\u003c/h3>\n\u003cp>Copy each resource to the appropriate folder, such as \u003ccode>level/\u003c/code>, \u003ccode>overworld/\u003c/code>, or \u003ccode>gamemode/\u003c/code>, and add it to the UberASMTool list. If its ASM links a \u003ccode>.hitboxinfo\u003c/code> file with \u003ccode>;#inchbi\u003c/code>, keep that file where the resource expects it.\u003c/p>\n\u003ch3 id=\"Traditional_folders\">\u003ca class=\"heading-link\" href=\"#en/quick-start/Traditional_folders\">Traditional folders\u003c/a>\u003c/h3>\n\u003cp>If a resource tells you to put its files in the Hitman Tool folder, use these paths.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>File\u003c/th>\u003cth>Folder\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.hitboxinfo\u003c/code> file\u003c/td>\u003ctd>\u003ccode>HitboxInfo/\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Per-sprite property JSON\u003c/td>\u003ctd>\u003ccode>CustomProperties/PerSprite/\u003c/code>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"Install_Hitman_Tool\">\u003ca class=\"heading-link\" href=\"#en/quick-start/Install_Hitman_Tool\">Install Hitman Tool\u003c/a>\u003c/h2>\n\u003cp>Make a copy of your project&#x27;s ROM to use as the output. That file must already exist when you run Hitman Tool.\u003c/p>\n\u003cp>Open a terminal in the Hitman Tool folder. Run \u003ccode>.\\ht.exe\u003c/code> on Windows or \u003ccode>./ht\u003c/code> on Linux and answer the prompts.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Prompt\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Input ROM\u003c/td>\u003ctd>\u003ccode>C:\\MyHack\\MyHack.smc\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Output ROM\u003c/td>\u003ctd>\u003ccode>C:\\MyHack\\MyHack_Hitman.smc\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PIXI folder\u003c/td>\u003ctd>\u003ccode>C:\\MyHack\\PIXI\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PIXI list\u003c/td>\u003ctd>\u003ccode>C:\\MyHack\\PIXI\\list.txt\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>UberASMTool folder (optional)\u003c/td>\u003ctd>\u003ccode>C:\\MyHack\\UberASMTool\u003c/code>. Press Enter to skip it.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>UberASMTool list (if you entered the folder)\u003c/td>\u003ctd>\u003ccode>list.txt\u003c/code> if it is inside that folder. Press Enter to install only the Hitman Tool defines.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Paths are saved in \u003ccode>Json/Settings.json\u003c/code>. Add \u003ccode>-use-settings\u003c/code> to the command to use them again. To change or disable the UberASMTool integration, run without that argument and answer the prompts again.\u003c/p>\n\u003ch2 id=\"Finish_the_installation\">\u003ca class=\"heading-link\" href=\"#en/quick-start/Finish_the_installation\">Finish the installation\u003c/a>\u003c/h2>\n\u003cp>Run PIXI on the output ROM using the same sprite list. If you configured UberASMTool, run it on that ROM too.\u003c/p>\n\u003cp>When you change hitbox files or properties that Hitman Tool reads, run Hitman Tool again before PIXI and, if you use it, UberASMTool.\u003c/p>","headings":[{"id":"Requirements","title":"Requirements","level":2},{"id":"Prepare_your_resources","title":"Prepare your resources","level":2},{"id":"PIXI_sprites","title":"PIXI sprites","level":3},{"id":"UberASMTool_resources","title":"UberASMTool resources","level":3},{"id":"Traditional_folders","title":"Traditional folders","level":3},{"id":"Install_Hitman_Tool","title":"Install Hitman Tool","level":2},{"id":"Finish_the_installation","title":"Finish the installation","level":2}]},"formats":{"title":"Files and Formats","html":"\u003cp>\u003ca href=\"#en/main\">Hitman Tool\u003c/a> reads files that define properties, override them for individual sprite types, or describe a resource&#x27;s hitboxes.\u003c/p>\n\u003ch2 id=\"File_types\">\u003ca class=\"heading-link\" href=\"#en/formats/File_types\">File types\u003c/a>\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Type\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Where it goes\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Property definition (JSON)\u003c/td>\u003ctd>Creates a property and supplies its initial values.\u003c/td>\u003ctd>\u003ccode>CustomProperties/\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Per-sprite configuration (JSON)\u003c/td>\u003ctd>Sets property overrides and vanilla event callbacks for a Normal sprite type.\u003c/td>\u003ctd>Beside the resource via \u003ccode>;#inchmprop\u003c/code>, or in \u003ccode>CustomProperties/PerSprite/\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.hitboxinfo\u003c/code>\u003c/td>\u003ctd>Defines hitboxes and assigns them to poses.\u003c/td>\u003ctd>Beside the resource via \u003ccode>;#inchbi\u003c/code>, or in \u003ccode>HitboxInfo/\u003c/code>.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>The \u003ccode>CustomProperties/\u003c/code> and \u003ccode>HitboxInfo/\u003c/code> directories are inside the Hitman Tool folder.\u003c/p>\n\u003ch2 id=\"Linking_files_from_PIXI_and_UberASMTool\">\u003ca class=\"heading-link\" href=\"#en/formats/Linking_files_from_PIXI_and_UberASMTool\">Linking files from PIXI and UberASMTool\u003c/a>\u003c/h2>\n\u003cp>Put the directives in the resource&#x27;s main ASM file. Paths are relative to that file&#x27;s folder.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>;#inchbi &quot;MiSprite.hitboxinfo&quot;\n;#inchmprop &quot;MiSprite.hitman.json&quot;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>A PIXI or UberASMTool ASM file can link several \u003ccode>.hitboxinfo\u003c/code> files. Each generates a context define from its filename. For example, \u003ccode>MiSprite.hitboxinfo\u003c/code> generates \u003ccode>!MiSpriteHitboxContext\u003c/code> in \u003ccode>HitmanDefines.asm\u003c/code>. A linked file takes precedence over a file of the same name in \u003ccode>HitboxInfo/\u003c/code>.\u003c/p>\n\u003cp>Use \u003ccode>;#inchmprop\u003c/code> at most once in the main ASM file of a PIXI Normal sprite. See the \u003ca href=\"#en/quick-start\">Quick Start\u003c/a> to install the resources and regenerate the defines.\u003c/p>\n\u003ch2 id=\"Define_properties\">\u003ca class=\"heading-link\" href=\"#en/formats/Define_properties\">Define properties\u003c/a>\u003c/h2>\n\u003cp>Create a JSON file in \u003ccode>CustomProperties/\u003c/code>. Give the property a name and set the initial value for vanilla and custom Normal sprites. Write each one-byte value as a quoted hexadecimal string.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>{\n  &quot;Name&quot;: &quot;IsLarge&quot;,\n  &quot;DefaultValueVanilla&quot;: &quot;00&quot;,\n  &quot;DefaultValueCustom&quot;: &quot;00&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Here all sprites start with \u003ccode>00\u003c/code> (small). Set \u003ccode>01\u003c/code> for a large sprite so other sprites can tell which response to apply.\u003c/p>\n\u003ch2 id=\"Override_properties_for_a_sprite\">\u003ca class=\"heading-link\" href=\"#en/formats/Override_properties_for_a_sprite\">Override properties for a sprite\u003c/a>\u003c/h2>\n\u003cp>This JSON sets \u003ccode>IsLarge\u003c/code> to \u003ccode>01\u003c/code> on every instance of one custom sprite type. Properties you leave out keep their initial values.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>{\n  &quot;Name&quot;: &quot;MiSprite&quot;,\n  &quot;IsCustom&quot;: true,\n  &quot;Properties&quot;: [\n    { &quot;PropertyName&quot;: &quot;IsLarge&quot;, &quot;Value&quot;: &quot;01&quot; }\n  ]\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>For a custom sprite configured in \u003ccode>CustomProperties/PerSprite/\u003c/code>, set \u003ccode>Name\u003c/code> to the base name of its PIXI CFG or JSON file. For \u003ccode>MiSprite.json\u003c/code>, use \u003ccode>MiSprite\u003c/code>. When using \u003ccode>;#inchmprop\u003c/code>, Hitman gets the name from the PIXI entry. For a vanilla sprite in the central folder, set \u003ccode>&quot;IsCustom&quot;: false\u003c/code> and put its hexadecimal number in \u003ccode>ID\u003c/code>.\u003c/p>\n\u003cp>You can also add a \u003ccode>VanillaCallbacks\u003c/code> object. The fields are \u003ccode>SpriteSprite\u003c/code>, \u003ccode>Fireball\u003c/code>, \u003ccode>YoshiFireball\u003c/code>, \u003ccode>Quake\u003c/code>, and \u003ccode>CapeDive\u003c/code>. Each value names a routine. Set the matching bit in \u003ccode>VanillaEventMask\u003c/code> to receive the event. Older configurations can use \u003ccode>VanillaInteractionCallback\u003c/code> as a fallback and for explosions.\u003c/p>\n\u003ch2 id=\"HitboxInfo\">\u003ca class=\"heading-link\" href=\"#en/formats/HitboxInfo\">HitboxInfo\u003c/a>\u003c/h2>\n\u003cp>Each \u003ccode>.hitboxinfo\u003c/code> file defines a hitbox context. A pose can contain several boxes, share boxes with other poses, or be empty. Both formats can be used in the same installation. Use one format per file.\u003c/p>\n\u003ch3 id=\"Current_format\">\u003ca class=\"heading-link\" href=\"#en/formats/Current_format\">Current format\u003c/a>\u003c/h3>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>AllHitboxes:\n    .XOffset $08\n    .XPivot $08\n\nHitboxesPerPose:\n    .Pose0 0\n    .Pose1..2 0,1\n    .Pose[4,6] 1\n    .Pose7\n\nAllHitboxCallbacks:\n    .OnPlayerNonCollision CheckPlayerIsAbove\n\nHitbox0:\n    .YOffset $FFFF\n    .Width $10\n    .Height $08\n    .OnPlayerCollision CheckBounce\n\nHitbox1:\n    .XOffset $0C\n    .Width $08\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\n\u003cli>\u003ccode>HitboxesPerPose:\u003c/code> lists each pose&#x27;s boxes in the order Hitman checks them. Pose and box numbers are decimal. \u003ccode>.Pose1..2\u003c/code> covers poses 1 and 2, while \u003ccode>.Pose[4,6]\u003c/code> selects only 4 and 6. A pose with no boxes, such as pose 7, is empty. Missing pose numbers are empty as well.\u003c/li>\n\u003cli>\u003ccode>HitboxN:\u003c/code> defines box N. \u003ccode>.XOffset\u003c/code> and \u003ccode>.YOffset\u003c/code> move the box relative to the object&#x27;s origin. \u003ccode>.Width\u003c/code> and \u003ccode>.Height\u003c/code> must be positive and are measured in pixels. For a vertical offset of −1 use \u003ccode>$FFFF\u003c/code>. \u003ccode>$FF\u003c/code> means +255 here.\u003c/li>\n\u003cli>\u003ccode>AllHitboxes:\u003c/code> can shift all boxes. \u003ccode>.XPivot\u003c/code> and \u003ccode>.YPivot\u003c/code> set the point each axis is mirrored around. A box can override its pivot, including with \u003ccode>$00\u003c/code>. Hitman adds the global offset after mirroring.\u003c/li>\n\u003cli>\u003ccode>AllHitboxCallbacks:\u003c/code> supplies shared callbacks. Each box can override them separately. \u003ccode>.OnPlayerCollision\u003c/code> runs on collision with Mario and \u003ccode>.OnPlayerNonCollision\u003c/code> runs when the box does not collide with him. The reader accepts fields for other families, but the current patch only runs these two per-box callbacks from this format.\u003c/li>\n\u003c/ul>\n\u003cp>Older files in this format can use \u003ccode>AllHitboxXOffset:\u003c/code> and \u003ccode>AllHitboxYOffset:\u003c/code>, which apply the shift before mirroring. Use either those sections or \u003ccode>AllHitboxes:\u003c/code> in a file.\u003c/p>\n\u003ch4 id=\"Defaults\">\u003ca class=\"heading-link\" href=\"#en/formats/Defaults\">Defaults\u003c/a>\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Field\u003c/th>\u003cth>If omitted\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.XOffset\u003c/code> and \u003ccode>.YOffset\u003c/code>\u003c/td>\u003ctd>\u003ccode>$00\u003c/code>. Any offset defined in \u003ccode>AllHitboxes:\u003c/code> is added to the box.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.Width\u003c/code> and \u003ccode>.Height\u003c/code>\u003c/td>\u003ctd>\u003ccode>$10\u003c/code> (16 pixels) per axis.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.XPivot\u003c/code> and \u003ccode>.YPivot\u003c/code>\u003c/td>\u003ctd>The pivot in \u003ccode>AllHitboxes:\u003c/code>. If there is no pivot there either, flipping leaves the offset for that axis unchanged.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.OnPlayerCollision\u003c/code> and \u003ccode>.OnPlayerNonCollision\u003c/code>\u003c/td>\u003ctd>The matching callback in \u003ccode>AllHitboxCallbacks:\u003c/code>, or \u003ccode>Nothing\u003c/code> if none is set there.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"Legacy_format\">\u003ca class=\"heading-link\" href=\"#en/formats/Legacy_format\">Legacy format\u003c/a>\u003c/h3>\n\u003cp>The legacy format uses parallel tables. The first entry in each table belongs to box \u003ccode>$00\u003c/code>.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>PoseHitBoxes:\n    db $00,$FF\n    db $FF\n\nHitboxXOffset:\n    dw $0000\nHitboxYOffset:\n    dw $FFFF\nHitboxWidth:\n    dw $0010\nHitboxHeight:\n    dw $0008\nHitboxAction1:\n    dw $0000\nHitboxAction2:\n    dw $0002\nActions:\n    dw CheckBounce\n    dw CheckPlayerIsAbove\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\n\u003cli>Pose 0 uses box \u003ccode>$00\u003c/code>. Each pose ends in \u003ccode>$FF\u003c/code>. Pose 1 has only that terminator, so it is empty.\u003c/li>\n\u003cli>Offsets, width, and height have one entry per box. Optional \u003ccode>HitboxXOffsetFlip\u003c/code> and \u003ccode>HitboxYOffsetFlip\u003c/code> tables specify flipped offsets. If omitted, Hitman uses the original offsets.\u003c/li>\n\u003cli>\u003ccode>HitboxAction1\u003c/code> selects the contact routine and \u003ccode>HitboxAction2\u003c/code> selects the non-contact routine. Both are byte offsets into \u003ccode>Actions:\u003c/code>. Use \u003ccode>$0000\u003c/code> for the first routine, \u003ccode>$0002\u003c/code> for the second, and so on. If no actions are declared, Hitman uses \u003ccode>Nothing\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"Include_helper_routines\">\u003ca class=\"heading-link\" href=\"#en/formats/Include_helper_routines\">Include helper routines\u003c/a>\u003c/h4>\n\u003cp>Use \u003ccode>Dependencies:\u003c/code> when a callback needs a helper that Hitman cannot find on its own, for example because the name only appears inside a macro. Write \u003ccode>dw\u003c/code> followed by the routine name without \u003ccode>.asm\u003c/code>. Hitman looks for the file in \u003ccode>Routines/\u003c/code> and includes it in the patch.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>Dependencies:\n    dw PlayerFloor\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>This includes \u003ccode>Routines/PlayerFloor.asm\u003c/code>. It does not call the routine or assign it to a box. \u003ccode>HitboxAction1\u003c/code> and \u003ccode>HitboxAction2\u003c/code> still refer to entries in \u003ccode>Actions:\u003c/code>.\u003c/p>","headings":[{"id":"File_types","title":"File types","level":2},{"id":"Linking_files_from_PIXI_and_UberASMTool","title":"Linking files from PIXI and UberASMTool","level":2},{"id":"Define_properties","title":"Define properties","level":2},{"id":"Override_properties_for_a_sprite","title":"Override properties for a sprite","level":2},{"id":"HitboxInfo","title":"HitboxInfo","level":2},{"id":"Current_format","title":"Current format","level":3},{"id":"Defaults","title":"Defaults","level":4},{"id":"Legacy_format","title":"Legacy format","level":3},{"id":"Include_helper_routines","title":"Include helper routines","level":4}]},"sprites":{"title":"Using Hitman Tool with Sprites","html":"\u003cp>This guide shows how to create sprite hitboxes and use them to check for collisions with Mario, projectiles, and other sprites.\u003c/p>\n\u003ch2 id=\"What_you_need\">\u003ca class=\"heading-link\" href=\"#en/sprites/What_you_need\">What you need\u003c/a>\u003c/h2>\n\u003cp>If this is your first time installing Hitman Tool, follow the \u003ca href=\"#en/quick-start\">Quick Start\u003c/a> to set up your paths and find out which ROM to use with PIXI.\u003c/p>\n\u003ch2 id=\"Create_hitboxes_for_a_Normal_sprite\">\u003ca class=\"heading-link\" href=\"#en/sprites/Create_hitboxes_for_a_Normal_sprite\">Create hitboxes for a Normal sprite\u003c/a>\u003c/h2>\n\u003ch3 id=\"Define_and_link_the_boxes\">\u003ca class=\"heading-link\" href=\"#en/sprites/Define_and_link_the_boxes\">Define and link the boxes\u003c/a>\u003c/h3>\n\u003cp>Start with a sprite that has two poses. Pose 0 uses a 16 × 16 pixel box. Pose 1 keeps the same width, but the box starts 8 pixels lower and is only 8 pixels tall.\u003c/p>\n\u003cp>Save this as \u003ccode>MiSprite.hitboxinfo\u003c/code> next to the sprite&#x27;s main ASM file.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>HitboxesPerPose:\n    .Pose0 0\n    .Pose1 1\n\nHitbox0:\n    .Width $10\n    .Height $10\n\nHitbox1:\n    .YOffset $08\n    .Width $10\n    .Height $08\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>In the same folder, create \u003ccode>MiSprite.hitman.json\u003c/code>. Setting \u003ccode>HitboxSystem\u003c/code> to \u003ccode>03\u003c/code> tells Hitman to use the current pose when another sprite checks for a collision with yours.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>{\n  &quot;Name&quot;: &quot;MiSprite&quot;,\n  &quot;IsCustom&quot;: true,\n  &quot;Properties&quot;: [\n    { &quot;PropertyName&quot;: &quot;HitboxSystem&quot;, &quot;Value&quot;: &quot;03&quot; }\n  ]\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Add these lines to the sprite&#x27;s main ASM file.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>;#inchbi &quot;MiSprite.hitboxinfo&quot;\n;#inchmprop &quot;MiSprite.hitman.json&quot;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>See \u003ca href=\"#en/formats/HitboxInfo\">HitboxInfo\u003c/a> and \u003ca href=\"#en/api/Publish_a_Normal_sprite%27s_hitbox\">Publish a Normal sprite&#x27;s hitbox\u003c/a> for other ways to set up boxes.\u003c/p>\n\u003ch3 id=\"Tell_Hitman_which_pose_the_sprite_is_using\">\u003ca class=\"heading-link\" href=\"#en/sprites/Tell_Hitman_which_pose_the_sprite_is_using\">Tell Hitman which pose the sprite is using\u003c/a>\u003c/h3>\n\u003cp>To keep the boxes in sync with the animation, use the same pose index you use to draw the sprite. Store the base context plus the pose index in INIT and update it whenever the pose changes. This example starts at pose 0 without flipping.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; A and indices are 8-bit. X = Normal sprite slot.\nLDA.b #!MiSpriteHitboxContext\nSTA !HitmanNormalContextIDLow,x\nLDA.b #!MiSpriteHitboxContext&gt;&gt;8\nSTA !HitmanNormalContextIDHigh,x\nLDA #$00\nSTA !HitmanNormalFlip,x\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>For pose 1, add 1 to \u003ccode>!MiSpriteHitboxContext\u003c/code> before splitting it into two bytes. Update \u003ccode>!HitmanNormalFlip,x\u003c/code> when the sprite flips. The values 0, 1, 2, and 3 mean no flip, horizontal, vertical, and both. Set a pivot in the hitbox file if you want an offset to mirror along that axis.\u003c/p>\n\u003ch3 id=\"Detect_a_collision_with_Mario\">\u003ca class=\"heading-link\" href=\"#en/sprites/Detect_a_collision_with_Mario\">Detect a collision with Mario\u003c/a>\u003c/h3>\n\u003cp>Pass the base context plus the current pose to Hitman. \u003ccode>!PoseIndex\u003c/code> holds the current pose index. You can define a table with one byte per slot and update it when the pose changes. With Dynamic Xtreme, you can use \u003ccode>!LastPoseIndex,x\u003c/code> if it contains a valid pose and the hitbox file uses the same indices. In this example, the sprite jumps when it collides with Mario.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; A and indices are 8-bit. X = Normal sprite slot.\nLDA !HitmanNormalFlip,x\nSTA !HitmanSprite1Flip\nLDA !PoseIndex,x\nREP #$21\nAND.w #$00FF\nADC.w #!MiSpriteHitboxContext\nJSL !Hitman_Base_PlayerNormalSpriteInteractionWithoutCallback\nBCC .SinContacto\nLDA #$E0\nSTA !SpriteYSpeed,x\n.SinContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>With \u003ccode>WithoutCallback\u003c/code>, Carry is set if the sprite collides with Mario. To run a different action for each box, assign \u003ccode>.OnPlayerCollision\u003c/code> or \u003ccode>.OnPlayerNonCollision\u003c/code> and use \u003ccode>!Hitman_Base_PlayerNormalSpriteInteraction\u003c/code>. In that version, Carry indicates whether the callbacks left a result in \u003ccode>!HitmanDefault\u003c/code>. See \u003ca href=\"#en/api/PlayerSpriteInteraction\">PlayerSpriteInteraction\u003c/a> and \u003ca href=\"#en/api/Create_a_callback\">Create a callback\u003c/a>.\u003c/p>\n\u003ch3 id=\"Use_a_single_hitbox_on_a_Normal_sprite\">\u003ca class=\"heading-link\" href=\"#en/sprites/Use_a_single_hitbox_on_a_Normal_sprite\">Use a single hitbox on a Normal sprite\u003c/a>\u003c/h3>\n\u003cp>To set the size and position from ASM, store the X and Y offsets, width, and height in the sprite&#x27;s tables. Call \u003ccode>PlayerNormalSpriteOneHitboxInteraction\u003c/code> to see if it collides with Mario.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; A and indices are 8-bit. X = Normal sprite slot.\nLDA #$02\nSTA !HitmanNormalXOffLow,x\nLDA #$FC\nSTA !HitmanNormalYOffLow,x\nLDA #$0C\nSTA !HitmanNormalWidthLow,x\nLDA #$10\nSTA !HitmanNormalHeightLow,x\n\nJSL !Hitman_Base_PlayerNormalSpriteOneHitboxInteraction\nBCC .SinChoque\n; Handle the collision with Mario here.\n.SinChoque\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The box is 12 × 16 pixels, starting 2 pixels right and 4 pixels above the sprite&#x27;s origin. For a fixed box, write the four values in INIT and leave the call in MAIN. Set \u003ccode>HitboxSystem\u003c/code> to \u003ccode>02\u003c/code> if other sprites should use the same box when checking collisions.\u003c/p>\n\u003ch3 id=\"Use_a_16-bit_hitbox\">\u003ca class=\"heading-link\" href=\"#en/sprites/Use_a_16-bit_hitbox\">Use a 16-bit hitbox\u003c/a>\u003c/h3>\n\u003cp>Use \u003ccode>PlayerNormalSpriteOneLongHitboxInteraction\u003c/code> when the box needs larger dimensions or offsets. Write both bytes of each value. This box is 288 × 32 pixels and starts 144 pixels left and 4 pixels above the sprite&#x27;s origin.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; A and indices are 8-bit. X = Normal sprite slot.\n; X offset = $FF70 (-144), Y offset = $FFFC (-4).\nLDA #$70\nSTA !HitmanNormalXOffLow,x\nLDA #$FC\nSTA !HitmanNormalYOffLow,x\nLDA #$FF\nSTA !HitmanNormalXOffHigh,x\nSTA !HitmanNormalYOffHigh,x\n\n; Width = $0120 (288), height = $0020 (32).\nLDA #$20\nSTA !HitmanNormalWidthLow,x\nSTA !HitmanNormalHeightLow,x\nLDA #$01\nSTA !HitmanNormalWidthHigh,x\nLDA #$00\nSTA !HitmanNormalHeightHigh,x\n\nJSL !Hitman_Base_PlayerNormalSpriteOneLongHitboxInteraction\nBCC .SinChoque\n; Handle the collision with Mario here.\n.SinChoque\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>For a fixed box, write the values in INIT and call the routine from MAIN. Set \u003ccode>HitboxSystem\u003c/code> to \u003ccode>04\u003c/code> so other sprites can check this box.\u003c/p>\n\u003ch2 id=\"Respond_to_a_vanilla_interaction\">\u003ca class=\"heading-link\" href=\"#en/sprites/Respond_to_a_vanilla_interaction\">Respond to a vanilla interaction\u003c/a>\u003c/h2>\n\u003cp>Suppose you want a fireball to make the sprite jump. Disable the game&#x27;s usual response to the hit and leave the notification enabled.\u003c/p>\n\u003cp>Add these two properties to the sprite&#x27;s JSON. Keep \u003ccode>HitboxSystem\u003c/code> in the same list if you already set it.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>{ &quot;PropertyName&quot;: &quot;VanillaEventMask&quot;, &quot;Value&quot;: &quot;08&quot; },\n{ &quot;PropertyName&quot;: &quot;VanillaResponseMask&quot;, &quot;Value&quot;: &quot;77&quot; }\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Add \u003ccode>&quot;VanillaCallbacks&quot;: { &quot;Fireball&quot;: &quot;MiSpriteAlRecibirFuego&quot; }\u003c/code> to the JSON. Save the routine as \u003ccode>Routines/MiSpriteAlRecibirFuego.asm\u003c/code> inside Hitman Tool.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>MiSpriteAlRecibirFuego:\n    ; A = event, X = target, Y = Extended sprite slot.\n    LDA #$E0\n    STA !SpriteYSpeed,x\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>To respond in MAIN instead, enable the event and check its bit in \u003ccode>!Hitman_Prop_ActionFlag,x\u003c/code>. Clear that bit once you have handled it. See \u003ca href=\"#en/api/Event_flags_and_callbacks\">Event flags and callbacks\u003c/a> for the other events.\u003c/p>\n\u003ch2 id=\"Adapt_the_examples_to_Cluster_sprites_and_Extended_sprites\">\u003ca class=\"heading-link\" href=\"#en/sprites/Adapt_the_examples_to_Cluster_sprites_and_Extended_sprites\">Adapt the examples to Cluster sprites and Extended sprites\u003c/a>\u003c/h2>\n\u003cp>All three families can use the same \u003ccode>MiSprite.hitboxinfo\u003c/code>. Link it with \u003ccode>;#inchbi\u003c/code> and keep the base-context-plus-pose calculation. The example&#x27;s \u003ccode>HitboxSystem\u003c/code> JSON and \u003ccode>;#inchmprop\u003c/code> directive apply to Normal sprites.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Original example\u003c/th>\u003cth>Cluster sprite\u003c/th>\u003cth>Extended sprite\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Put the Normal sprite slot in X.\u003c/td>\u003ctd>Put the Cluster sprite slot in X.\u003c/td>\u003ctd>Put the Extended sprite slot in X.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Write \u003ccode>!HitmanNormalContextIDLow,x\u003c/code> and \u003ccode>!HitmanNormalContextIDHigh,x\u003c/code>.\u003c/td>\u003ctd>Use \u003ccode>!HitmanClusterContextIDLow,x\u003c/code> and \u003ccode>!HitmanClusterContextIDHigh,x\u003c/code>.\u003c/td>\u003ctd>Use \u003ccode>!HitmanExtendedContextIDLow,x\u003c/code> and \u003ccode>!HitmanExtendedContextIDHigh,x\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Use \u003ccode>!HitmanNormalFlip,x\u003c/code>.\u003c/td>\u003ctd>Use \u003ccode>!HitmanClusterFlip,x\u003c/code>.\u003c/td>\u003ctd>Use \u003ccode>!HitmanExtendedFlip,x\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Call \u003ccode>!Hitman_Base_PlayerNormalSpriteInteractionWithoutCallback\u003c/code>.\u003c/td>\u003ctd>Call \u003ccode>!Hitman_Base_PlayerClusterSpriteInteractionWithoutCallback\u003c/code>.\u003c/td>\u003ctd>Call \u003ccode>!Hitman_Base_PlayerExtendedSpriteInteractionWithoutCallback\u003c/code>.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Keep \u003ccode>BCC .SinContacto\u003c/code> to skip the response when there is no collision. If you want the sprite to jump, write to its family&#x27;s velocity table. \u003ccode>!SpriteYSpeed,x\u003c/code> is for Normal sprites. To use callbacks, remove \u003ccode>WithoutCallback\u003c/code> from the routine name and read \u003ccode>!HitmanDefault\u003c/code>.\u003c/p>\n\u003cp>If the Extended sprite should also collide with Normal sprites as a projectile, configure it by number in \u003ccode>ASM/ExtendedSpriteTablesConfig.asm\u003c/code>. Choose \u003ccode>$03\u003c/code> to use its pose hitboxes in that check. See \u003ca href=\"#en/api/Configure_Extended_sprites\">Configure Extended sprites\u003c/a>.\u003c/p>\n\u003ch2 id=\"Detect_collisions_between_sprites_from_ASM\">\u003ca class=\"heading-link\" href=\"#en/sprites/Detect_collisions_between_sprites_from_ASM\">Detect collisions between sprites from ASM\u003c/a>\u003c/h2>\n\u003cp>If you already have both slots, these routines set Carry when the sprites collide.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Pair\u003c/th>\u003cth>Call\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Two Normal sprites\u003c/td>\u003ctd>\u003ccode>JSL !Hitman_Base_CheckNormalPair\u003c/code>. Put one Normal sprite slot in X and the other in Y.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Extended sprite and Normal sprite\u003c/td>\u003ctd>\u003ccode>JSL !Hitman_Base_CheckExtendedNormalPair\u003c/code>. Put the Normal sprite slot in X and the Extended sprite slot in Y. Configure the Extended sprite&#x27;s hitbox mode first.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"Compare_boxes_from_other_sprite_families\">\u003ca class=\"heading-link\" href=\"#en/sprites/Compare_boxes_from_other_sprite_families\">Compare boxes from other sprite families\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>AnyNormalSpriteInteractionOneHitbox\u003c/code> looks up a Normal sprite&#x27;s box configuration. For a Cluster or Extended sprite on the receiving side, use the box format it was set up to use. If both sprites use one RAM box, use these calls. Each takes the slot for its family in X.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Family\u003c/th>\u003cth>Load HB1\u003c/th>\u003cth>Load HB2\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Normal sprite\u003c/td>\u003ctd>\u003ccode>NormalSpriteOneHitbox1\u003c/code>\u003c/td>\u003ctd>\u003ccode>NormalSpriteOneHitbox2\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cluster sprite\u003c/td>\u003ctd>\u003ccode>ClusterSpriteOneHitbox1\u003c/code>\u003c/td>\u003ctd>\u003ccode>ClusterSpriteOneHitbox2\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Extended sprite\u003c/td>\u003ctd>\u003ccode>ExtendedSpriteOneHitbox1\u003c/code>\u003c/td>\u003ctd>\u003ccode>ExtendedSpriteOneHitbox2\u003c/code>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Call \u003ccode>JSL !Hitman_Base_CheckContact\u003c/code> once both boxes are ready and read Carry. Use the \u003ccode>LongOneHitbox\u003c/code> variant to load a box with 16-bit fields. If the other sprite uses a pose with several boxes, use \u003ccode>GetHitbox2\u003c/code> to load each box and compare it with HB1. See \u003ca href=\"#en/api/Prepare_and_compare_boxes\">Prepare and compare boxes\u003c/a>.\u003c/p>\n\u003ch2 id=\"Disable_collisions_between_Normal_sprites\">\u003ca class=\"heading-link\" href=\"#en/sprites/Disable_collisions_between_Normal_sprites\">Disable collisions between Normal sprites\u003c/a>\u003c/h2>\n\u003cp>If one sprite carries another, you can stop them from colliding while they are together. Put the carrier&#x27;s slot in X and the passenger&#x27;s slot in Y. Call \u003ccode>SetSpritePairCollision\u003c/code> with A set to \u003ccode>$00\u003c/code> to block the pair. When the carrier releases the passenger, set A to \u003ccode>$01\u003c/code> to allow collisions again.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; A and indices are 8-bit. X = carrier, Y = passenger.\nLDA #$00\nJSL !Hitman_Base_SetSpritePairCollision\n\n; On release, after checking that Y still identifies the passenger.\nLDA #$01\nJSL !Hitman_Base_SetSpritePairCollision\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>This applies in both directions. If you store the passenger&#x27;s slot for several frames, check that it still belongs to the same sprite before using it again. Hitman resets the pairs when it initializes a slot.\u003c/p>\n\u003cp>To change every pair for the Normal sprite in X, use \u003ccode>!Hitman_Base_SetSpriteSlotCollision\u003c/code> with the same values in A. The mask applies to vanilla Normal sprite collisions. Manual checks like \u003ccode>CheckNormalPair\u003c/code> still report whether the boxes overlap. See \u003ca href=\"#en/api/SetSpritePairCollision\">SetSpritePairCollision\u003c/a> and \u003ca href=\"#en/api/SetSpriteSlotCollision\">SetSpriteSlotCollision\u003c/a>.\u003c/p>\n\u003ch2 id=\"Configure_the_Extended_sprite_tables\">\u003ca class=\"heading-link\" href=\"#en/sprites/Configure_the_Extended_sprite_tables\">Configure the Extended sprite tables\u003c/a>\u003c/h2>\n\u003cp>Edit \u003ccode>ASM/ExtendedSpriteTablesConfig.asm\u003c/code> inside Hitman Tool. The patch builds these tables when installed. They control how Extended sprites collide with Normal sprites. The macros take an Extended sprite number. During the game, the collision routines take the slot of a particular projectile.\u003c/p>\n\u003ch3 id=\"Choose_the_hitbox\">\u003ca class=\"heading-link\" href=\"#en/sprites/Choose_the_hitbox\">Choose the hitbox\u003c/a>\u003c/h3>\n\u003cp>Use \u003ccode>%SetExtendedHitboxSystem(number, mode)\u003c/code> to choose where Hitman gets the boxes.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Mode\u003c/th>\u003cth>What Hitman uses\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$00\u003c/code>\u003c/td>\u003ctd>The Extended sprite is skipped.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>A fixed box. Set its X offset, Y offset, width, and height with \u003ccode>%SetExtendedHitbox\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>One RAM box. Store signed offsets and dimensions in the \u003ccode>Low\u003c/code> bytes of \u003ccode>!HitmanExtendedXOff\u003c/code>, \u003ccode>!HitmanExtendedYOff\u003c/code>, \u003ccode>!HitmanExtendedWidth\u003c/code>, and \u003ccode>!HitmanExtendedHeight\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$03\u003c/code>\u003c/td>\u003ctd>The current pose&#x27;s boxes. Store the base context plus pose and the flip as shown above.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>One 16-bit RAM box. Write both the \u003ccode>Low\u003c/code> and \u003ccode>High\u003c/code> bytes of each offset and dimension.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Use the Extended sprite&#x27;s slot when writing its RAM tables. If you change modes, write the new mode&#x27;s data again because the pose and offsets share some bytes.\u003c/p>\n\u003ch3 id=\"Choose_what_happens_on_impact\">\u003ca class=\"heading-link\" href=\"#en/sprites/Choose_what_happens_on_impact\">Choose what happens on impact\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>%SetExtendedFireballEvent\u003c/code> sets the response separately from the shape. Choose \u003ccode>!HitmanEventFireball\u003c/code> for Mario&#x27;s fireball response, \u003ccode>!HitmanEventYoshiFireball\u003c/code> for Yoshi&#x27;s, or \u003ccode>$00\u003c/code> to handle the impact yourself.\u003c/p>\n\u003cp>This gives projectile \u003ccode>$20\u003c/code> a fixed 12 × 16 pixel box and Mario&#x27;s fireball response.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>%SetExtendedHitboxSystem($20, $01)\n%SetExtendedHitbox($20, $0002, $FFFC, $000C, $0010)\n%SetExtendedFireballEvent($20, !HitmanEventFireball)\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The box starts 2 pixels right and 4 pixels above the origin. In the projectile&#x27;s code, put its slot in X and call \u003ccode>JSL !Hitman_Base_RunVanillaFireballInteraction\u003c/code> with A and the index registers in 8-bit mode. To handle the impact yourself, use event \u003ccode>$00\u003c/code> and call \u003ccode>CheckExtendedNormalPair\u003c/code> with the Normal sprite in X and the projectile in Y.\u003c/p>\n\u003cp>Mario&#x27;s (\u003ccode>$05\u003c/code>) and Yoshi&#x27;s (\u003ccode>$11\u003c/code>) fireballs are already configured. Other numbers start with mode and event \u003ccode>$00\u003c/code>. Reinstall Hitman Tool and reinsert the resources that use its defines after changing these settings. See \u003ca href=\"#en/api/Configure_Extended_sprites\">Configure Extended sprites\u003c/a> for the RAM tables and calling conventions.\u003c/p>\n\u003ch2 id=\"Install_the_sprite\">\u003ca class=\"heading-link\" href=\"#en/sprites/Install_the_sprite\">Install the sprite\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>Add the sprite to the PIXI list.\u003c/li>\n\u003cli>Run Hitman Tool with that list.\u003c/li>\n\u003cli>Run PIXI on the output ROM with the same list.\u003c/li>\n\u003cli>If you use Hitman with UberASMTool, run UberASMTool again on that ROM.\u003c/li>\n\u003c/ol>","headings":[{"id":"What_you_need","title":"What you need","level":2},{"id":"Create_hitboxes_for_a_Normal_sprite","title":"Create hitboxes for a Normal sprite","level":2},{"id":"Define_and_link_the_boxes","title":"Define and link the boxes","level":3},{"id":"Tell_Hitman_which_pose_the_sprite_is_using","title":"Tell Hitman which pose the sprite is using","level":3},{"id":"Detect_a_collision_with_Mario","title":"Detect a collision with Mario","level":3},{"id":"Use_a_single_hitbox_on_a_Normal_sprite","title":"Use a single hitbox on a Normal sprite","level":3},{"id":"Use_a_16-bit_hitbox","title":"Use a 16-bit hitbox","level":3},{"id":"Respond_to_a_vanilla_interaction","title":"Respond to a vanilla interaction","level":2},{"id":"Adapt_the_examples_to_Cluster_sprites_and_Extended_sprites","title":"Adapt the examples to Cluster sprites and Extended sprites","level":2},{"id":"Detect_collisions_between_sprites_from_ASM","title":"Detect collisions between sprites from ASM","level":2},{"id":"Compare_boxes_from_other_sprite_families","title":"Compare boxes from other sprite families","level":3},{"id":"Disable_collisions_between_Normal_sprites","title":"Disable collisions between Normal sprites","level":2},{"id":"Configure_the_Extended_sprite_tables","title":"Configure the Extended sprite tables","level":2},{"id":"Choose_the_hitbox","title":"Choose the hitbox","level":3},{"id":"Choose_what_happens_on_impact","title":"Choose what happens on impact","level":3},{"id":"Install_the_sprite","title":"Install the sprite","level":2}]},"uberasm":{"title":"Using Hitman Tool with UberASM","html":"\u003cp>With \u003ca href=\"#en/main\">Hitman Tool\u003c/a>, a level script in UberASM can check whether an object collides with Mario without using a sprite slot.\u003c/p>\n\u003ch2 id=\"Set_up_UberASMTool\">\u003ca class=\"heading-link\" href=\"#en/uberasm/Set_up_UberASMTool\">Set up UberASMTool\u003c/a>\u003c/h2>\n\u003cp>After configuring PIXI in the Hitman Tool menu, enter the UberASMTool folder. Enter its list too if your UberASM code links any \u003ccode>.hitboxinfo\u003c/code> files. If the code only calls Hitman routines, you can leave the list blank. Hitman Tool links \u003ccode>HitmanDefines.asm\u003c/code> from UberASMTool&#x27;s macro library.\u003c/p>\n\u003cp>Run \u003ccode>ht\u003c/code> without \u003ccode>-use-settings\u003c/code> to change the saved configuration. See the \u003ca href=\"#en/quick-start\">Quick Start\u003c/a> for the installation steps.\u003c/p>\n\u003ch2 id=\"Check_if_an_object_collides_with_Mario\">\u003ca class=\"heading-link\" href=\"#en/uberasm/Check_if_an_object_collides_with_Mario\">Check if an object collides with Mario\u003c/a>\u003c/h2>\n\u003cp>For an object with one box, store its position in FreeRAM and set its width and height in the ASM. \u003ccode>PlayerClippingRoutine\u003c/code> loads Mario&#x27;s hitbox for you.\u003c/p>\n\u003cp>Reserve four bytes at an address that is free in your project and define \u003ccode>!FreeRAM_ObjetoNivel\u003c/code> with that address. Use two bytes for X and two for Y. Set the coordinates when the level loads and update them when the object moves.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>!ObjetoX = !FreeRAM_ObjetoNivel\n!ObjetoY = !FreeRAM_ObjetoNivel+2\n!ObjetoAncho = $0010\n!ObjetoAlto = $0010\n\nmain:\n    ; A and indices are 8-bit. Use the game&#x27;s direct page.\n    JSL !Hitman_Base_PlayerClippingRoutine  ; Load Mario&#x27;s box into HB2.\n\n    REP #$21\n    LDA !ObjetoX\n    ADC.w #$0100\n    STA !HitmanHB1Left\n    CLC\n    ADC.w #!ObjetoAncho\n    STA !HitmanHB1Right\n\n    LDA !ObjetoY\n    CLC\n    ADC.w #$0100\n    STA !HitmanHB1Top\n    CLC\n    ADC.w #!ObjetoAlto\n    STA !HitmanHB1Bottom\n\n    SEP #$20\n    JSL !Hitman_Base_CheckContact\n    BCC .SinChoque\n    ; Handle the collision with Mario here.\n.SinChoque\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>PlayerClippingRoutine\u003c/code> leaves Mario&#x27;s box in HB2 using Hitman&#x27;s coordinate system. Add \u003ccode>$0100\u003c/code> to the object&#x27;s coordinates when preparing HB1. \u003ccode>CheckContact\u003c/code> compares the boxes and sets Carry if they collide. For this example, configuring the UberASMTool folder is enough. See \u003ca href=\"#en/api/Prepare_and_compare_boxes\">Prepare and compare boxes\u003c/a>.\u003c/p>\n\u003ch2 id=\"Use_several_hitboxes_in_one_pose\">\u003ca class=\"heading-link\" href=\"#en/uberasm/Use_several_hitboxes_in_one_pose\">Use several hitboxes in one pose\u003c/a>\u003c/h2>\n\u003cp>Suppose your object has a base and a moving arm. Save this as \u003ccode>ObjetoNivel.hitboxinfo\u003c/code> next to the level ASM. Pose 0 uses just the base. Pose 1 uses both boxes.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>HitboxesPerPose:\n    .Pose0 0\n    .Pose1 0,1\n\nHitbox0:\n    .Width $10\n    .Height $10\n\nHitbox1:\n    .XOffset $10\n    .YOffset $04\n    .Width $10\n    .Height $08\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Add \u003ccode>;#inchbi &quot;ObjetoNivel.hitboxinfo&quot;\u003c/code> to the main ASM file and give Hitman the UberASMTool list so it can find the file. Keep the \u003ccode>!ObjetoX\u003c/code> and \u003ccode>!ObjetoY\u003c/code> defines from the previous example and use this \u003ccode>main\u003c/code>. Mario&#x27;s box still goes in HB2. Hitman works out the object&#x27;s boxes from its position and pose.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>main:\n    ; A and indices are 8-bit. Use the game&#x27;s direct page.\n    JSL !Hitman_Base_PlayerClippingRoutine\n    STZ !HitmanSprite1Flip\n\n    REP #$21\n    LDA !ObjetoX\n    ADC.w #$0100\n    STA !HitmanSprite1X\n    LDA !ObjetoY\n    CLC\n    ADC.w #$0100\n    STA !HitmanSprite1Y\n\n    LDA.w #!ObjetoNivelHitboxContext+1\n    JSL !Hitman_Base_ProcessHitBoxesWithoutCallback\n    BCC .SinChoque\n    ; Mario collided with the base or the arm.\n.SinChoque\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The call checks pose 1 and leaves the first box that collided in HB1. If the object changes poses, keep the current pose index in FreeRAM and add it to the base context instead of adding \u003ccode>1\u003c/code>. See \u003ca href=\"#en/api/ProcessHitBoxesWithoutCallback\">ProcessHitBoxesWithoutCallback\u003c/a>.\u003c/p>\n\u003ch2 id=\"Check_two_sprites_already_in_the_level\">\u003ca class=\"heading-link\" href=\"#en/uberasm/Check_two_sprites_already_in_the_level\">Check two sprites already in the level\u003c/a>\u003c/h2>\n\u003cp>If your UberASM code already knows the slots of two Normal sprites, put one in X and the other in Y. Call \u003ccode>JSL !Hitman_Base_CheckNormalPair\u003c/code> with A and the index registers in 8-bit mode. Hitman uses the configured hitboxes for both and sets Carry if they collide. If one is an Extended sprite, call \u003ccode>CheckExtendedNormalPair\u003c/code> with the Normal sprite in X and the Extended sprite in Y. See \u003ca href=\"#en/api/Manual_interaction_routines\">Manual interaction routines\u003c/a>.\u003c/p>\n\u003ch2 id=\"Install_the_code\">\u003ca class=\"heading-link\" href=\"#en/uberasm/Install_the_code\">Install the code\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>Add the level ASM to the UberASMTool list.\u003c/li>\n\u003cli>Run Hitman Tool.\u003c/li>\n\u003cli>If your project uses PIXI sprites with Hitman, run PIXI again on the output ROM.\u003c/li>\n\u003cli>Run UberASMTool on that same ROM.\u003c/li>\n\u003c/ol>","headings":[{"id":"Set_up_UberASMTool","title":"Set up UberASMTool","level":2},{"id":"Check_if_an_object_collides_with_Mario","title":"Check if an object collides with Mario","level":2},{"id":"Use_several_hitboxes_in_one_pose","title":"Use several hitboxes in one pose","level":2},{"id":"Check_two_sprites_already_in_the_level","title":"Check two sprites already in the level","level":2},{"id":"Install_the_code","title":"Install the code","level":2}]},"api":{"title":"ASM API","html":"\u003cp>This reference covers \u003ca href=\"#en/main\">Hitman Tool\u003c/a> routines you can call from sprites or UberASM. If you are setting up the boxes themselves, start with \u003ca href=\"#en/formats\">Files and Formats\u003c/a>.\u003c/p>\n\u003ch2 id=\"Set_up_your_code\">\u003ca class=\"heading-link\" href=\"#en/api/Set_up_your_code\">Set up your code\u003c/a>\u003c/h2>\n\u003cp>Install Hitman Tool before assembling code that uses it. The public routines appear as \u003ccode>!Hitman_Base_*\u003c/code> in \u003ccode>HitmanDefines.asm\u003c/code>. Use the defines generated for your target ROM. See the \u003ca href=\"#en/quick-start\">Quick Start\u003c/a> for PIXI and UberASMTool setup.\u003c/p>\n\u003cp>Call the ASM routines with \u003ccode>JSL\u003c/code>. They return with \u003ccode>RTL\u003c/code>. Unless an entry says otherwise, use 8-bit A and index registers. Collision checks share temporary memory, so read any box edges or callback results you need before starting another check.\u003c/p>\n\u003ch2 id=\"Hitman_defines\">\u003ca class=\"heading-link\" href=\"#en/api/Hitman_defines\">Hitman defines\u003c/a>\u003c/h2>\n\u003cp>Use the \u003ccode>HitmanDefines.asm\u003c/code> generated for your ROM. Reassemble the resources that use it after changing properties, moving the RAM block, or reinstalling the patch.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Name\u003c/th>\u003cth>What it represents\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Base_\u003c/code> + routine name\u003c/td>\u003ctd>Address of a base routine, such as \u003ccode>!Hitman_Base_CheckNormalPair\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Callback_\u003c/code> + routine name\u003c/td>\u003ctd>Address of a callback included in the installation, such as \u003ccode>!Hitman_Callback_SetBit3\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Prop_\u003c/code> + JSON \u003ccode>Name\u003c/code>\u003c/td>\u003ctd>Address of a property table with one byte per Normal sprite slot.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!MiSpriteHitboxContext\u003c/code>\u003c/td>\u003ctd>Base context generated from \u003ccode>MiSprite.hitboxinfo\u003c/code>. Add a pose number to select its boxes.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanNormal*\u003c/code>, \u003ccode>!HitmanCluster*\u003c/code>, \u003ccode>!HitmanExtended*\u003c/code>\u003c/td>\u003ctd>Per-slot tables. These include \u003ccode>ContextIDLow\u003c/code>, \u003ccode>ContextIDHigh\u003c/code>, \u003ccode>Flip\u003c/code>, and the \u003ccode>Low\u003c/code> and \u003ccode>High\u003c/code> bytes of \u003ccode>XOff\u003c/code>, \u003ccode>YOff\u003c/code>, \u003ccode>Width\u003c/code>, and \u003ccode>Height\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanSprite1X\u003c/code>, \u003ccode>!HitmanSprite1Y\u003c/code>, \u003ccode>!HitmanSprite1Flip\u003c/code>\u003c/td>\u003ctd>Temporary position and flip for object 1. Use the corresponding \u003ccode>Sprite2\u003c/code> defines for object 2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanHB1Left\u003c/code>, \u003ccode>!HitmanHB1Top\u003c/code>, \u003ccode>!HitmanHB1Right\u003c/code>, \u003ccode>!HitmanHB1Bottom\u003c/code>\u003c/td>\u003ctd>The 16-bit edges of HB1. Use the same suffixes with \u003ccode>!HitmanHB2\u003c/code> for HB2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanHBStatus\u003c/code>, \u003ccode>!HitmanDefault\u003c/code>\u003c/td>\u003ctd>The position of the boxes relative to each other and the accumulated callback result, respectively.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanEventShell\u003c/code>, \u003ccode>!HitmanEventRegular\u003c/code>, \u003ccode>!HitmanEventExplosion\u003c/code>, \u003ccode>!HitmanEventFireball\u003c/code>, \u003ccode>!HitmanEventYoshiFireball\u003c/code>, \u003ccode>!HitmanEventQuake\u003c/code>, \u003ccode>!HitmanEventCapeDive\u003c/code>, \u003ccode>!HitmanEventShellHit\u003c/code>\u003c/td>\u003ctd>Vanilla event masks. Use them to set event bits or compare the event in A.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanRAMBase\u003c/code>, \u003ccode>!HitmanRAMLimit\u003c/code>, \u003ccode>!HitmanRAMEnd\u003c/code>\u003c/td>\u003ctd>Start and exclusive limit of the reservation, and exclusive end of the bytes used. See \u003ca href=\"#en/api/Move_Hitman%27s_RAM_block\">Move Hitman&#x27;s RAM block\u003c/a>.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"Read_or_change_a_property\">\u003ca class=\"heading-link\" href=\"#en/api/Read_or_change_a_property\">Read or change a property\u003c/a>\u003c/h3>\n\u003cp>A property with \u003ccode>&quot;Name&quot;: &quot;IsLarge&quot;\u003c/code> generates \u003ccode>!Hitman_Prop_IsLarge\u003c/code>. Put the Normal sprite slot in X to read its own value.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; A and indices are 8-bit. X = Normal sprite slot to check.\nLDA !Hitman_Prop_IsLarge,x\nBEQ .Pequeno\n; Handle the large sprite here.\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>To change that instance&#x27;s value, use \u003ccode>STA !Hitman_Prop_IsLarge,x\u003c/code> with 8-bit A. The JSON sets the initial value when the slot is prepared.\u003c/p>\n\u003ch2 id=\"Publish_a_Normal_sprite&#x27;s_hitbox\">\u003ca class=\"heading-link\" href=\"#en/api/Publish_a_Normal_sprite%27s_hitbox\">Publish a Normal sprite&#x27;s hitbox\u003c/a>\u003c/h2>\n\u003cp>When Hitman checks a Normal sprite in slot X, \u003ccode>!Hitman_Prop_HitboxSystem,x\u003c/code> tells it which boxes to use.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Value\u003c/th>\u003cth>Geometry\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$00\u003c/code>\u003c/td>\u003ctd>Disabled for Hitman&#x27;s vanilla interactions.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>Original game clipping. This is the initial value.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>One RAM box with signed 8-bit offsets and 8-bit dimensions.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$03\u003c/code>\u003c/td>\u003ctd>The boxes for the active pose.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>One RAM box with signed 16-bit offsets and 16-bit dimensions.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>In mode \u003ccode>$03\u003c/code>, store the base context plus the pose number in \u003ccode>!HitmanNormalContextIDLow,x\u003c/code> and \u003ccode>!HitmanNormalContextIDHigh,x\u003c/code>. Store the flip in \u003ccode>!HitmanNormalFlip,x\u003c/code> (\u003ccode>0\u003c/code> none, \u003ccode>1\u003c/code> horizontal, \u003ccode>2\u003c/code> vertical, \u003ccode>3\u003c/code> both). Update these fields when the pose or flip changes so other sprites can check the right boxes.\u003c/p>\n\u003ch2 id=\"Vanilla_interactions\">\u003ca class=\"heading-link\" href=\"#en/api/Vanilla_interactions\">Vanilla interactions\u003c/a>\u003c/h2>\n\u003cp>Use these routines when you want the game to handle an interaction, such as making a custom projectile behave like Mario&#x27;s fireball.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Routine\u003c/th>\u003cth>X on entry\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Base_RunVanillaSpriteInteraction\u003c/code>\u003c/td>\u003ctd>Current Normal sprite slot, also in \u003ccode>!SpriteIndex\u003c/code>.\u003c/td>\u003ctd>Runs the standard interaction between Normal sprites.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Base_RunVanillaFireballInteraction\u003c/code>\u003c/td>\u003ctd>Extended sprite slot.\u003c/td>\u003ctd>Runs Mario or Yoshi fireball logic according to the configured event.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Base_RunVanillaQuakeInteraction\u003c/code>\u003c/td>\u003ctd>Quake sprite slot, 0 through 3.\u003c/td>\u003ctd>Advances the timer and checks targets when appropriate.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"Event_flags_and_callbacks\">\u003ca class=\"heading-link\" href=\"#en/api/Event_flags_and_callbacks\">Event flags and callbacks\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>VanillaEventMask\u003c/code> enables notifications. \u003ccode>ActionFlag\u003c/code> accumulates the enabled bits. The code that reads them decides when to clear them. \u003ccode>VanillaResponseMask\u003c/code> controls the game&#x27;s responses. Their initial masks are \u003ccode>$00\u003c/code> for notifications and \u003ccode>$7F\u003c/code> for responses.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Bit\u003c/th>\u003cth>Event\u003c/th>\u003cth>JSON field\u003c/th>\u003cth>Y on entry\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>Shell or item impact\u003c/td>\u003ctd>\u003ccode>SpriteSprite\u003c/code>\u003c/td>\u003ctd>Other Normal sprite slot\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>Ordinary sprite collision\u003c/td>\u003ctd>\u003ccode>SpriteSprite\u003c/code>\u003c/td>\u003ctd>Other Normal sprite slot\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>Explosion\u003c/td>\u003ctd>\u003ccode>VanillaInteractionCallback\u003c/code> (fallback field)\u003c/td>\u003ctd>Explosion slot\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$08\u003c/code>\u003c/td>\u003ctd>Mario&#x27;s fireball\u003c/td>\u003ctd>\u003ccode>Fireball\u003c/code>\u003c/td>\u003ctd>Extended sprite slot\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$10\u003c/code>\u003c/td>\u003ctd>Yoshi&#x27;s fireball\u003c/td>\u003ctd>\u003ccode>YoshiFireball\u003c/code>\u003c/td>\u003ctd>Extended sprite slot\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$20\u003c/code>\u003c/td>\u003ctd>Quake\u003c/td>\u003ctd>\u003ccode>Quake\u003c/code>\u003c/td>\u003ctd>Quake sprite slot\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$40\u003c/code>\u003c/td>\u003ctd>Cape dive\u003c/td>\u003ctd>\u003ccode>CapeDive\u003c/code>\u003c/td>\u003ctd>\u003ccode>$FF\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$80\u003c/code>\u003c/td>\u003ctd>Follow-up notification for an item still in status \u003ccode>$09\u003c/code> or \u003ccode>$0A\u003c/code>\u003c/td>\u003ctd>\u003ccode>SpriteSprite\u003c/code>\u003c/td>\u003ctd>Other Normal sprite slot\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>The callback runs after the game&#x27;s response. A holds the event bit, X holds the receiving sprite slot, and Y holds the source shown above. A and the index registers are 8-bit. DBR points to the callback&#x27;s bank. Return with \u003ccode>RTL\u003c/code>, balance the stack, and preserve D and the register widths. The dispatcher restores X, Y, and DBR. It ignores Carry. Bit \u003ccode>$80\u003c/code> is notification only.\u003c/p>\n\u003ch2 id=\"Filter_collisions_between_Normal_sprites\">\u003ca class=\"heading-link\" href=\"#en/api/Filter_collisions_between_Normal_sprites\">Filter collisions between Normal sprites\u003c/a>\u003c/h2>\n\u003ch3 id=\"SetSpritePairCollision\">\u003ca class=\"heading-link\" href=\"#en/api/SetSpritePairCollision\">SetSpritePairCollision\u003c/a>\u003c/h3>\n\u003cp>Call \u003ccode>JSL !Hitman_Base_SetSpritePairCollision\u003c/code> with the two Normal sprite slots in X and Y. Use A = \u003ccode>$00\u003c/code> to block their vanilla collision or \u003ccode>$01\u003c/code> to allow it. One call sets both directions. Invalid slots and self-pairs are ignored. The routine preserves X, Y, DBR, and D and uses \u003ccode>$00–$01\u003c/code> as scratch.\u003c/p>\n\u003cp>For example, temporarily block the collision between a carrier and its passenger.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; X = carrier, Y = passenger.\nLDA #$00\nJSL !Hitman_Base_SetSpritePairCollision\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>When the passenger is released, verify that Y still identifies it and call again with \u003ccode>$01\u003c/code>. Hitman resets a slot&#x27;s pairs during initialization.\u003c/p>\n\u003ch3 id=\"SetSpriteSlotCollision\">\u003ca class=\"heading-link\" href=\"#en/api/SetSpriteSlotCollision\">SetSpriteSlotCollision\u003c/a>\u003c/h3>\n\u003cp>Call \u003ccode>JSL !Hitman_Base_SetSpriteSlotCollision\u003c/code> to change all pairs for the Normal sprite in X. Use A = \u003ccode>$00\u003c/code> to block them or \u003ccode>$01\u003c/code> to allow them. The routine uses \u003ccode>$00–$02\u003c/code> as scratch.\u003c/p>\n\u003ch2 id=\"Configure_Extended_sprites\">\u003ca class=\"heading-link\" href=\"#en/api/Configure_Extended_sprites\">Configure Extended sprites\u003c/a>\u003c/h2>\n\u003cp>Edit \u003ccode>ASM/ExtendedSpriteTablesConfig.asm\u003c/code> in the Hitman Tool folder. The macros run during installation and take an Extended sprite type number. In the game, checks take the slot of an active projectile.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Mode in \u003ccode>%SetExtendedHitboxSystem\u003c/code>\u003c/th>\u003cth>Geometry\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$00\u003c/code>\u003c/td>\u003ctd>Disabled.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>A fixed box set with \u003ccode>%SetExtendedHitbox(id, xOffset, yOffset, width, height)\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>One 8-bit RAM box. Write \u003ccode>!HitmanExtendedXOffLow\u003c/code>, \u003ccode>!HitmanExtendedYOffLow\u003c/code>, \u003ccode>!HitmanExtendedWidthLow\u003c/code>, and \u003ccode>!HitmanExtendedHeightLow\u003c/code> for the slot.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$03\u003c/code>\u003c/td>\u003ctd>One or more boxes for the current pose. Store the context plus pose in \u003ccode>!HitmanExtendedContextIDLow\u003c/code> and \u003ccode>!HitmanExtendedContextIDHigh\u003c/code> and the flip in \u003ccode>!HitmanExtendedFlip\u003c/code>, indexed by slot.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>One 16-bit RAM box. Write the \u003ccode>Low\u003c/code> and \u003ccode>High\u003c/code> bytes of each offset and dimension.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>The context and some offsets share RAM. Write the new fields when changing modes.\u003c/p>\n\u003cp>\u003ccode>%SetExtendedFireballEvent(id, event)\u003c/code> sets the response separately. Use \u003ccode>!HitmanEventFireball\u003c/code> for Mario&#x27;s fireball, \u003ccode>!HitmanEventYoshiFireball\u003c/code> for Yoshi&#x27;s, or \u003ccode>$00\u003c/code> to handle the response yourself. Mario (\u003ccode>$05\u003c/code>) and Yoshi (\u003ccode>$11\u003c/code>) have fixed boxes by default.\u003c/p>\n\u003cp>This sets Mario&#x27;s fireball box to 12 × 19 pixels, starting 32 pixels right and 4 pixels above the origin.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>%SetExtendedHitbox($05, $0020, $FFFC, $000C, $0013)\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Use \u003ca href=\"#en/api/Vanilla_interactions\">RunVanillaFireballInteraction\u003c/a> to run the vanilla response. Use \u003ca href=\"#en/api/CheckExtendedNormalPair\">CheckExtendedNormalPair\u003c/a> to detect a collision and read the result in Carry.\u003c/p>\n\u003ch2 id=\"Included_callbacks\">\u003ca class=\"heading-link\" href=\"#en/api/Included_callbacks\">Included callbacks\u003c/a>\u003c/h2>\n\u003cp>In a \u003ccode>.hitboxinfo\u003c/code> file, write the routine name, for example \u003ccode>.OnPlayerCollision CheckBounce\u003c/code>. Hitman includes the selected routines from \u003ccode>Routines/\u003c/code> and exports them as \u003ccode>!Hitman_Callback_*\u003c/code>. See \u003ca href=\"#en/formats\">Files and Formats\u003c/a> for the syntax.\u003c/p>\n\u003cp>On entry, HB1 and HB2 contain the box edges and \u003ccode>!HitmanHBStatus\u003c/code> describes their relative positions. A and the index registers are 8-bit. Y holds the historical box ID. Return with \u003ccode>RTL\u003c/code> and balance the stack. A callback can set bits in \u003ccode>!HitmanDefault\u003c/code> so the caller can decide how to respond.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Callback\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>Nothing\u003c/code>\u003c/td>\u003ctd>Returns without changing the result.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>SetBit3\u003c/code>\u003c/td>\u003ctd>Adds mask \u003ccode>$04\u003c/code> to \u003ccode>!HitmanDefault\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckBounce\u003c/code>\u003c/td>\u003ctd>Selects a Normal sprite bounce surface, records its edges, and handles the protection used when Mario is inside it.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckBounceBit2\u003c/code>, \u003ccode>CheckBounceBit3\u003c/code>\u003c/td>\u003ctd>Run \u003ccode>CheckBounce\u003c/code> and add \u003ccode>$02\u003c/code> or \u003ccode>$04\u003c/code> if the high bit of \u003ccode>$65\u003c/code> is clear.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckPlayerIsAbove\u003c/code>\u003c/td>\u003ctd>Checks Mario&#x27;s position for the bounce system and respects the inside-box protection.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ItemCheckBounce\u003c/code>, \u003ccode>ItemCheckPlayerIsAbove\u003c/code>\u003c/td>\u003ctd>Adjust those checks for the item&#x27;s status.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckBounceCluster\u003c/code>, \u003ccode>CheckBounceClusterNoYSpeed\u003c/code>\u003c/td>\u003ctd>Bounce variants for Cluster sprites.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckBounceSurface\u003c/code>\u003c/td>\u003ctd>Records a bounce surface.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>PlayerFloor\u003c/code>, \u003ccode>PlayerLeftWall\u003c/code>, \u003ccode>PlayerRightWall\u003c/code>\u003c/td>\u003ctd>Check the box as a floor, left wall, or right wall for Mario.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>DefaultBottomFloorAndDirectionWall\u003c/code>\u003c/td>\u003ctd>Tries the floor first, then chooses a wall based on the sprite&#x27;s direction.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>SolidForPlayer\u003c/code>, \u003ccode>SolidForPlayerWithSkip\u003c/code>\u003c/td>\u003ctd>Variants that treat the box as solid for Mario.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>If your sprite uses Dyzen&#x27;s bounce routines, run \u003ccode>%DyzenPrepareBounce()\u003c/code> before checking the boxes. \u003ccode>%DyzenBounce()\u003c/code> uses the result to apply a bounce. \u003ccode>%DyzenDetectPlayerIsAbove()\u003c/code> updates the protection timer. Keep the scratch values intact between those calls. The callback stores the top in \u003ccode>$6A\u003c/code>, left in \u003ccode>$6C\u003c/code>, right in \u003ccode>$6E\u003c/code>, and bottom in \u003ccode>$1487|!addr\u003c/code>.\u003c/p>\n\u003ch3 id=\"Call_a_callback_from_ASM\">\u003ca class=\"heading-link\" href=\"#en/ap

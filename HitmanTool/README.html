e>!HitmanClusterFlip,x\u003c/code>.\u003c/td>\u003ctd>Usa \u003ccode>!HitmanExtendedFlip,x\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Llama a \u003ccode>!Hitman_Base_PlayerNormalSpriteInteractionWithoutCallback\u003c/code>.\u003c/td>\u003ctd>Llama a \u003ccode>!Hitman_Base_PlayerClusterSpriteInteractionWithoutCallback\u003c/code>.\u003c/td>\u003ctd>Llama a \u003ccode>!Hitman_Base_PlayerExtendedSpriteInteractionWithoutCallback\u003c/code>.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Deja \u003ccode>BCC .SinContacto\u003c/code> para saltarte la respuesta cuando no haya choque. Si quieres que el sprite salte como en el ejemplo, usa la tabla de velocidad de su familia. \u003ccode>!SpriteYSpeed,x\u003c/code> corresponde a los Normal sprites. Si quieres usar callbacks de caja, quita \u003ccode>WithoutCallback\u003c/code> del nombre de la rutina y lee el resultado en \u003ccode>!HitmanDefault\u003c/code>.\u003c/p>\n\u003cp>Si un Extended sprite también debe participar en las comprobaciones de proyectiles contra Normal sprites, configura el modo por número de Extended sprite en \u003ccode>ASM/ExtendedSpriteTablesConfig.asm\u003c/code>. Para usar sus cajas por pose en ese recorrido, elige el modo \u003ccode>$03\u003c/code>. Consulta \u003ca href=\"#es/api/Configurar_Extended_sprites\">Configurar Extended sprites\u003c/a>.\u003c/p>\n\u003ch2 id=\"Detectar_choques_entre_sprites_desde_ASM\">\u003ca class=\"heading-link\" href=\"#es/sprites/Detectar_choques_entre_sprites_desde_ASM\">Detectar choques entre sprites desde ASM\u003c/a>\u003c/h2>\n\u003cp>Si ya tienes los dos slots, las rutinas de esta tabla te dicen si los sprites chocan. Si chocan, Carry queda en 1 y tu código decide cómo responder.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Pareja\u003c/th>\u003cth>Llamada y entradas\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Normal sprite con Normal sprite\u003c/td>\u003ctd>\u003ccode>JSL !Hitman_Base_CheckNormalPair\u003c/code>. Pon un slot normal en X y el otro en Y.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Extended sprite con Normal sprite\u003c/td>\u003ctd>\u003ccode>JSL !Hitman_Base_CheckExtendedNormalPair\u003c/code>. Pon el slot del Normal sprite en X y el del Extended sprite en Y. Configura el modo del Extended sprite antes de probarlo.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"Comparar_cajas_de_otras_familias\">\u003ca class=\"heading-link\" href=\"#es/sprites/Comparar_cajas_de_otras_familias\">Comparar cajas de otras familias\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>AnyNormalSpriteInteractionOneHitbox\u003c/code> consulta Normal sprites. Si el receptor es un Cluster sprite o un Extended sprite, usa el formato de caja que ese sprite haya configurado. Las rutinas de esta tabla sirven cuando sabes que los dos sprites usan una caja en RAM. Cada llamada recibe en X el slot de su propia familia.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Familia\u003c/th>\u003cth>Para llenar HB1\u003c/th>\u003cth>Para llenar HB2\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Normal sprite\u003c/td>\u003ctd>\u003ccode>NormalSpriteOneHitbox1\u003c/code>\u003c/td>\u003ctd>\u003ccode>NormalSpriteOneHitbox2\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cluster sprite\u003c/td>\u003ctd>\u003ccode>ClusterSpriteOneHitbox1\u003c/code>\u003c/td>\u003ctd>\u003ccode>ClusterSpriteOneHitbox2\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Extended sprite\u003c/td>\u003ctd>\u003ccode>ExtendedSpriteOneHitbox1\u003c/code>\u003c/td>\u003ctd>\u003ccode>ExtendedSpriteOneHitbox2\u003c/code>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Con las dos cajas listas, llama a \u003ccode>JSL !Hitman_Base_CheckContact\u003c/code> y lee Carry. Si una caja usa campos de 16 bits, usa la variante \u003ccode>LongOneHitbox\u003c/code> para cargarla. Si el receptor usa cajas por pose, recórrelas con \u003ccode>GetHitbox2\u003c/code> y comprueba cada HB2 contra HB1. Consulta \u003ca href=\"#es/api/Preparar_y_comparar_cajas\">Preparar y comparar cajas\u003c/a>.\u003c/p>\n\u003ch2 id=\"Bloquear_choques_entre_Normal_sprites\">\u003ca class=\"heading-link\" href=\"#es/sprites/Bloquear_choques_entre_Normal_sprites\">Bloquear choques entre Normal sprites\u003c/a>\u003c/h2>\n\u003cp>Si un sprite lleva a otro, puedes bloquear el choque entre los dos mientras estén juntos. Pon el slot del que carga en X y el del pasajero en Y. Llama a \u003ccode>SetSpritePairCollision\u003c/code> con A en \u003ccode>$00\u003c/code> para bloquear la pareja. Al soltar al pasajero, vuelve a permitir el choque con A en \u003ccode>$01\u003c/code>.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; A e índices de 8 bits. X = sprite que carga, Y = pasajero.\nLDA #$00\nJSL !Hitman_Base_SetSpritePairCollision\n\n; Al soltarlo, después de confirmar que Y sigue siendo el pasajero.\nLDA #$01\nJSL !Hitman_Base_SetSpritePairCollision\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>El cambio se aplica en ambos sentidos. Si guardas el slot del pasajero durante varios frames, comprueba que siga ocupado por el mismo sprite antes de volver a usarlo. Hitman restablece las parejas de un slot cuando lo inicializa.\u003c/p>\n\u003cp>Si quieres bloquear todas las parejas del Normal sprite en X, usa \u003ccode>!Hitman_Base_SetSpriteSlotCollision\u003c/code> con los mismos valores en A. La máscara afecta al choque vanilla entre Normal sprites. Las consultas manuales como \u003ccode>CheckNormalPair\u003c/code> siguen detectando si las cajas se cruzan. Consulta \u003ca href=\"#es/api/SetSpritePairCollision\">SetSpritePairCollision\u003c/a> y \u003ca href=\"#es/api/SetSpriteSlotCollision\">SetSpriteSlotCollision\u003c/a>.\u003c/p>\n\u003ch2 id=\"Configurar_las_tablas_de_Extended_sprites\">\u003ca class=\"heading-link\" href=\"#es/sprites/Configurar_las_tablas_de_Extended_sprites\">Configurar las tablas de Extended sprites\u003c/a>\u003c/h2>\n\u003cp>Edita \u003ccode>ASM/ExtendedSpriteTablesConfig.asm\u003c/code> en la carpeta de Hitman Tool. Las tablas se generan al instalar el parche. Configuran el choque de un Extended sprite contra Normal sprites. En las macros, el primer argumento es el número de Extended sprite que usa tu recurso. Durante el juego, las rutinas reciben el slot del proyectil.\u003c/p>\n\u003ch3 id=\"Elegir_la_hitbox\">\u003ca class=\"heading-link\" href=\"#es/sprites/Elegir_la_hitbox\">Elegir la hitbox\u003c/a>\u003c/h3>\n\u003cp>Usa \u003ccode>%SetExtendedHitboxSystem(numero, modo)\u003c/code> para elegir de dónde salen sus cajas.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Modo\u003c/th>\u003cth>Qué usa Hitman\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$00\u003c/code>\u003c/td>\u003ctd>El Extended sprite queda fuera de este recorrido.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>Una caja fija. Define su offset X, offset Y, ancho y alto con \u003ccode>%SetExtendedHitbox\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>Una caja en RAM. Guarda offsets con signo y dimensiones en los bytes \u003ccode>Low\u003c/code> de \u003ccode>!HitmanExtendedXOff\u003c/code>, \u003ccode>!HitmanExtendedYOff\u003c/code>, \u003ccode>!HitmanExtendedWidth\u003c/code> y \u003ccode>!HitmanExtendedHeight\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$03\u003c/code>\u003c/td>\u003ctd>Las cajas de la pose actual. Guarda el contexto más pose y el volteo como en la tabla de adaptación de esta guía.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>Una caja en RAM de 16 bits. Guarda tanto los bytes \u003ccode>Low\u003c/code> como los \u003ccode>High\u003c/code> de cada offset y dimensión.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Para los modos de RAM, usa el slot del Extended sprite para escribir en las tablas. Si cambias de modo, vuelve a guardar los datos que necesita el nuevo modo, porque parte de la RAM de la pose y la de los offsets se comparte.\u003c/p>\n\u003ch3 id=\"Elegir_qué_pasa_al_chocar\">\u003ca class=\"heading-link\" href=\"#es/sprites/Elegir_qu%C3%A9_pasa_al_chocar\">Elegir qué pasa al chocar\u003c/a>\u003c/h3>\n\u003cp>La geometría y la respuesta se configuran por separado. Con \u003ccode>%SetExtendedFireballEvent\u003c/code>, puedes elegir \u003ccode>!HitmanEventFireball\u003c/code> para la respuesta de la bola de fuego de Mario, \u003ccode>!HitmanEventYoshiFireball\u003c/code> para la de Yoshi o \u003ccode>$00\u003c/code> para decidir la respuesta desde tu propio código.\u003c/p>\n\u003cp>Por ejemplo, si tu proyectil usa el número \u003ccode>$20\u003c/code>, puedes darle una caja fija de 12 × 16 píxeles y hacer que se comporte como una bola de fuego de Mario.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>%SetExtendedHitboxSystem($20, $01)\n%SetExtendedHitbox($20, $0002, $FFFC, $000C, $0010)\n%SetExtendedFireballEvent($20, !HitmanEventFireball)\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>La caja empieza 2 píxeles a la derecha y 4 por encima del origen. En el ASM del proyectil, pon su slot en X y llama a \u003ccode>JSL !Hitman_Base_RunVanillaFireballInteraction\u003c/code> con A e índices de 8 bits para ejecutar ese recorrido. Si prefieres responder por tu cuenta, usa evento \u003ccode>$00\u003c/code> y llama a \u003ccode>CheckExtendedNormalPair\u003c/code> con el Normal sprite en X y el proyectil en Y.\u003c/p>\n\u003cp>Las bolas de fuego de Mario (\u003ccode>$05\u003c/code>) y Yoshi (\u003ccode>$11\u003c/code>) ya traen su modo y evento configurados. Los demás números empiezan en modo y evento \u003ccode>$00\u003c/code>. Después de editar la configuración, vuelve a instalar Hitman Tool y los recursos que usan sus defines. Consulta \u003ca href=\"#es/api/Configurar_Extended_sprites\">Configurar Extended sprites\u003c/a> para ver las tablas RAM y el contrato de cada llamada.\u003c/p>\n\u003ch2 id=\"Instalar_el_sprite\">\u003ca class=\"heading-link\" href=\"#es/sprites/Instalar_el_sprite\">Instalar el sprite\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>Añade el sprite a la lista de PIXI.\u003c/li>\n\u003cli>Ejecuta Hitman Tool con esa lista.\u003c/li>\n\u003cli>Ejecuta PIXI sobre la ROM de salida con la misma lista.\u003c/li>\n\u003cli>Si usas Hitman Tool con UberASMTool, vuelve a ejecutar UberASMTool sobre esa misma ROM.\u003c/li>\n\u003c/ol>","headings":[{"id":"Qué_necesitas","title":"Qué necesitas","level":2},{"id":"Crear_hitboxes_para_un_Normal_sprite","title":"Crear hitboxes para un Normal sprite","level":2},{"id":"Define_las_cajas_y_enlaza_los_archivos","title":"Define las cajas y enlaza los archivos","level":3},{"id":"Indica_qué_pose_está_usando_el_sprite","title":"Indica qué pose está usando el sprite","level":3},{"id":"Detectar_un_choque_con_Mario","title":"Detectar un choque con Mario","level":3},{"id":"Usar_una_sola_hitbox_en_un_Normal_sprite","title":"Usar una sola hitbox en un Normal sprite","level":3},{"id":"Usar_una_hitbox_de_16_bits","title":"Usar una hitbox de 16 bits","level":3},{"id":"Reaccionar_a_una_interacción_vanilla","title":"Reaccionar a una interacción vanilla","level":2},{"id":"Adaptar_los_ejemplos_a_Cluster_sprites_y_Extended_sprites","title":"Adaptar los ejemplos a Cluster sprites y Extended sprites","level":2},{"id":"Detectar_choques_entre_sprites_desde_ASM","title":"Detectar choques entre sprites desde ASM","level":2},{"id":"Comparar_cajas_de_otras_familias","title":"Comparar cajas de otras familias","level":3},{"id":"Bloquear_choques_entre_Normal_sprites","title":"Bloquear choques entre Normal sprites","level":2},{"id":"Configurar_las_tablas_de_Extended_sprites","title":"Configurar las tablas de Extended sprites","level":2},{"id":"Elegir_la_hitbox","title":"Elegir la hitbox","level":3},{"id":"Elegir_qué_pasa_al_chocar","title":"Elegir qué pasa al chocar","level":3},{"id":"Instalar_el_sprite","title":"Instalar el sprite","level":2}]},"uberasm":{"title":"Hitman Tool en UberASM","html":"\u003cp>Puedes usar \u003ca href=\"#es/main\">Hitman Tool\u003c/a> en un código de nivel de UberASM. Por ejemplo, puedes definir las cajas de un objeto del nivel y comprobar si choca con Mario sin usar un slot de sprite.\u003c/p>\n\u003ch2 id=\"Preparar_UberASMTool\">\u003ca class=\"heading-link\" href=\"#es/uberasm/Preparar_UberASMTool\">Preparar UberASMTool\u003c/a>\u003c/h2>\n\u003cp>En el menú de Hitman Tool, indica la carpeta de UberASMTool después de configurar PIXI. Indica también su lista si el código de UberASM incluye archivos \u003ccode>.hitboxinfo\u003c/code>. Si tu código solo necesita llamar a las rutinas de Hitman, puedes dejar la lista vacía. Hitman Tool enlaza \u003ccode>HitmanDefines.asm\u003c/code> con la biblioteca de macros de UberASMTool.\u003c/p>\n\u003cp>Si ya tienes guardada la configuración y quieres añadir UberASMTool, ejecuta \u003ccode>ht\u003c/code> sin \u003ccode>-use-settings\u003c/code> para que vuelva a mostrar las preguntas. Consulta el \u003ca href=\"#es/quick-start\">Quick Start\u003c/a> si necesitas preparar la instalación.\u003c/p>\n\u003ch2 id=\"Comprobar_si_un_objeto_choca_con_Mario\">\u003ca class=\"heading-link\" href=\"#es/uberasm/Comprobar_si_un_objeto_choca_con_Mario\">Comprobar si un objeto choca con Mario\u003c/a>\u003c/h2>\n\u003cp>Para un objeto con una sola hitbox, guarda su posición en FreeRAM y define el ancho y el alto en el ASM. Hitman puede cargar la hitbox de Mario por ti con \u003ccode>PlayerClippingRoutine\u003c/code>.\u003c/p>\n\u003cp>Reserva cuatro bytes de FreeRAM para el objeto. Define \u003ccode>!FreeRAM_ObjetoNivel\u003c/code> con una dirección libre en tu proyecto. Usa dos bytes para X y dos para Y. Inicializa la posición al cargar el nivel y actualízala cuando muevas el objeto.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>!ObjetoX = !FreeRAM_ObjetoNivel\n!ObjetoY = !FreeRAM_ObjetoNivel+2\n!ObjetoAncho = $0010\n!ObjetoAlto = $0010\n\nmain:\n    ; A e índices de 8 bits. Usa la página directa del juego.\n    JSL !Hitman_Base_PlayerClippingRoutine  ; Caja de Mario en HB2.\n\n    REP #$21\n    LDA !ObjetoX\n    ADC.w #$0100\n    STA !HitmanHB1Left\n    CLC\n    ADC.w #!ObjetoAncho\n    STA !HitmanHB1Right\n\n    LDA !ObjetoY\n    CLC\n    ADC.w #$0100\n    STA !HitmanHB1Top\n    CLC\n    ADC.w #!ObjetoAlto\n    STA !HitmanHB1Bottom\n\n    SEP #$20\n    JSL !Hitman_Base_CheckContact\n    BCC .SinChoque\n    ; Aquí va la respuesta al choque con Mario.\n.SinChoque\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>PlayerClippingRoutine\u003c/code> ya deja las coordenadas de Mario en el formato de Hitman. Solo tienes que sumar \u003ccode>$0100\u003c/code> a la posición que lees de FreeRAM. \u003ccode>CheckContact\u003c/code> compara HB1 con HB2 y deja Carry en 1 si chocan. Para este ejemplo basta con configurar la carpeta de UberASMTool en Hitman. Consulta \u003ca href=\"#es/api/Preparar_y_comparar_cajas\">Preparar y comparar cajas\u003c/a>.\u003c/p>\n\u003ch2 id=\"Usar_varias_hitboxes_en_una_pose\">\u003ca class=\"heading-link\" href=\"#es/uberasm/Usar_varias_hitboxes_en_una_pose\">Usar varias hitboxes en una pose\u003c/a>\u003c/h2>\n\u003cp>Si el objeto tiene una base y un brazo, puedes darles cajas separadas. Guarda este ejemplo como \u003ccode>ObjetoNivel.hitboxinfo\u003c/code>, junto al ASM del nivel. La pose 0 usa solo la base y la pose 1 incluye también el brazo.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>HitboxesPerPose:\n    .Pose0 0\n    .Pose1 0,1\n\nHitbox0:\n    .Width $10\n    .Height $10\n\nHitbox1:\n    .XOffset $10\n    .YOffset $04\n    .Width $10\n    .Height $08\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Añade \u003ccode>;#inchbi &quot;ObjetoNivel.hitboxinfo&quot;\u003c/code> al ASM principal y configura la lista de UberASMTool en Hitman para que encuentre el archivo. Conserva \u003ccode>!ObjetoX\u003c/code> y \u003ccode>!ObjetoY\u003c/code> del ejemplo anterior y usa este \u003ccode>main\u003c/code>. La caja de Mario sigue en HB2. Ahora Hitman calcula las cajas del objeto a partir de su posición y su pose.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>main:\n    ; A e índices de 8 bits. Usa la página directa del juego.\n    JSL !Hitman_Base_PlayerClippingRoutine\n    STZ !HitmanSprite1Flip\n\n    REP #$21\n    LDA !ObjetoX\n    ADC.w #$0100\n    STA !HitmanSprite1X\n    LDA !ObjetoY\n    CLC\n    ADC.w #$0100\n    STA !HitmanSprite1Y\n\n    LDA.w #!ObjetoNivelHitboxContext+1\n    JSL !Hitman_Base_ProcessHitBoxesWithoutCallback\n    BCC .SinChoque\n    ; Mario chocó con la base o el brazo.\n.SinChoque\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>La llamada comprueba la pose 1 y deja en HB1 la primera caja que chocó con Mario. Si el objeto cambia de pose, guarda su índice actual en FreeRAM y suma ese índice al contexto base en lugar de usar \u003ccode>+1\u003c/code>. Consulta \u003ca href=\"#es/api/ProcessHitBoxesWithoutCallback\">ProcessHitBoxesWithoutCallback\u003c/a>.\u003c/p>\n\u003ch2 id=\"Comprobar_dos_sprites_que_ya_están_en_el_nivel\">\u003ca class=\"heading-link\" href=\"#es/uberasm/Comprobar_dos_sprites_que_ya_est%C3%A1n_en_el_nivel\">Comprobar dos sprites que ya están en el nivel\u003c/a>\u003c/h2>\n\u003cp>Si tu código de UberASM ya conoce los slots de dos Normal sprites, pon uno en X y el otro en Y y llama a \u003ccode>JSL !Hitman_Base_CheckNormalPair\u003c/code> con A e índices de 8 bits. Hitman consulta la hitbox configurada de ambos y deja Carry en 1 si chocan. Si uno es un Extended sprite, usa \u003ccode>CheckExtendedNormalPair\u003c/code> con el Normal sprite en X y el Extended sprite en Y. Consulta \u003ca href=\"#es/api/Rutinas_de_interacci%C3%B3n_manual\">Rutinas de interacción manual\u003c/a>.\u003c/p>\n\u003ch2 id=\"Instalar_el_código\">\u003ca class=\"heading-link\" href=\"#es/uberasm/Instalar_el_c%C3%B3digo\">Instalar el código\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>Añade el ASM del nivel a la lista de UberASMTool.\u003c/li>\n\u003cli>Ejecuta Hitman Tool.\u003c/li>\n\u003cli>Si tu proyecto usa sprites de PIXI con Hitman, vuelve a ejecutar PIXI sobre la ROM de salida.\u003c/li>\n\u003cli>Ejecuta UberASMTool sobre esa misma ROM.\u003c/li>\n\u003c/ol>","headings":[{"id":"Preparar_UberASMTool","title":"Preparar UberASMTool","level":2},{"id":"Comprobar_si_un_objeto_choca_con_Mario","title":"Comprobar si un objeto choca con Mario","level":2},{"id":"Usar_varias_hitboxes_en_una_pose","title":"Usar varias hitboxes en una pose","level":2},{"id":"Comprobar_dos_sprites_que_ya_están_en_el_nivel","title":"Comprobar dos sprites que ya están en el nivel","level":2},{"id":"Instalar_el_código","title":"Instalar el código","level":2}]},"api":{"title":"API ASM","html":"\u003cp>Aquí puedes consultar las rutinas de \u003ca href=\"#es/main\">Hitman Tool\u003c/a> que se usan desde un sprite o desde UberASM. Si todavía estás creando las cajas de tu sprite, empieza por \u003ca href=\"#es/formats\">Archivos y Formatos\u003c/a>.\u003c/p>\n\u003ch2 id=\"Preparar_el_código\">\u003ca class=\"heading-link\" href=\"#es/api/Preparar_el_c%C3%B3digo\">Preparar el código\u003c/a>\u003c/h2>\n\u003cp>Instala Hitman Tool antes de ensamblar el código que lo usa. Las rutinas públicas aparecen como \u003ccode>!Hitman_Base_*\u003c/code> en \u003ccode>HitmanDefines.asm\u003c/code>. Utiliza las definiciones generadas para la ROM donde vas a insertar el recurso. Consulta el \u003ca href=\"#es/quick-start\">Quick Start\u003c/a> para configurar PIXI y UberASMTool.\u003c/p>\n\u003cp>Las rutinas de esta página se llaman con \u003ccode>JSL\u003c/code> y regresan con \u003ccode>RTL\u003c/code>. Salvo donde se indique otro ancho, prepara A, X e Y en 8 bits. Varias rutinas usan las mismas variables temporales. Si necesitas leer los bordes de una caja o el resultado de un callback, hazlo antes de la siguiente comprobación.\u003c/p>\n\u003ch2 id=\"Defines_de_Hitman\">\u003ca class=\"heading-link\" href=\"#es/api/Defines_de_Hitman\">Defines de Hitman\u003c/a>\u003c/h2>\n\u003cp>Usa el \u003ccode>HitmanDefines.asm\u003c/code> que generó Hitman Tool para tu ROM. Si cambias una propiedad, reubicas la RAM o vuelves a instalar el parche, vuelve a ensamblar el código que usa estos defines.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Qué representa\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Base_\u003c/code> + nombre\u003c/td>\u003ctd>Dirección de una rutina base, por ejemplo \u003ccode>!Hitman_Base_CheckNormalPair\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Callback_\u003c/code> + nombre\u003c/td>\u003ctd>Dirección de un callback incluido en la instalación, por ejemplo \u003ccode>!Hitman_Callback_SetBit3\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Prop_\u003c/code> + \u003ccode>Name\u003c/code> del JSON\u003c/td>\u003ctd>Dirección de una tabla con un byte por slot de Normal sprite.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!MiSpriteHitboxContext\u003c/code>\u003c/td>\u003ctd>Contexto que genera \u003ccode>MiSprite.hitboxinfo\u003c/code>. Suma el número de pose para elegir sus cajas.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanNormal*\u003c/code>, \u003ccode>!HitmanCluster*\u003c/code>, \u003ccode>!HitmanExtended*\u003c/code>\u003c/td>\u003ctd>Tablas por slot. Incluyen \u003ccode>ContextIDLow\u003c/code>, \u003ccode>ContextIDHigh\u003c/code>, \u003ccode>Flip\u003c/code> y los bytes \u003ccode>Low\u003c/code> y \u003ccode>High\u003c/code> de \u003ccode>XOff\u003c/code>, \u003ccode>YOff\u003c/code>, \u003ccode>Width\u003c/code> y \u003ccode>Height\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanSprite1X\u003c/code>, \u003ccode>!HitmanSprite1Y\u003c/code>, \u003ccode>!HitmanSprite1Flip\u003c/code>\u003c/td>\u003ctd>Posición y orientación temporales del objeto 1. El objeto 2 tiene los defines equivalentes con \u003ccode>Sprite2\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanHB1Left\u003c/code>, \u003ccode>!HitmanHB1Top\u003c/code>, \u003ccode>!HitmanHB1Right\u003c/code>, \u003ccode>!HitmanHB1Bottom\u003c/code>\u003c/td>\u003ctd>Bordes de 16 bits de HB1. Usa los mismos sufijos con \u003ccode>!HitmanHB2\u003c/code> para HB2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanHBStatus\u003c/code> y \u003ccode>!HitmanDefault\u003c/code>\u003c/td>\u003ctd>Relación entre las cajas y resultado acumulado de los callbacks, respectivamente.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanEventShell\u003c/code>, \u003ccode>!HitmanEventRegular\u003c/code>, \u003ccode>!HitmanEventExplosion\u003c/code>, \u003ccode>!HitmanEventFireball\u003c/code>, \u003ccode>!HitmanEventYoshiFireball\u003c/code>, \u003ccode>!HitmanEventQuake\u003c/code>, \u003ccode>!HitmanEventCapeDive\u003c/code>, \u003ccode>!HitmanEventShellHit\u003c/code>\u003c/td>\u003ctd>Máscaras de eventos vanilla. Se usan para configurar los bits o comparar el evento que llega en A.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!HitmanRAMBase\u003c/code>, \u003ccode>!HitmanRAMLimit\u003c/code>, \u003ccode>!HitmanRAMEnd\u003c/code>\u003c/td>\u003ctd>Inicio, límite reservado y fin del bloque ocupado. Consulta \u003ca href=\"#es/api/Reubicar_la_RAM_de_Hitman\">Reubicar la RAM de Hitman\u003c/a>.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"Leer_o_cambiar_una_propiedad\">\u003ca class=\"heading-link\" href=\"#es/api/Leer_o_cambiar_una_propiedad\">Leer o cambiar una propiedad\u003c/a>\u003c/h3>\n\u003cp>Si defines \u003ccode>&quot;Name&quot;: &quot;IsLarge&quot;\u003c/code> en el JSON, Hitman genera \u003ccode>!Hitman_Prop_IsLarge\u003c/code>. Usa el slot del Normal sprite en X para consultar esa propiedad. Cada instancia tiene su propio valor.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; A e índices de 8 bits. X = slot del Normal sprite que quieres consultar.\nLDA !Hitman_Prop_IsLarge,x\nBEQ .Pequeno\n; Aquí puedes aplicar la respuesta para un sprite grande.\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>También puedes cambiar el valor de esa instancia con \u003ccode>STA !Hitman_Prop_IsLarge,x\u003c/code> con A de 8 bits. El JSON proporciona el valor inicial al preparar el slot.\u003c/p>\n\u003ch2 id=\"Publicar_la_hitbox_de_un_Normal_sprite\">\u003ca class=\"heading-link\" href=\"#es/api/Publicar_la_hitbox_de_un_Normal_sprite\">Publicar la hitbox de un Normal sprite\u003c/a>\u003c/h2>\n\u003cp>Cuando otro sprite quiere saber si te toca, Hitman lee \u003ccode>!Hitman_Prop_HitboxSystem,x\u003c/code> para saber qué cajas debe comprobar. X es el slot del Normal sprite.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Valor\u003c/th>\u003cth>Geometría\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$00\u003c/code>\u003c/td>\u003ctd>Deshabilitada en los recorridos vanilla de Hitman.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>Clipping del juego. Es el valor inicial.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>Una caja en RAM con desplazamientos con signo y dimensiones de 8 bits.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$03\u003c/code>\u003c/td>\u003ctd>Las cajas de la pose activa de un contexto.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>Una caja en RAM con desplazamientos con signo y dimensiones de 16 bits.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>En modo \u003ccode>$03\u003c/code>, guarda el contexto más el número de pose en \u003ccode>!HitmanNormalContextIDLow,x\u003c/code> y \u003ccode>!HitmanNormalContextIDHigh,x\u003c/code>. Guarda el volteo en \u003ccode>!HitmanNormalFlip,x\u003c/code> (\u003ccode>0\u003c/code> normal, \u003ccode>1\u003c/code> horizontal, \u003ccode>2\u003c/code> vertical y \u003ccode>3\u003c/code> ambos). Actualiza estos datos al cambiar la pose o la orientación. Así, otro sprite puede consultar las cajas del receptor.\u003c/p>\n\u003ch2 id=\"Interacciones_vanilla\">\u003ca class=\"heading-link\" href=\"#es/api/Interacciones_vanilla\">Interacciones vanilla\u003c/a>\u003c/h2>\n\u003cp>Usa estas rutinas cuando quieras que el juego se encargue de la interacción. Por ejemplo, un proyectil custom puede comportarse como una bola de fuego de Mario.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Rutina\u003c/th>\u003cth>Entrada en X\u003c/th>\u003cth>Qué ejecuta\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Base_RunVanillaSpriteInteraction\u003c/code>\u003c/td>\u003ctd>Slot normal actual, también en \u003ccode>!SpriteIndex\u003c/code>.\u003c/td>\u003ctd>Interacción entre Normal sprites.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Base_RunVanillaFireballInteraction\u003c/code>\u003c/td>\u003ctd>Slot del Extended sprite.\u003c/td>\u003ctd>Recorrido de bolas de fuego de Mario o Yoshi, según el evento configurado.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>!Hitman_Base_RunVanillaQuakeInteraction\u003c/code>\u003c/td>\u003ctd>Slot del Quake sprite, de 0 a 3.\u003c/td>\u003ctd>Avanza el temporizador y comprueba los receptores cuando corresponde.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"Flags_y_callbacks_de_eventos\">\u003ca class=\"heading-link\" href=\"#es/api/Flags_y_callbacks_de_eventos\">Flags y callbacks de eventos\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>VanillaEventMask\u003c/code> habilita la notificación de cada evento. \u003ccode>ActionFlag\u003c/code> acumula los bits y el código que los consume decide cuándo limpiarlos. \u003ccode>VanillaResponseMask\u003c/code> controla las respuestas del juego. Los valores iniciales de las máscaras son \u003ccode>$00\u003c/code> y \u003ccode>$7F\u003c/code>, respectivamente.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Bit\u003c/th>\u003cth>Evento\u003c/th>\u003cth>Campo de \u003ccode>VanillaCallbacks\u003c/code>\u003c/th>\u003cth>Y al entrar\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>Impacto de caparazón o ítem\u003c/td>\u003ctd>\u003ccode>SpriteSprite\u003c/code>\u003c/td>\u003ctd>Slot normal de la contraparte\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>Contacto regular entre sprites\u003c/td>\u003ctd>\u003ccode>SpriteSprite\u003c/code>\u003c/td>\u003ctd>Slot normal de la contraparte\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>Explosión\u003c/td>\u003ctd>\u003ccode>VanillaInteractionCallback\u003c/code> (campo de respaldo del JSON)\u003c/td>\u003ctd>Slot de la explosión\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$08\u003c/code>\u003c/td>\u003ctd>Bola de fuego de Mario\u003c/td>\u003ctd>\u003ccode>Fireball\u003c/code>\u003c/td>\u003ctd>Slot del Extended sprite\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$10\u003c/code>\u003c/td>\u003ctd>Bola de fuego de Yoshi\u003c/td>\u003ctd>\u003ccode>YoshiFireball\u003c/code>\u003c/td>\u003ctd>Slot del Extended sprite\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$20\u003c/code>\u003c/td>\u003ctd>Quake\u003c/td>\u003ctd>\u003ccode>Quake\u003c/code>\u003c/td>\u003ctd>Slot del Quake sprite\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$40\u003c/code>\u003c/td>\u003ctd>Cape dive\u003c/td>\u003ctd>\u003ccode>CapeDive\u003c/code>\u003c/td>\u003ctd>\u003ccode>$FF\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$80\u003c/code>\u003c/td>\u003ctd>Aviso posterior para un ítem que sigue en estado \u003ccode>$09\u003c/code> o \u003ccode>$0A\u003c/code>\u003c/td>\u003ctd>\u003ccode>SpriteSprite\u003c/code>\u003c/td>\u003ctd>Slot normal de la contraparte\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>El callback se ejecuta después de la respuesta del juego. Recibe en A el bit del evento actual, en X el slot del receptor y en Y el origen indicado en la tabla. A e índices entran en 8 bits y DBR apunta al banco del callback. Regresa con \u003ccode>RTL\u003c/code>, la pila balanceada y D y los anchos de registro preservados. El despachador restaura X, Y y DBR. Carry se ignora. El bit \u003ccode>$80\u003c/code> solo genera una notificación.\u003c/p>\n\u003ch2 id=\"Filtrar_el_contacto_entre_Normal_sprites\">\u003ca class=\"heading-link\" href=\"#es/api/Filtrar_el_contacto_entre_Normal_sprites\">Filtrar el contacto entre Normal sprites\u003c/a>\u003c/h2>\n\u003ch3 id=\"SetSpritePairCollision\">\u003ca class=\"heading-link\" href=\"#es/api/SetSpritePairCollision\">SetSpritePairCollision\u003c/a>\u003c/h3>\n\u003cp>Permite o bloquea el contacto vanilla entre dos slots normales. Pasa los slots en X e Y y usa A en \u003ccode>$00\u003c/code> para bloquear o \u003ccode>$01\u003c/code> para permitir. Con una sola llamada bloqueas el contacto en ambos sentidos. La rutina preserva X, Y, DBR y D, usa \u003ccode>$00–$01\u003c/code> como scratch e ignora slots inválidos y pares formados por el mismo slot.\u003c/p>\n\u003cp>Por ejemplo, un sprite que transporta a otro puede bloquear temporalmente el contacto entre ambos.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; X = sprite que carga, Y = pasajero.\nLDA #$00\nJSL !Hitman_Base_SetSpritePairCollision\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Al soltar al pasajero, comprueba que Y siga siendo su slot y repite la llamada con A en \u003ccode>$01\u003c/code>. Hitman restablece los pares al inicializar un slot.\u003c/p>\n\u003ch3 id=\"SetSpriteSlotCollision\">\u003ca class=\"heading-link\" href=\"#es/api/SetSpriteSlotCollision\">SetSpriteSlotCollision\u003c/a>\u003c/h3>\n\u003cp>Aplica el mismo cambio a todas las parejas del slot normal X. Usa A en \u003ccode>$00\u003c/code> para bloquear o \u003ccode>$01\u003c/code> para permitir. La rutina usa \u003ccode>$00–$02\u003c/code> como memoria temporal.\u003c/p>\n\u003ch2 id=\"Configurar_Extended_sprites\">\u003ca class=\"heading-link\" href=\"#es/api/Configurar_Extended_sprites\">Configurar Extended sprites\u003c/a>\u003c/h2>\n\u003cp>Edita \u003ccode>ASM/ExtendedSpriteTablesConfig.asm\u003c/code> en la carpeta de Hitman Tool. Las macros se evalúan al instalar el parche. En estas macros escribes el número del proyectil. Por ejemplo, \u003ccode>$05\u003c/code> identifica las bolas de fuego de Mario. Cuando hagas una comprobación durante el juego, pasa el slot de la bola de fuego que quieres comprobar.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Modo de \u003ccode>%SetExtendedHitboxSystem\u003c/code>\u003c/th>\u003cth>Geometría\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$00\u003c/code>\u003c/td>\u003ctd>Deshabilitada.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>Caja fija definida por \u003ccode>%SetExtendedHitbox(id, xOffset, yOffset, width, height)\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>Caja en RAM con offsets con signo y dimensiones de 8 bits. Publica X/Y en las tablas \u003ccode>!HitmanExtendedXOffLow\u003c/code> y \u003ccode>!HitmanExtendedYOffLow\u003c/code>, y el tamaño en \u003ccode>!HitmanExtendedWidthLow\u003c/code> y \u003ccode>!HitmanExtendedHeightLow\u003c/code>, indexadas por slot.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$03\u003c/code>\u003c/td>\u003ctd>Cajas por pose. Publica los dos bytes de contexto más pose en \u003ccode>!HitmanExtendedContextIDLow\u003c/code> y \u003ccode>!HitmanExtendedContextIDHigh\u003c/code> y la orientación en \u003ccode>!HitmanExtendedFlip\u003c/code>, indexados por slot.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>Caja en RAM de 16 bits. Publica las partes \u003ccode>Low\u003c/code> y \u003ccode>High\u003c/code> de cada offset y dimensión.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>El contexto y algunos desplazamientos usan los mismos bytes. Si pasas de cajas por pose a una caja en RAM, vuelve a guardar sus desplazamientos y dimensiones antes de comprobarla.\u003c/p>\n\u003cp>\u003ccode>%SetExtendedFireballEvent(id, event)\u003c/code> configura la respuesta independientemente de la geometría. Usa \u003ccode>!HitmanEventFireball\u003c/code> para la respuesta de bola de fuego de Mario, \u003ccode>!HitmanEventYoshiFireball\u003c/code> para la de Yoshi o \u003ccode>$00\u003c/code> si el proyectil decide su propia respuesta. Mario (\u003ccode>$05\u003c/code>) y Yoshi (\u003ccode>$11\u003c/code>) usan cajas fijas por defecto.\u003c/p>\n\u003cp>Por ejemplo, esta línea cambia la caja fija de la bola de fuego de Mario. La caja mide 12 × 19 píxeles y empieza 32 píxeles a la derecha y 4 por encima del origen.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>%SetExtendedHitbox($05, $0020, $FFFC, $000C, $0013)\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Para aplicar la respuesta vanilla desde un proyectil llama a \u003ca href=\"#es/api/Interacciones_vanilla\">RunVanillaFireballInteraction\u003c/a>. Para consultar si un proyectil toca a un Normal sprite usa \u003ca href=\"#es/api/CheckExtendedNormalPair\">CheckExtendedNormalPair\u003c/a> y lee Carry.\u003c/p>\n\u003ch2 id=\"Callbacks_incluidos\">\u003ca class=\"heading-link\" href=\"#es/api/Callbacks_incluidos\">Callbacks incluidos\u003c/a>\u003c/h2>\n\u003cp>En un \u003ccode>.hitboxinfo\u003c/code> escribe el nombre de la rutina, por ejemplo \u003ccode>.OnPlayerCollision CheckBounce\u003c/code>. Hitman incorpora las rutinas seleccionadas desde \u003ccode>Routines/\u003c/code> y exporta sus direcciones como \u003ccode>!Hitman_Callback_*\u003c/code>. Para la sintaxis de cada formato, consulta \u003ca href=\"#es/formats\">Archivos y Formatos\u003c/a>.\u003c/p>\n\u003cp>Dentro de un callback puedes leer los bordes de las dos cajas en HB1 y HB2, o consultar su posición relativa en \u003ccode>!HitmanHBStatus\u003c/code>. A, X e Y están en 8 bits y Y contiene el ID histórico de la caja. Regresa con \u003ccode>RTL\u003c/code> y deja balanceada la pila. Los callbacks pueden acumular bits en \u003ccode>!HitmanDefault\u003c/code>, que el código llamador consume para decidir qué respuesta aplicar.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Callback\u003c/th>\u003cth>Uso\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>Nothing\u003c/code>\u003c/td>\u003ctd>Retorna sin cambiar el resultado.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>SetBit3\u003c/code>\u003c/td>\u003ctd>Añade la máscara \u003ccode>$04\u003c/code> a \u003ccode>!HitmanDefault\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckBounce\u003c/code>\u003c/td>\u003ctd>Selecciona una superficie de rebote para un Normal sprite, registra sus bordes y distingue la protección cuando Mario está dentro.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckBounceBit2\u003c/code>, \u003ccode>CheckBounceBit3\u003c/code>\u003c/td>\u003ctd>Ejecutan \u003ccode>CheckBounce\u003c/code> y añaden \u003ccode>$02\u003c/code> o \u003ccode>$04\u003c/code> si el bit alto de \u003ccode>$65\u003c/code> está apagado.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckPlayerIsAbove\u003c/code>\u003c/td>\u003ctd>Comprueba la posición de Mario para el sistema de rebote, respetando la protección interior.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ItemCheckBounce\u003c/code>, \u003ccode>ItemCheckPlayerIsAbove\u003c/code>\u003c/td>\u003ctd>Adaptan esas comprobaciones al estado de un ítem.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckBounceCluster\u003c/code>, \u003ccode>CheckBounceClusterNoYSpeed\u003c/code>\u003c/td>\u003ctd>Variantes de rebote para Cluster sprites.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckBounceSurface\u003c/code>\u003c/td>\u003ctd>Registra una superficie para la respuesta de rebote.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>PlayerFloor\u003c/code>, \u003ccode>PlayerLeftWall\u003c/code>, \u003ccode>PlayerRightWall\u003c/code>\u003c/td>\u003ctd>Comprueban la caja como suelo, pared izquierda o pared derecha para Mario.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>DefaultBottomFloorAndDirectionWall\u003c/code>\u003c/td>\u003ctd>Prueba primero el suelo. Si la prueba falla, selecciona una pared según la dirección del sprite.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>SolidForPlayer\u003c/code>, \u003ccode>SolidForPlayerWithSkip\u003c/code>\u003c/td>\u003ctd>Variantes para tratar la caja como una superficie sólida para Mario.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Si tu sprite usa las rutinas de rebote de Dyzen, ejecuta \u003ccode>%DyzenPrepareBounce()\u003c/code> antes de recorrer las cajas. \u003ccode>%DyzenBounce()\u003c/code> usa el resultado para aplicar el rebote y \u003ccode>%DyzenDetectPlayerIsAbove()\u003c/code> actualiza el temporizador de protección interior. Conserva el scratch de ese recorrido entre las llamadas. El callback guarda los bordes en \u003ccode>$6A\u003c/code> (arriba), \u003ccode>$6C\u003c/code> (izquierda), \u003ccode>$6E\u003c/code> (derecha) y \u003ccode>$1487|!addr\u003c/code> (abajo).\u003c/p>\n\u003ch3 id=\"Llamar_un_callback_desde_ASM\">\u003ca class=\"heading-link\" href=\"#es/api/Llamar_un_callback_desde_ASM\">Llamar un callback desde ASM\u003c/a>\u003c/h3>\n\u003cp>Si Hitman incluyó el callback al instalar, llama a su define con \u003ccode>JSL !Hitman_Callback_Nombre\u003c/code>. El callback vuelve con \u003ccode>RTL\u003c/code>. Prepara los registros y las variables que espera esa rutina. Por ejemplo, un callback que comprueba una pared necesita que HB1 y HB2 ya contengan las cajas.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; A en 8 bits y !HitmanDefault ya inicializado para esta comprobación.\nJSL !Hitman_Callback_SetBit3\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>SetBit3\u003c/code> añade \u003ccode>$04\u003c/code> a \u003ccode>!HitmanDefault\u003c/code>. La llamada por sí sola no comprueba colisión. Para que Hitman incluya un callback, decláralo en la configuración que lo usa o en \u003ccode>Dependencies:\u003c/code> de un HitboxInfo legacy. Consulta \u003ca href=\"#es/formats/Incluir_rutinas_auxiliares\">Incluir rutinas auxiliares\u003c/a>.\u003c/p>\n\u003ch3 id=\"Crear_un_callback\">\u003ca class=\"heading-link\" href=\"#es/api/Crear_un_callback\">Crear un callback\u003c/a>\u003c/h3>\n\u003cp>Crea \u003ccode>Routines/RegistrarContacto.asm\u003c/code> dentro de la carpeta de Hitman Tool. El nombre de la etiqueta debe coincidir con el del archivo, sin \u003ccode>.asm\u003c/code>. En este ejemplo, el callback marca el bit \u003ccode>$01\u003c/code> de \u003ccode>!HitmanDefault\u003c/code> para que el sprite sepa que tocó a Mario.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>RegistrarContacto:\n    LDA #$01\n    TSB.b !HitmanDefault\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>En el \u003ccode>.hitboxinfo\u003c/code>, añade esta línea dentro de la caja que debe activar el callback.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>    .OnPlayerCollision RegistrarContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Vuelve a ejecutar Hitman Tool. Al leer el archivo de hitboxes, incluirá la rutina en el parche y generará \u003ccode>!Hitman_Callback_RegistrarContacto\u003c/code>. Después de insertar el sprite con PIXI, Hitman ejecutará el callback al comprobar el contacto con esa caja. Si necesitas llamarlo tú mismo desde ASM, usa \u003ccode>JSL !Hitman_Callback_RegistrarContacto\u003c/code> con A de 8 bits y el acumulador de resultados ya preparado.\u003c/p>\n\u003ch2 id=\"Crear_una_rutina_base\">\u003ca class=\"heading-link\" href=\"#es/api/Crear_una_rutina_base\">Crear una rutina base\u003c/a>\u003c/h2>\n\u003cp>Usa una rutina base para compartir código entre sprites o recursos de UberASM. Por ejemplo, puedes crear una rutina que devuelva en Carry si el Normal sprite de X tiene activa la propiedad \u003ccode>IsLarge\u003c/code>.\u003c/p>\n\u003cp>Crea \u003ccode>Patch/BaseRoutines/EsSpriteGrande.asm\u003c/code> y ponle una etiqueta con el mismo nombre que el archivo. Este ejemplo requiere que hayas definido \u003ccode>IsLarge\u003c/code> en \u003ccode>CustomProperties/\u003c/code>.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; Entrada: A e índices de 8 bits. X = slot de un Normal sprite.\n; Salida: C = 1 si IsLarge es distinto de cero. X e Y se conservan.\nEsSpriteGrande:\n    LDA !Hitman_Prop_IsLarge,x\n    CMP #$01\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Hitman incluye automáticamente los archivos \u003ccode>.asm\u003c/code> que encuentra directamente en \u003ccode>Patch/BaseRoutines/\u003c/code>. Vuelve a ejecutar la instalación para que genere \u003ccode>!Hitman_Base_EsSpriteGrande\u003c/code>. Luego vuelve a ensamblar los recursos con PIXI o UberASMTool sobre la ROM de salida. Usa la nueva definición así:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>    JSL !Hitman_Base_EsSpriteGrande\n    BCC .Pequeno\n    ; Aplica aquí la respuesta para un sprite grande.\n.Pequeno\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Usa nombres únicos para las etiquetas de entrada y documenta qué espera y qué modifica cada rutina. Los archivos \u003ccode>Patch/Files/Includes.asm\u003c/code> y \u003ccode>HitmanDefines.asm\u003c/code> se regeneran al instalar. Basta con añadir el archivo fuente en la carpeta correspondiente.\u003c/p>\n\u003ch2 id=\"Reubicar_la_RAM_de_Hitman\">\u003ca class=\"heading-link\" href=\"#es/api/Reubicar_la_RAM_de_Hitman\">Reubicar la RAM de Hitman\u003c/a>\u003c/h2>\n\u003cp>Hitman guarda sus tablas de sprites, sus propiedades y los filtros de contacto en un bloque de RAM. Si otro parche usa esa zona, puedes mover el bloque entero. La última columna indica la primera dirección que queda fuera de la reserva.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>ROM\u003c/th>\u003cth>Base\u003c/th>\u003cth>Límite exclusivo\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>LoROM\u003c/td>\u003ctd>\u003ccode>$7FAC40\u003c/code>\u003c/td>\u003ctd>\u003ccode>$7FAF00\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>LoROM con Free7E2000 reconocido\u003c/td>\u003ctd>\u003ccode>$7E7000\u003c/code>\u003c/td>\u003ctd>\u003ccode>$7E7D00\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>SA-1\u003c/td>\u003ctd>\u003ccode>$408000\u003c/code>\u003c/td>\u003ctd>\u003ccode>$409400\u003c/code>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003col>\n\u003cli>Consulta el rango ocupado y la cantidad de bytes en el log de instalación. Cada propiedad personalizada añade un byte por slot normal.\u003c/li>\n\u003cli>Elige un rango disponible para tu ROM que tenga espacio para todas las tablas, que no cruce de banco y que puedas usar junto con Dynamic Xtreme y los demás parches.\u003c/li>\n\u003cli>En \u003ccode>ASM/HitmanDefines.asm\u003c/code> de la distribución, asigna la primera dirección a \u003ccode>!HitmanRAMBase\u003c/code> y la primera dirección fuera de la reserva a \u003ccode>!HitmanRAMLimit\u003c/code>. Configura ambos valores juntos. En el código fuente, la plantilla está en \u003ccode>HitmanBackend/ASM/HitmanDefines.asm\u003c/code>.\u003c/li>\n\u003cli>Reinstala Hitman y comprueba que \u003ccode>!HitmanRAMEnd\u003c/code>, el extremo exclusivo usado, no supere el límite elegido. Vuelve a ensamblar los recursos de PIXI y UberASM con los defines nuevos.\u003c/li>\n\u003c/ol>\n\u003cp>La reubicación cambia las tablas persistentes. HB1, HB2, \u003ccode>!HitmanHBStatus\u003c/code> y \u003ccode>!HitmanDefault\u003c/code> siguen siendo memoria temporal de colisión.\u003c/p>\n\u003ch2 id=\"Rutinas_de_interacción_manual\">\u003ca class=\"heading-link\" href=\"#es/api/Rutinas_de_interacci%C3%B3n_manual\">Rutinas de interacción manual\u003c/a>\u003c/h2>\n\u003cp>Si la rutina recibe una pose en A, calcula \u003ccode>contexto base + pose actual\u003c/code> antes de cada llamada. Lee la pose de la variable que usa tu sprite para animarse. Las tablas \u003ccode>ContextIDLow\u003c/code> y \u003ccode>ContextIDHigh\u003c/code> guardan el contexto publicado para que otros recursos puedan consultar esa hitbox.\u003c/p>\n\u003ch3 id=\"CheckNormalPair\">\u003ca class=\"heading-link\" href=\"#es/api/CheckNormalPair\">CheckNormalPair\u003c/a>\u003c/h3>\n\u003cp>Usa \u003ccode>JSL !Hitman_Base_CheckNormalPair\u003c/code> si ya tienes los slots de los dos Normal sprites en X e Y. Si se tocan, Carry queda en 1. Puedes seguir usando X, Y, DBR y D después de la llamada. La comprobación reutiliza la memoria temporal de colisión. Si has bloqueado la pareja con \u003ccode>SetSpritePairCollision\u003c/code>, el bloqueo se aplica al recorrido vanilla.\u003c/p>\n\u003ch3 id=\"CheckExtendedNormalPair\">\u003ca class=\"heading-link\" href=\"#es/api/CheckExtendedNormalPair\">CheckExtendedNormalPair\u003c/a>\u003c/h3>\n\u003cp>Si quieres saber si un proyectil toca a un Normal sprite, pon el slot del Normal sprite en X y el del proyectil en Y. Llama a \u003ccode>JSL !Hitman_Base_CheckExtendedNormalPair\u003c/code> y comprueba Carry. Con Carry en 1 puedes aplicar tu propia respuesta al impacto. La rutina conserva X, Y, DBR y D, y reutiliza la memoria temporal de colisión.\u003c/p>\n\u003ch3 id=\"ProcessHitBoxesWithoutCallback\">\u003ca class=\"heading-link\" href=\"#es/api/ProcessHitBoxesWithoutCallback\">ProcessHitBoxesWithoutCallback\u003c/a>\u003c/h3>\n\u003cp>Compara las cajas de una pose contra un rectángulo preparado en HB2. Puedes llamar a esta rutina desde UberASM para comprobar una zona sin reservar un slot de sprite.\u003c/p>\n\u003cul>\n\u003cli>Con A en 16 bits, pasa el contexto más el número de pose. Entra con índices de 8 bits y la página directa del juego.\u003c/li>\n\u003cli>Guarda el origen de la pose en \u003ccode>!HitmanSprite1X\u003c/code> y \u003ccode>!HitmanSprite1Y\u003c/code>. Prepara \u003ccode>!HitmanSprite1Flip\u003c/code> y los cuatro bordes de HB2 (\u003ccode>!HitmanHB2Left\u003c/code>, \u003ccode>!HitmanHB2Top\u003c/code>, \u003ccode>!HitmanHB2Right\u003c/code> y \u003ccode>!HitmanHB2Bottom\u003c/code>).\u003c/li>\n\u003cli>Suma \u003ccode>$0100\u003c/code> a cada coordenada del origen y a cada borde antes de guardarlos.\u003c/li>\n\u003cli>Carry queda en 1 al encontrar contacto y HB1 contiene la primera caja que tocó el rectángulo. Carry queda en 0 si ninguna caja toca la zona. A e índices regresan en 8 bits. Trata A, Y, HB1 y los punteros temporales de hitbox como scratch.\u003c/li>\n\u003c/ul>\n\u003cp>Con las coordenadas y el volteo ya preparados, esta llamada comprueba la pose 0 de \u003ccode>Zone.hitboxinfo\u003c/code>.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>REP #$20\nLDA.w #!ZoneHitboxContext\nJSL !Hitman_Base_ProcessHitBoxesWithoutCallback\nBCC .SinContacto\n; HB1 contiene la caja que tocó la zona.\n.SinContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"PlayerNormalSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#es/api/PlayerNormalSpriteInteraction\">PlayerNormalSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>Comprueba las cajas de una pose de un Normal sprite contra Mario y ejecuta los callbacks correspondientes. Pasa el slot en X, el volteo en \u003ccode>!HitmanSprite1Flip\u003c/code> y el contexto más la pose en A de 16 bits. Entra con índices de 8 bits. Según la distancia, el frame, el estado de Mario y el lado del escenario en que esté, Hitman puede saltarse la comprobación.\u003c/p>\n\u003cp>Carry indica si los callbacks dejaron un valor distinto de cero en \u003ccode>!HitmanDefault\u003c/code>. Un contacto puede dejar Carry en 0 si el callback no escribe un resultado. La llamada devuelve A a 8 bits.\u003c/p>\n\u003ch3 id=\"PlayerSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#es/api/PlayerSpriteInteraction\">PlayerSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Llamada.\u003c/strong> Usa \u003ccode>JSL !Hitman_Base_PlayerNormalSpriteInteraction\u003c/code>, \u003ccode>JSL !Hitman_Base_PlayerClusterSpriteInteraction\u003c/code> o \u003ccode>JSL !Hitman_Base_PlayerExtendedSpriteInteraction\u003c/code> según la familia. Con X e Y de 8 bits, pasa el slot del sprite en X, el contexto más la pose en A de 16 bits y el volteo en \u003ccode>!HitmanSprite1Flip\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Resultado.\u003c/strong> Las tres llamadas comparan las cajas de la pose con Mario. Si algún callback deja un resultado en \u003ccode>!HitmanDefault\u003c/code>, Carry queda en 1. Si solo quieres saber si el sprite toca a Mario, usa \u003ccode>InteractionWithoutCallback\u003c/code> con los mismos datos. Carry queda en 1 en cuanto una caja toca a Mario. Las variantes \u003ccode>OneHitboxInteraction\u003c/code> y \u003ccode>OneLongHitboxInteraction\u003c/code> entran con A también de 8 bits, leen una caja de las tablas RAM del slot y devuelven Carry de contacto. La primera lee dimensiones y offsets de 8 bits y la segunda de 16. Las llamadas regresan con A de 8 bits.\u003c/p>\n\u003cp>El cálculo es igual para Normal sprites, Cluster sprites y Extended sprites. \u003ccode>REP #$21\u003c/code> pone A en 16 bits y limpia Carry para la suma. \u003ccode>AND.w #$00FF\u003c/code> conserva solo el byte de la pose.\u003c/p>\n\u003cp>\u003cstrong>Ejemplo.\u003c/strong> En un Extended sprite sin volteo, usa la pose actual. \u003ccode>!PoseIndex\u003c/code> guarda el índice de la pose actual del sprite. Puedes definir tu propia tabla de un byte por slot y actualizarla al cambiar de pose. Si usas Dynamic Xtreme, puedes leer \u003ccode>!LastPoseIndex,x\u003c/code> en su lugar cuando tenga una pose válida y uses los mismos índices en el archivo de hitboxes.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; A e índices de 8 bits al comenzar. X = slot extended.\nSTZ.b !HitmanSprite1Flip\nLDA !PoseIndex,x\nREP #$21\nAND.w #$00FF\nADC.w #!MiProyectilHitboxContext\nJSL !Hitman_Base_PlayerExtendedSpriteInteractionWithoutCallback\nBCC .SinContacto\n; Aplica aquí la respuesta del proyectil.\n.SinContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"CapeSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#es/api/CapeSpriteInteraction\">CapeSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Llamada.\u003c/strong> Usa \u003ccode>JSL\u003c/code> con \u003ccode>!Hitman_Base_CapeNormalSpriteInteraction\u003c/code>, \u003ccode>!Hitman_Base_CapeClusterSpriteInteraction\u003c/code> o \u003ccode>!Hitman_Base_CapeExtendedSpriteInteraction\u003c/code>. X identifica el slot, A de 16 bits lleva el contexto más pose y \u003ccode>!HitmanSprite1Flip\u003c/code> contiene la orientación. Los índices entran en 8 bits.\u003c/p>\n\u003cp>\u003cstrong>Resultado.\u003c/strong> Comprueba la capa giratoria contra la pose y regresa con A de 8 bits. Carry indica un resultado en \u003ccode>!HitmanDefault\u003c/code> en las variantes con callbacks y contacto geométrico en las variantes \u003ccode>WithoutCallback\u003c/code>. Si la capa no está girando, devuelve Carry en 0. Puedes utilizar el ejemplo anterior cambiando la llamada por \u003ccode>!Hitman_Base_CapeExtendedSpriteInteractionWithoutCallback\u003c/code>.\u003c/p>\n\u003ch3 id=\"FireballNormalSpriteInteraction_y_YoshiFireballNormalSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#es/api/FireballNormalSpriteInteraction_y_YoshiFireballNormalSpriteInteraction\">FireballNormalSpriteInteraction y YoshiFireballNormalSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Llamada.\u003c/strong> Usa \u003ccode>JSL !Hitman_Base_FireballNormalSpriteInteraction\u003c/code> para las bolas de fuego de Mario o \u003ccode>JSL !Hitman_Base_YoshiFireballNormalSpriteInteraction\u003c/code> para el recorrido manual histórico. X es el receptor normal y A de 16 bits contiene contexto más pose. Prepara \u003ccode>!HitmanSprite1Flip\u003c/code> e índices de 8 bits.\u003c/p>\n\u003cp>\u003cstrong>Resultado.\u003c/strong> Estas rutinas buscan proyectiles y comprueban si tocan las cajas del sprite. En la implementación actual, las cuatro variantes \u003ccode>YoshiFireballNormalSprite*\u003c/code> saltan los slots con ID \u003ccode>$11\u003c/code>. Para detectar un proyectil concreto de Yoshi, selecciona su slot y usa \u003ccode>CheckExtendedNormalPair\u003c/code>. Carry en 1 indica un resultado de esas acciones. \u003ccode>InteractionWithoutCallback\u003c/code> usa las mismas entradas y devuelve contacto geométrico. \u003ccode>OneHitboxInteraction\u003c/code> y \u003ccode>OneLongHitboxInteraction\u003c/code> toman X con A e índices de 8 bits y consultan una caja RAM de 8 o 16 bits. Para proyectiles custom configurados por número, usa \u003ca href=\"#es/api/CheckExtendedNormalPair\">CheckExtendedNormalPair\u003c/a> desde una pareja conocida.\u003c/p>\n\u003ch3 id=\"Recorrer_Normal_sprites\">\u003ca class=\"heading-link\" href=\"#es/api/Recorrer_Normal_sprites\">Recorrer Normal sprites\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Llamada.\u003c/strong> Usa \u003ccode>JSL\u003c/code> con una de estas entradas y el prefijo \u003ccode>!Hitman_Base_\u003c/code>.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Entrada\u003c/th>\u003cth>Origen y receptores\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalNormalSpriteInteractionLoop\u003c/code>\u003c/td>\u003ctd>Sprite normal contra otros Normal sprites.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalItemSpriteInteractionLoop\u003c/code>\u003c/td>\u003ctd>Sprite normal contra ítems en los estados admitidos.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ClusterNormalSpriteInteractionLoop\u003c/code>\u003c/td>\u003ctd>Sprite cluster contra Normal sprites.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ExtendedNormalSpriteInteractionLoop\u003c/code>\u003c/td>\u003ctd>Sprite extendido contra Normal sprites.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Pasa el slot de origen en X y mantenlo también en \u003ccode>!SpriteIndex\u003c/code>. Pasa A de 16 bits con el contexto más pose, índices de 8 bits y el volteo en \u003ccode>!HitmanSprite1Flip\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Resultado.\u003c/strong> Carry en 1 indica que se encontró un receptor y Y indica su slot. X vuelve al origen. Con callbacks, el recorrido se detiene cuando las acciones producen un resultado. Si solo quieres el primer sprite que toque al origen, usa la variante \u003ccode>WithoutCallback\u003c/code>. Cada recorrido aplica sus propios filtros.\u003c/p>\n\u003cp>\u003cstrong>Ejemplo.\u003c/strong> Busca el primer Normal sprite que toque las cajas de la pose actual del Extended sprite.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; X y !SpriteIndex identifican al extended. Flip ya preparado.\nLDA !PoseIndex,x\nREP #$21\nAND.w #$00FF\nADC.w #!MiProyectilHitboxContext\nJSL !Hitman_Base_ExtendedNormalSpriteInteractionLoopWithoutCallback\nBCC .SinContacto\n; Y identifica el receptor normal.\n.SinContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"AnyNormalSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#es/api/AnyNormalSpriteInteraction\">AnyNormalSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Llamada.\u003c/strong> \u003ccode>JSL !Hitman_Base_AnyNormalSpriteInteraction\u003c/code> toma X como slot normal receptor y \u003ccode>!SpriteIndex\u003c/code> como slot del origen. Prepara antes la posición, contexto y volteo del origen en las variables \u003ccode>!HitmanSprite1*\u003c/code>. Entra en 8 bits. La variante \u003ccode>WithoutCallback\u003c/code> usa los mismos datos del origen.\u003c/p>\n\u003cp>\u003cstrong>Resultado.\u003c/strong> Hitman lee las cajas que tenga configuradas el receptor. Con callbacks, Carry indica que las acciones produjeron un resultado. Con \u003ccode>WithoutCallback\u003c/code>, Carry indica que las cajas se tocan. \u003ccode>JSL !Hitman_Base_AnyNormalSpriteInteractionOneHitbox\u003c/code> recibe en cambio HB1 ya calculada y X como receptor, y devuelve contacto geométrico en Carry.\u003c/p>\n\u003ch2 id=\"Preparar_y_comparar_cajas\">\u003ca class=\"heading-link\" href=\"#es/api/Preparar_y_comparar_cajas\">Preparar y comparar cajas\u003c/a>\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Rutina con prefijo \u003ccode>!Hitman_Base_\u003c/code>\u003c/th>\u003cth>Entradas\u003c/th>\u003cth>Resultado\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalSpritePositionSetup\u003c/code>, \u003ccode>ClusterPositionSetup\u003c/code>, \u003ccode>ExtendedPositionSetup\u003c/code>\u003c/td>\u003ctd>X = slot de la familia correspondiente.\u003c/td>\u003ctd>Guarda X/Y de la posición en \u003ccode>!HitmanSprite1X/Y\u003c/code> en el convenio interno de Hitman.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalSpritePositionSetup2\u003c/code>\u003c/td>\u003ctd>X = slot normal.\u003c/td>\u003ctd>Prepara \u003ccode>!HitmanSprite2X/Y\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalSpriteOneHitbox1\u003c/code>, \u003ccode>ClusterSpriteOneHitbox1\u003c/code>, \u003ccode>ExtendedSpriteOneHitbox1\u003c/code>\u003c/td>\u003ctd>X = slot con su caja RAM publicada.\u003c/td>\u003ctd>Calcula HB1 usando campos de 8 bits. Termina en \u003ccode>2\u003c/code> para escribir HB2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalSpriteLongOneHitbox1\u003c/code>, \u003ccode>ClusterSpriteLongOneHitbox1\u003c/code>, \u003ccode>ExtendedSpriteLongOneHitbox1\u003c/code>\u003c/td>\u003ctd>X = slot con su caja RAM publicada.\u003c/td>\u003ctd>Calcula HB1 usando campos de 16 bits. Termina en \u003ccode>2\u003c/code> para escribir HB2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>PlayerClippingRoutine\u003c/code>, \u003ccode>NormalSpriteClippingRoutine\u003c/code>\u003c/td>\u003ctd>Mario o Normal sprite en X, respectivamente.\u003c/td>\u003ctd>Prepara HB2 con el clipping del juego.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CapeClipping\u003c/code>, \u003ccode>CapeClippingHB1\u003c/code>\u003c/td>\u003ctd>Posición actual de la capa.\u003c/td>\u003ctd>Prepara HB2 o HB1, respectivamente.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>FireballClipping\u003c/code>, \u003ccode>FireballClippingHB1\u003c/code>, \u003ccode>YoshiFireballClipping\u003c/code>\u003c/td>\u003ctd>Y = slot extendido.\u003c/td>\u003ctd>Prepara HB2, HB1 y HB2, respectivamente, con la caja fija de la rutina.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>FixClippingForInteraction\u003c/code>\u003c/td>\u003ctd>Clipping vanilla ya cargado en scratch.\u003c/td>\u003ctd>Convierte ese clipping a los cuatro bordes de HB2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckContact\u003c/code>\u003c/td>\u003ctd>HB1 y HB2 preparadas.\u003c/td>\u003ctd>Carry en 1 si las cajas se tocan. Incluye bordes iguales. A regresa a 8 bits.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>LoadNormalHitbox\u003c/code>\u003c/td>\u003ctd>X = slot normal, Y = ordinal de la caja.\u003c/td>\u003ctd>Carry en 1 si HB1 contiene una caja válida. Una caja única usa ordinal 0. Preserva X, Y, DBR y D. Modifica A, \u003ccode>$04–$07\u003c/code>, HB1, posición temporal del objeto 2 y \u003ccode>$98–$9B\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>GetHitbox2\u003c/code>\u003c/td>\u003ctd>A de 16 bits = contexto más pose del objeto 2, índices de 8 bits y Y = ordinal. Prepara \u003ccode>!HitmanSprite2X/Y\u003c/code> y \u003ccode>!HitmanSprite2Flip\u003c/code>.\u003c/td>\u003ctd>Carry en 1 si cargó HB2 y en 0 al terminar la lista. Vuelve con A e índices de 8 bits.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ProcessHitBoxes\u003c/code>\u003c/td>\u003ctd>Las mismas entradas que \u003ca href=\"#es/api/ProcessHitBoxesWithoutCallback\">ProcessHitBoxesWithoutCallback\u003c/a>.\u003c/td>\u003ctd>Recorre toda la pose y ejecuta las acciones por caja. Carry indica si \u003ccode>!HitmanDefault\u003c/code> quedó distinto de cero.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Llama a cada rutina de la tabla con \u003ccode>JSL\u003c/code>. Entra con A e índices de 8 bits salvo cuando la tabla especifique A de 16 bits.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; X = slot normal. A e índices en 8 bits.\nLDY #$00\nJSL !Hitman_Base_LoadNormalHitbox\nBCC .SinCaja\nJSL !Hitman_Base_PlayerClippingRoutine\nJSL !Hitman_Base_CheckContact\nBCC .SinContacto\n; Mario toca la primera caja.\n.SinContacto\n.SinCaja\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2 id=\"Estados,_puntos_y_efectos\">\u003ca class=\"heading-link\" href=\"#es/api/Estados%2C_puntos_y_efectos\">Estados, puntos y efectos\u003c/a>\u003c/h2>\n\u003ch3 id=\"RunVanillaStatus\">\u003ca class=\"heading-link\" href=\"#es/api/RunVanillaStatus\">RunVanillaStatus\u003c/a>\u003c/h3>\n\u003cp>Llama con \u003ccode>JSL !Hitman_Base_RunVanillaStatus\u003c/code> seguido del sufijo de la tabla. Pasa el slot normal en X con A e índices de 8 bits. Cada entrada ejecuta el handler del estado indicado. Los cambios dependen del estado. Por ejemplo, la rutina puede mover el sprite, dibujarlo o cambiar su estado. El estado \u003ccode>$08\u003c/code> se atiende en MAIN.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Estado\u003c/th>\u003cth>Sufijo\u003c/th>\u003cth>Estado\u003c/th>\u003cth>Sufijo\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$00\u003c/code>\u003c/td>\u003ctd>Erase\u003c/td>\u003ctd>\u003ccode>$07\u003c/code>\u003c/td>\u003ctd>Unused\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>Init\u003c/td>\u003ctd>\u003ccode>$09\u003c/code>\u003c/td>\u003ctd>Stunned\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>Killed\u003c/td>\u003ctd>\u003ccode>$0A\u003c/code>\u003c/td>\u003ctd>Kicked\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$03\u003c/code>\u003c/td>\u003ctd>Smushed\u003c/td>\u003ctd>\u003ccode>$0B\u003c/code>\u003c/td>\u003ctd>Carried\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>SpinJumped\u003c/td>\u003ctd>\u003ccode>$0C\u003c/code>\u003c/td>\u003ctd>GoalPowerup\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$05\u003c/code>\u003c/td>\u003ctd>Sinking\u003c/td>\u003ctd>\u003ccode>$06\u003c/code>\u003c/td>\u003ctd>LevelEndCoin\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Por ejemplo, si el slot actual ya está en estado \u003ccode>$0B\u003c/code>, \u003ccode>JSL !Hitman_Base_RunVanillaStatusCarried\u003c/code> ejecuta su lógica vanilla de transporte.\u003c/p>\n\u003ch3 id=\"Vectores_de_respuesta_por_estado\">\u003ca class=\"heading-link\" href=\"#es/api/Vectores_de_respuesta_por_estado\">Vectores de respuesta por estado\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>NormalSpriteExecuteCollissionResultVector\u003c/code> usa el estado del otro sprite en Y. \u003ccode>NormalSpriteExecuteFullCollissionResultVector\u003c/code> usa también el estado del sprite actual en X. Ambas entradas se llaman con \u003ccode>JSL\u003c/code>, con A e índices de 8 bits. Coloca el retorno de tu rutina inmediatamente después del \u003ccode>JSL\u003c/code> y a continuación la tabla de direcciones de 16 bits del mismo banco. El handler seleccionado regresa con \u003ccode>RTL\u003c/code> al retorno que sigue al \u003ccode>JSL\u003c/code>. Si el estado no pasa la comprobación, el control vuelve directamente a la instrucción que sigue al \u003ccode>JSL\u003c/code>.\u003c/p>\n\u003cp>Usa este orden en cada grupo de la tabla: normal, estacionario, pateado y cargado. La variante completa tiene cuatro grupos en ese mismo orden según el estado del sprite actual.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>Responder:\n    JSL !Hitman_Base_NormalSpriteExecuteCollissionResultVector\n    RTS\n    dw .Normal, .Estacionario, .Pateado, .Cargado\n.Normal\n    RTL\n.Estacionario\n    RTL\n.Pateado\n    RTL\n.Cargado\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"Utilidades\">\u003ca class=\"heading-link\" href=\"#es/api/Utilidades\">Utilidades\u003c/a>\u003c/h3>\n\u003cp>Llama con \u003ccode>JSL\u003c/code> y el prefijo \u003ccode>!Hitman_Base_\u003c/code>, con A e índices de 8 bits.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Rutina\u003c/th>\u003cth>Entrada\u003c/th>\u003cth>Resultado o efecto\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>SubHorzPos\u003c/code>\u003c/td>\u003ctd>X = slot normal.\u003c/td>\u003ctd>Y vale 0 si Mario queda a la derecha o en el mismo X, y 1 si queda a la izquierda. \u003ccode>$0E–$0F\u003c/code> guarda Mario X menos sprite X.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>SubVertPos\u003c/code>\u003c/td>\u003ctd>X = slot normal.\u003c/td>\u003ctd>Y vale 1 si Mario queda por encima y 0 en los demás casos. Deja el byte bajo de la diferencia vertical en \u003ccode>$0F\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CapeStomping\u003c/code>, \u003ccode>YoshiStomping\u003c/code>\u003c/td>\u003ctd>X = slot normal.\u003c/td>\u003ctd>Carry en 1 si pasan las comprobaciones auxiliares de pisotón para la capa o Yoshi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>GivePointsConsecutiveJump\u003c/code>, \u003ccode>GivePointsConsecutiveShell\u003c/code>\u003c/td>\u003ctd>X = slot normal.\u003c/td>\u003ctd>Actualizan el contador de impactos consecutivos, el sonido y los puntos del recorrido correspondiente.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>DisplayContactEffectAtSpritePosition\u003c/code>\u003c/td>\u003ctd>X = slot normal.\u003c/td>\u003ctd>Reproduce el efecto de contacto en la posición del sprite y usa scratch a partir de \u003ccode>$00\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>StunKickedSprite\u003c/code>\u003c/td>\u003ctd>X = slot normal, A = velocidad vertical inicial, por ejemplo \u003ccode>$C0\u003c/code>.\u003c/td>\u003ctd>Aturde al sprite y aplica la velocidad. Puedes mostrar el efecto visual con \u003ccode>DisplayContactEffectAtSpritePosition\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>DispatchVanillaCallback\u003c/code>\u003c/td>\u003ctd>A = evento, X = receptor normal, Y = origen.\u003c/td>\u003ctd>Aplica los filtros de despacho y llama al callback configurado. Preserva X, Y, DBR, D y \u003ccode>$0E\u003c/code>. Consulta \u003ca href=\"#es/api/Flags_y_callbacks_de_eventos\">Flags y callbacks de eventos\u003c/a>.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\u003ch3 id=\"Crear_sprites_con_PIXI\">\u003ca class=\"heading-link\" href=\"#es/api/Crear_sprites_con_PIXI\">Crear sprites con PIXI\u003c/a>\u003c/h3>\u003cp>Usa \u003ccode>%Spawn_Sprite()\u003c/code> o \u003ccode>%Spawn_SpriteSafe()\u003c/code> con el número del sprite en A. Pon Carry en 1 para un sprite custom o en 0 para uno vanilla. Pasa los offsets X/Y en \u003ccode>$00–$01\u003c/code> y las velocidades iniciales en \u003ccode>$02–$03\u003c/code>. \u003ccode>SpriteSafe\u003c/code> recibe además en \u003ccode>$04\u003c/code> el primer slot que debe revisar. Si se crea el sprite, Carry queda en 0 e Y contiene su slot. Si falla, Carry queda en 1 e Y contiene \u003ccode>$FF\u003c/code>.\u003c/p>","headings":[{"id":"Preparar_el_código","title":"Preparar el código","level":2},{"id":"Defines_de_Hitman","title":"Defines de Hitman","level":2},{"id":"Leer_o_cambiar_una_propiedad","title":"Leer o cambiar una propiedad","level":3},{"id":"Publicar_la_hitbox_de_un_Normal_sprite","title":"Publicar la hitbox de un Normal sprite","level":2},{"id":"Interacciones_vanilla","title":"Interacciones vanilla","level":2},{"id":"Flags_y_callbacks_de_eventos","title":"Flags y callbacks de eventos","level":3},{"id":"Filtrar_el_contacto_entre_Normal_sprites","title":"Filtrar el contacto entre Normal sprites","level":2},{"id":"SetSpritePairCollision","title":"SetSpritePairCollision","level":3},{"id":"SetSpriteSlotCollision","title":"SetSpriteSlotCollision","level":3},{"id":"Configurar_Extended_sprites","title":"Configurar Extended sprites","level":2},{"id":"Callbacks_incluidos","title":"Callbacks incluidos","level":2},{"id":"Llamar_un_callback_desde_ASM","title":"Llamar un callback desde ASM","level":3},{"id":"Crear_un_callback","title":"Crear un callback","level":3},{"id":"Crear_una_rutina_base","title":"Crear una rutina base","level":2},{"id":"Reubicar_la_RAM_de_Hitman","title":"Reubicar la RAM de Hitman","level":2},{"id":"Rutinas_de_interacción_manual","title":"Rutinas de interacción manual","level":2},{"id":"CheckNormalPair","title":"CheckNormalPair","level":3},{"id":"CheckExtendedNormalPair","title":"CheckExtendedNormalPair","level":3},{"id":"ProcessHitBoxesWithoutCallback","title":"ProcessHitBoxesWithoutCallback","level":3},{"id":"PlayerNormalSpriteInteraction","title":"PlayerNormalSpriteInteraction","level":3},{"id":"PlayerSpriteInteraction","title":"PlayerSpriteInteraction","level":3},{"id":"CapeSpriteInteraction","title":"CapeSpriteInteraction","level":3},{"id":"FireballNormalSpriteInteraction_y_YoshiFireballNormalSpriteInteraction","title":"FireballNormalSpriteInteraction y YoshiFireballNormalSpriteInteraction","level":3},{"id":"Recorrer_Normal_sprites","title":"Recorrer Normal sprites","level":3},{"id":"AnyNormalSpriteInteraction","title":"AnyNormalSpriteInteraction","level":3},{"id":"Preparar_y_comparar_cajas","title":"Preparar y comparar cajas","level":2},{"id":"Estados,_puntos_y_efectos","title":"Estados, puntos y efectos","level":2},{"id":"RunVanillaStatus","title":"RunVanillaStatus","level":3},{"id":"Vectores_de_respuesta_por_estado","title":"Vectores de respuesta por estado","level":3},{"id":"Utilidades","title":"Utilidades","level":3},{"id":"Crear_sprites_con_PIXI","title":"Crear sprites con PIXI","level":3}]},"internals":{"title":"Funcionamiento interno","html":"\u003cp>Cuando una bola de fuego choca con un sprite, Hitman necesita saber qué cajas comparar y cómo debe reaccionar el sprite. Esa información sale de los archivos que preparaste al instalar el parche. Una hitbox es un rectángulo invisible que el juego usa para decidir si dos objetos chocan. Una pose es uno de los cuadros de la animación del sprite. Cada pose puede tener sus propias hitboxes. Un callback es una rutina que tú eliges para que Hitman la ejecute cuando ocurre algo, como el choque de una caja con Mario.\u003c/p>\n\u003ch2 id=\"Cómo_se_prepara_la_ROM\">\u003ca class=\"heading-link\" href=\"#es/internals/C%C3%B3mo_se_prepara_la_ROM\">Cómo se prepara la ROM\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>Hitman usa la lista de PIXI para encontrar los sprites del proyecto. Si le diste una lista de UberASMTool, también busca allí los códigos del proyecto. Lee las indicaciones que enlazan cada recurso con sus archivos de hitboxes (\u003ccode>;#inchbi\u003c/code>) o propiedades (\u003ccode>;#inchmprop\u003c/code>). También busca archivos en sus propias carpetas.\u003c/li>\n\u003cli>Hitman lee los archivos para saber qué hitboxes usa cada pose, qué callbacks tiene cada caja y con qué valores se inicializan las propiedades de cada sprite.\u003c/li>\n\u003cli>Con esa información, Hitman prepara las tablas que el juego podrá leer en la ROM. También reúne el código de las rutinas y callbacks que va a instalar.\u003c/li>\n\u003cli>Asar instala el parche en una copia temporal de la ROM de entrada. Cuando termina correctamente, Hitman publica la ROM de salida y las definiciones que usarán PIXI y UberASMTool.\u003c/li>\n\u003c/ol>\n\u003cp>Después ejecutas PIXI y UberASMTool sobre la ROM de salida. El número de la lista identifica el tipo de sprite, por ejemplo un enemigo concreto. Si colocas dos enemigos de ese tipo en el nivel, cada uno ocupa su propio slot, es decir, su propio lugar en las tablas que usa el juego para seguir a los sprites activos.\u003c/p>\n\u003ch2 id=\"Qué_partes_del_juego_modifica_Hitman\">\u003ca class=\"heading-link\" href=\"#es/internals/Qu%C3%A9_partes_del_juego_modifica_Hitman\">Qué partes del juego modifica Hitman\u003c/a>\u003c/h2>\n\u003cp>Un \u003cem>hijack\u003c/em> es un cambio en una dirección de la ROM que desvía el código del juego hacia una rutina del parche. Cuando Mario dispara, por ejemplo, el juego llega a su comprobación de impacto habitual y, desde ahí, entra a Hitman para decidir qué caja usar y qué hacer si el proyectil choca con un Normal sprite.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Dirección de SMW\u003c/th>\u003cth>Qué cambia en el juego\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$07F7D2\u003c/code>\u003c/td>\u003ctd>Al preparar el slot de un Normal sprite, carga sus propiedades de Hitman y restablece sus parejas de colisión. Después ejecuta los pasos de inicialización de SMW.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01A411\u003c/code>\u003c/td>\u003ctd>Cambia la comprobación entre Normal sprites. El recorrido conserva filtros del juego como el estado del sprite y añade la máscara de parejas y las hitboxes configuradas. También decide qué hacer cuando se encuentran dos sprites o un caparazón golpea a otro.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02A0AC\u003c/code>\u003c/td>\u003ctd>Cambia cómo las bolas de fuego de Mario y Yoshi comprueban impactos contra Normal sprites. La caja del proyectil y el evento dependen del número del Extended sprite. El choque del proyectil con los bloques del nivel va por otro camino.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$028139\u003c/code>\u003c/td>\u003ctd>Cambia cómo un Normal sprite que explota comprueba si alcanza a otros Normal sprites. Hitman compara las cajas de la pareja antes de resolver el impacto de la explosión.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$0293AE\u003c/code>\u003c/td>\u003ctd>Cambia cómo un Quake sprite busca a los Normal sprites a los que puede afectar. El temporizador del Quake sprite y la respuesta al impacto se manejan en pasos separados.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$0294C1\u003c/code>\u003c/td>\u003ctd>Cambia qué sprites reciben el efecto del cape dive al caer Mario al suelo. Este recorrido busca sprites apoyados en el suelo y aplica filtros de estado.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$019F74\u003c/code>\u003c/td>\u003ctd>Permite saltar el dibujo auxiliar de un sprite cargado por Mario mediante \u003ccode>SkipVanillaCarriedDraw\u003c/code>. El sprite conserva la lógica del estado cargado y puede dibujarse con su propio código.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Las direcciones de la tabla son las de SMW antes de aplicar el ajuste \u003ccode>|!rom\u003c/code> del parche. La entrada de inicialización también deja junto a ella, en \u003ccode>$07F7D6\u003c/code>, el puntero que permite a PIXI y UberASMTool encontrar las rutinas instaladas.\u003c/p>\n\u003ch3 id=\"Por_qué_Hitman_incluye_sus_propias_rutinas_de_spawn\">\u003ca class=\"heading-link\" href=\"#es/internals/Por_qu%C3%A9_Hitman_incluye_sus_propias_rutinas_de_spawn\">Por qué Hitman incluye sus propias rutinas de spawn\u003c/a>\u003c/h3>\n\u003cp>Crear un sprite significa ocupar un slot libre. Ese slot pudo haber pertenecido a otro sprite con propiedades distintas o con el choque bloqueado frente a un compañero. Si el código de spawn se salta la inicialización de Hitman, la nueva instancia puede quedarse con esos valores.\u003c/p>\n\u003cp>Por eso la instalación copia a PIXI las versiones de Hitman de \u003ccode>Spawn/Sprite.asm\u003c/code> y \u003ccode>Spawn/SpriteSafe.asm\u003c/code>. Ambas buscan un slot libre y pasan el número y el tipo del nuevo sprite a la inicialización de \u003ccode>$07F7D2\u003c/code>. Para un sprite custom, preparan primero el número custom y su marca, de modo que Hitman pueda encontrar los valores del sprite correcto.\u003c/p>\n\u003cp>El código de \u003ccode>$07F7D2\u003c/code> copia a RAM los valores de ese tipo de sprite, vuelve a permitir sus parejas de colisión y ejecuta las rutinas de inicialización del juego. Conserva los parámetros de posición y velocidad que necesita el spawn. En la rama custom, las rutinas de spawn también guardan esos parámetros mientras PIXI carga sus datos. Después marcan el slot para que el sprite pase por INIT y lo colocan con la posición y la velocidad pedidas.\u003c/p>\n\u003cp>Por ejemplo, si un pasajero tenía bloqueado el choque con el sprite que lo cargaba, ese bloqueo se borra cuando otro sprite ocupa su slot. La rutina de spawn devuelve el nuevo slot en Y y Carry en 0. Si el recorrido no encuentra un slot libre, devuelve Y en \u003ccode>$FF\u003c/code> y Carry en 1. Consulta \u003ca href=\"#es/api/Crear_sprites_con_PIXI\">Crear sprites con PIXI\u003c/a> para preparar la llamada.\u003c/p>\n\u003ch2 id=\"Cómo_se_guardan_las_hitboxes\">\u003ca class=\"heading-link\" href=\"#es

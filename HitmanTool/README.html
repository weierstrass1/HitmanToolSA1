i/Call_a_callback_from_ASM\">Call a callback from ASM\u003c/a>\u003c/h3>\n\u003cp>Use \u003ccode>JSL !Hitman_Callback_Name\u003c/code> if the installer included the callback. Prepare the registers and scratch it needs. For example, a wall callback needs both boxes already loaded.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; A is 8-bit. Initialize !HitmanDefault before this check.\nJSL !Hitman_Callback_SetBit3\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>SetBit3\u003c/code> adds \u003ccode>$04\u003c/code> to \u003ccode>!HitmanDefault\u003c/code>. The call itself does not check for a collision. To include a callback, declare it in the configuration that uses it or under \u003ccode>Dependencies:\u003c/code> in a legacy HitboxInfo file. See \u003ca href=\"#en/formats/Include_helper_routines\">Include helper routines\u003c/a>.\u003c/p>\n\u003ch3 id=\"Create_a_callback\">\u003ca class=\"heading-link\" href=\"#en/api/Create_a_callback\">Create a callback\u003c/a>\u003c/h3>\n\u003cp>Create \u003ccode>Routines/RegistrarContacto.asm\u003c/code> in the Hitman Tool folder. The label must match the filename without \u003ccode>.asm\u003c/code>. This callback sets bit \u003ccode>$01\u003c/code> in \u003ccode>!HitmanDefault\u003c/code> so the sprite can react to Mario.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>RegistrarContacto:\n    LDA #$01\n    TSB.b !HitmanDefault\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Put this line in the box that should run the callback.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>    .OnPlayerCollision RegistrarContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Reinstall Hitman Tool to include the routine and generate \u003ccode>!Hitman_Callback_RegistrarContacto\u003c/code>. After reinserting the sprite with PIXI, Hitman can call it when the box collides with Mario. To call it directly, use \u003ccode>JSL !Hitman_Callback_RegistrarContacto\u003c/code> with 8-bit A and the result byte already prepared.\u003c/p>\n\u003ch2 id=\"Create_a_base_routine\">\u003ca class=\"heading-link\" href=\"#en/api/Create_a_base_routine\">Create a base routine\u003c/a>\u003c/h2>\n\u003cp>Use a base routine to share code between sprites and UberASM resources. This example returns in Carry whether \u003ccode>IsLarge\u003c/code> is set for the Normal sprite in X.\u003c/p>\n\u003cp>Create \u003ccode>Patch/BaseRoutines/EsSpriteGrande.asm\u003c/code> with a matching label. Define \u003ccode>IsLarge\u003c/code> in \u003ccode>CustomProperties/\u003c/code> first.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; Input: 8-bit A and indices. X = Normal sprite slot.\n; Output: C = 1 if IsLarge is nonzero. X and Y are preserved.\nEsSpriteGrande:\n    LDA !Hitman_Prop_IsLarge,x\n    CMP #$01\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Hitman includes ASM files directly inside \u003ccode>Patch/BaseRoutines/\u003c/code>. Reinstall it to generate \u003ccode>!Hitman_Base_EsSpriteGrande\u003c/code> and reassemble your resources with PIXI or UberASMTool on the output ROM.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>    JSL !Hitman_Base_EsSpriteGrande\n    BCC .Pequeno\n    ; Handle the large sprite here.\n.Pequeno\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Use unique entry labels and document what each routine expects and changes. The installer regenerates \u003ccode>Patch/Files/Includes.asm\u003c/code> and \u003ccode>HitmanDefines.asm\u003c/code> from the files in their respective source folders.\u003c/p>\n\u003ch2 id=\"Move_Hitman&#x27;s_RAM_block\">\u003ca class=\"heading-link\" href=\"#en/api/Move_Hitman%27s_RAM_block\">Move Hitman&#x27;s RAM block\u003c/a>\u003c/h2>\n\u003cp>Hitman keeps its sprite tables, properties, and collision masks in a block of RAM. If another patch uses that space, move the entire block. The limit is the first address outside the reservation.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>ROM\u003c/th>\u003cth>Base\u003c/th>\u003cth>Exclusive limit\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>LoROM\u003c/td>\u003ctd>\u003ccode>$7FAC40\u003c/code>\u003c/td>\u003ctd>\u003ccode>$7FAF00\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>LoROM with Free7E2000 detected\u003c/td>\u003ctd>\u003ccode>$7E7000\u003c/code>\u003c/td>\u003ctd>\u003ccode>$7E7D00\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>SA-1\u003c/td>\u003ctd>\u003ccode>$408000\u003c/code>\u003c/td>\u003ctd>\u003ccode>$409400\u003c/code>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003col>\n\u003cli>Check the installation log for the range and bytes in use. Each custom property takes one byte per Normal sprite slot.\u003c/li>\n\u003cli>Pick a free range large enough for all the tables, within one bank, and compatible with the other patches in your ROM.\u003c/li>\n\u003cli>In \u003ccode>ASM/HitmanDefines.asm\u003c/code>, set \u003ccode>!HitmanRAMBase\u003c/code> and \u003ccode>!HitmanRAMLimit\u003c/code> together. The source template is \u003ccode>HitmanBackend/ASM/HitmanDefines.asm\u003c/code>.\u003c/li>\n\u003cli>Reinstall and check that \u003ccode>!HitmanRAMEnd\u003c/code>, the exclusive end of the bytes used, stays within the limit. Reassemble your PIXI and UberASM resources with the new defines.\u003c/li>\n\u003c/ol>\n\u003cp>HB1, HB2, \u003ccode>!HitmanHBStatus\u003c/code>, and \u003ccode>!HitmanDefault\u003c/code> remain temporary collision memory.\u003c/p>\n\u003ch2 id=\"Manual_interaction_routines\">\u003ca class=\"heading-link\" href=\"#en/api/Manual_interaction_routines\">Manual interaction routines\u003c/a>\u003c/h2>\n\u003cp>For any routine that takes a pose in A, add the current pose index to the base context before the call. Use your sprite&#x27;s current animation index. The \u003ccode>ContextIDLow\u003c/code> and \u003ccode>ContextIDHigh\u003c/code> tables hold the published context so other resources can check the box.\u003c/p>\n\u003ch3 id=\"CheckNormalPair\">\u003ca class=\"heading-link\" href=\"#en/api/CheckNormalPair\">CheckNormalPair\u003c/a>\u003c/h3>\n\u003cp>Call \u003ccode>JSL !Hitman_Base_CheckNormalPair\u003c/code> with two Normal sprite slots in X and Y. Carry is set if their configured hitboxes collide. X, Y, DBR, and D are preserved. The routine uses collision scratch. The pair mask applies to the vanilla interaction, so use that path if you need the mask to take effect.\u003c/p>\n\u003ch3 id=\"CheckExtendedNormalPair\">\u003ca class=\"heading-link\" href=\"#en/api/CheckExtendedNormalPair\">CheckExtendedNormalPair\u003c/a>\u003c/h3>\n\u003cp>Call \u003ccode>JSL !Hitman_Base_CheckExtendedNormalPair\u003c/code> with the Normal sprite in X and the Extended sprite in Y. Carry is set on collision. X, Y, DBR, and D are preserved. The routine uses collision scratch. Your code decides how to respond to the impact.\u003c/p>\n\u003ch3 id=\"ProcessHitBoxesWithoutCallback\">\u003ca class=\"heading-link\" href=\"#en/api/ProcessHitBoxesWithoutCallback\">ProcessHitBoxesWithoutCallback\u003c/a>\u003c/h3>\n\u003cp>Use this to check the boxes of a pose against one rectangle in HB2. It can be used in UberASM to check a level area without a sprite slot.\u003c/p>\n\u003cul>\n\u003cli>Pass the base context plus pose in 16-bit A. Set the index registers to 8-bit and use the game&#x27;s direct page.\u003c/li>\n\u003cli>Store the pose origin and flip in \u003ccode>!HitmanSprite1X\u003c/code>, \u003ccode>!HitmanSprite1Y\u003c/code>, and \u003ccode>!HitmanSprite1Flip\u003c/code>. Store the rectangle in \u003ccode>!HitmanHB2Left\u003c/code>, \u003ccode>!HitmanHB2Top\u003c/code>, \u003ccode>!HitmanHB2Right\u003c/code>, and \u003ccode>!HitmanHB2Bottom\u003c/code>.\u003c/li>\n\u003cli>Add \u003ccode>$0100\u003c/code> to each coordinate of the origin and to each edge before storing them.\u003c/li>\n\u003cli>On contact, Carry is set and HB1 contains the first box that collided. Otherwise Carry is clear. A and the index registers are 8-bit on return. Treat A, Y, HB1, and the temporary hitbox pointers as scratch.\u003c/li>\n\u003c/ul>\n\u003cp>With the coordinates and flip ready, this checks pose 0 from \u003ccode>Zone.hitboxinfo\u003c/code>.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>REP #$20\nLDA.w #!ZoneHitboxContext\nJSL !Hitman_Base_ProcessHitBoxesWithoutCallback\nBCC .SinContacto\n; HB1 contains the box that collided with the area.\n.SinContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"PlayerNormalSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#en/api/PlayerNormalSpriteInteraction\">PlayerNormalSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>Checks the boxes of a Normal sprite&#x27;s pose against Mario and runs the matching callbacks. Set X to the slot, \u003ccode>!HitmanSprite1Flip\u003c/code> to the flip, and 16-bit A to the base context plus pose. Use 8-bit indices. Hitman can skip the check based on distance, frame, Mario&#x27;s state, or the side of the scenery he is on.\u003c/p>\n\u003cp>Carry tells you whether the callbacks left a nonzero value in \u003ccode>!HitmanDefault\u003c/code>. A collision can leave Carry clear when no callback writes a result. A returns to 8-bit mode.\u003c/p>\n\u003ch3 id=\"PlayerSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#en/api/PlayerSpriteInteraction\">PlayerSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Call.\u003c/strong> Use \u003ccode>JSL !Hitman_Base_PlayerNormalSpriteInteraction\u003c/code>, \u003ccode>JSL !Hitman_Base_PlayerClusterSpriteInteraction\u003c/code>, or \u003ccode>JSL !Hitman_Base_PlayerExtendedSpriteInteraction\u003c/code>. Pass the slot in X, the base context plus pose in 16-bit A, and the flip in \u003ccode>!HitmanSprite1Flip\u003c/code>. Keep the index registers in 8-bit mode.\u003c/p>\n\u003cp>\u003cstrong>Result.\u003c/strong> The callback variants set Carry when \u003ccode>!HitmanDefault\u003c/code> is nonzero. \u003ccode>InteractionWithoutCallback\u003c/code> takes the same inputs and sets Carry on the first collision. \u003ccode>OneHitboxInteraction\u003c/code> and \u003ccode>OneLongHitboxInteraction\u003c/code> take 8-bit A and read one RAM box with 8-bit or 16-bit fields, respectively. They set Carry on contact. A returns to 8-bit mode.\u003c/p>\n\u003cp>For any sprite family, \u003ccode>REP #$21\u003c/code> sets A to 16-bit mode and clears Carry for the addition. \u003ccode>AND.w #$00FF\u003c/code> keeps only the pose byte.\u003c/p>\n\u003cp>\u003cstrong>Example.\u003c/strong> This checks the current pose of an unflipped Extended sprite. \u003ccode>!PoseIndex\u003c/code> is a one-byte-per-slot table you can define. With Dynamic Xtreme, use \u003ccode>!LastPoseIndex,x\u003c/code> if it contains a valid pose and both resources use matching indices.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; Start with 8-bit A and indices. X = Extended sprite slot.\nSTZ.b !HitmanSprite1Flip\nLDA !PoseIndex,x\nREP #$21\nAND.w #$00FF\nADC.w #!MiProyectilHitboxContext\nJSL !Hitman_Base_PlayerExtendedSpriteInteractionWithoutCallback\nBCC .SinContacto\n; Handle the collision here.\n.SinContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"CapeSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#en/api/CapeSpriteInteraction\">CapeSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>Call \u003ccode>!Hitman_Base_CapeNormalSpriteInteraction\u003c/code>, \u003ccode>!Hitman_Base_CapeClusterSpriteInteraction\u003c/code>, or \u003ccode>!Hitman_Base_CapeExtendedSpriteInteraction\u003c/code> with \u003ccode>JSL\u003c/code>. X is the slot, 16-bit A holds the base context plus pose, and \u003ccode>!HitmanSprite1Flip\u003c/code> holds the flip. Use 8-bit index registers.\u003c/p>\n\u003cp>The routine checks the spinning cape against the pose and returns A to 8-bit mode. Carry indicates a nonzero \u003ccode>!HitmanDefault\u003c/code> for the callback versions, or contact for \u003ccode>WithoutCallback\u003c/code>. If the cape is not spinning, Carry is clear. To adapt the preceding example, call \u003ccode>!Hitman_Base_CapeExtendedSpriteInteractionWithoutCallback\u003c/code>.\u003c/p>\n\u003ch3 id=\"FireballNormalSpriteInteraction_and_YoshiFireballNormalSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#en/api/FireballNormalSpriteInteraction_and_YoshiFireballNormalSpriteInteraction\">FireballNormalSpriteInteraction and YoshiFireballNormalSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>Use \u003ccode>JSL !Hitman_Base_FireballNormalSpriteInteraction\u003c/code> for Mario&#x27;s fireball check, or \u003ccode>JSL !Hitman_Base_YoshiFireballNormalSpriteInteraction\u003c/code> for the historical manual path. Put the Normal sprite in X and the context plus pose in 16-bit A. Set \u003ccode>!HitmanSprite1Flip\u003c/code> and use 8-bit index registers.\u003c/p>\n\u003cp>These routines scan Extended sprite slots and compare boxes. The four current \u003ccode>YoshiFireballNormalSprite*\u003c/code> variants skip ID \u003ccode>$11\u003c/code>. To check a known Yoshi fireball slot, use \u003ccode>CheckExtendedNormalPair\u003c/code>. The callback versions report an action result in Carry. \u003ccode>InteractionWithoutCallback\u003c/code> reports contact. \u003ccode>OneHitboxInteraction\u003c/code> and \u003ccode>OneLongHitboxInteraction\u003c/code> take X with 8-bit A and indices and check a RAM box with 8-bit or 16-bit fields.\u003c/p>\n\u003ch3 id=\"Scan_Normal_sprites\">\u003ca class=\"heading-link\" href=\"#en/api/Scan_Normal_sprites\">Scan Normal sprites\u003c/a>\u003c/h3>\n\u003cp>Call one of these entries with \u003ccode>JSL\u003c/code> and the \u003ccode>!Hitman_Base_\u003c/code> prefix.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Entry\u003c/th>\u003cth>Source and targets\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalNormalSpriteInteractionLoop\u003c/code>\u003c/td>\u003ctd>Normal sprite against other Normal sprites.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalItemSpriteInteractionLoop\u003c/code>\u003c/td>\u003ctd>Normal sprite against items in accepted statuses.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ClusterNormalSpriteInteractionLoop\u003c/code>\u003c/td>\u003ctd>Cluster sprite against Normal sprites.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ExtendedNormalSpriteInteractionLoop\u003c/code>\u003c/td>\u003ctd>Extended sprite against Normal sprites.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Put the source slot in X and \u003ccode>!SpriteIndex\u003c/code>. Use 16-bit A for the base context plus pose, 8-bit indices, and \u003ccode>!HitmanSprite1Flip\u003c/code> for the flip.\u003c/p>\n\u003cp>On success, Carry is set, Y is the target slot, and X is restored to the source. Callback variants stop when the actions produce a result. Add \u003ccode>WithoutCallback\u003c/code> to stop on contact. Each loop applies its own filters.\u003c/p>\n\u003cp>This searches for the first Normal sprite that collides with the current pose of an Extended sprite.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; X and !SpriteIndex hold the Extended sprite slot. Set the flip first.\nLDA !PoseIndex,x\nREP #$21\nAND.w #$00FF\nADC.w #!MiProyectilHitboxContext\nJSL !Hitman_Base_ExtendedNormalSpriteInteractionLoopWithoutCallback\nBCC .SinContacto\n; Y holds the Normal sprite slot.\n.SinContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"AnyNormalSpriteInteraction\">\u003ca class=\"heading-link\" href=\"#en/api/AnyNormalSpriteInteraction\">AnyNormalSpriteInteraction\u003c/a>\u003c/h3>\n\u003cp>Call \u003ccode>JSL !Hitman_Base_AnyNormalSpriteInteraction\u003c/code> with the Normal sprite to check in X and the source slot in \u003ccode>!SpriteIndex\u003c/code>. Prepare the source position, context, and flip in \u003ccode>!HitmanSprite1*\u003c/code>. Enter with 8-bit registers. \u003ccode>WithoutCallback\u003c/code> takes the same inputs.\u003c/p>\n\u003cp>Hitman loads the target&#x27;s configured boxes. Carry reports an action result for the callback version and geometric contact for \u003ccode>WithoutCallback\u003c/code>. \u003ccode>JSL !Hitman_Base_AnyNormalSpriteInteractionOneHitbox\u003c/code> instead takes a prepared HB1 and the target slot in X, and reports contact in Carry.\u003c/p>\n\u003ch2 id=\"Prepare_and_compare_boxes\">\u003ca class=\"heading-link\" href=\"#en/api/Prepare_and_compare_boxes\">Prepare and compare boxes\u003c/a>\u003c/h2>\n\u003cp>Use \u003ccode>JSL\u003c/code> with the \u003ccode>!Hitman_Base_\u003c/code> prefix. Use 8-bit registers unless specified otherwise.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Routine\u003c/th>\u003cth>Input\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalSpritePositionSetup\u003c/code>, \u003ccode>ClusterPositionSetup\u003c/code>, \u003ccode>ExtendedPositionSetup\u003c/code>\u003c/td>\u003ctd>X = slot of the matching family.\u003c/td>\u003ctd>Stores the position in \u003ccode>!HitmanSprite1X/Y\u003c/code> in Hitman&#x27;s coordinate system.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalSpritePositionSetup2\u003c/code>\u003c/td>\u003ctd>X = Normal sprite slot.\u003c/td>\u003ctd>Prepares \u003ccode>!HitmanSprite2X/Y\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalSpriteOneHitbox1\u003c/code>, \u003ccode>ClusterSpriteOneHitbox1\u003c/code>, \u003ccode>ExtendedSpriteOneHitbox1\u003c/code>\u003c/td>\u003ctd>X = slot with a RAM box.\u003c/td>\u003ctd>Loads HB1 using 8-bit fields. Use the suffix \u003ccode>2\u003c/code> to load HB2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>NormalSpriteLongOneHitbox1\u003c/code>, \u003ccode>ClusterSpriteLongOneHitbox1\u003c/code>, \u003ccode>ExtendedSpriteLongOneHitbox1\u003c/code>\u003c/td>\u003ctd>X = slot with a RAM box.\u003c/td>\u003ctd>Loads HB1 using 16-bit fields. Use the suffix \u003ccode>2\u003c/code> to load HB2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>PlayerClippingRoutine\u003c/code>, \u003ccode>NormalSpriteClippingRoutine\u003c/code>\u003c/td>\u003ctd>Mario, or the Normal sprite in X, respectively.\u003c/td>\u003ctd>Loads the original game&#x27;s clipping into HB2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CapeClipping\u003c/code>, \u003ccode>CapeClippingHB1\u003c/code>\u003c/td>\u003ctd>Current cape position.\u003c/td>\u003ctd>Loads HB2 or HB1, respectively.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>FireballClipping\u003c/code>, \u003ccode>FireballClippingHB1\u003c/code>, \u003ccode>YoshiFireballClipping\u003c/code>\u003c/td>\u003ctd>Y = Extended sprite slot.\u003c/td>\u003ctd>Loads HB2, HB1, or HB2, respectively, with the routine&#x27;s fixed box.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>FixClippingForInteraction\u003c/code>\u003c/td>\u003ctd>Original game clipping already in scratch.\u003c/td>\u003ctd>Converts it into the four edges of HB2.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CheckContact\u003c/code>\u003c/td>\u003ctd>Prepared HB1 and HB2.\u003c/td>\u003ctd>Sets Carry if the boxes collide, including equal edges. A returns to 8-bit mode.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>LoadNormalHitbox\u003c/code>\u003c/td>\u003ctd>X = Normal sprite slot, Y = box ordinal.\u003c/td>\u003ctd>Sets Carry when HB1 holds a valid box. Single-box modes use ordinal 0. Preserves X, Y, DBR, and D. Changes A, \u003ccode>$04–$07\u003c/code>, HB1, object 2&#x27;s temporary position, and \u003ccode>$98–$9B\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>GetHitbox2\u003c/code>\u003c/td>\u003ctd>16-bit A = object 2&#x27;s context plus pose, 8-bit indices, Y = ordinal. Prepare \u003ccode>!HitmanSprite2X/Y\u003c/code> and \u003ccode>!HitmanSprite2Flip\u003c/code>.\u003c/td>\u003ctd>Sets Carry when HB2 was loaded and clears it at the end of the list. Returns with 8-bit registers.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ProcessHitBoxes\u003c/code>\u003c/td>\u003ctd>Same inputs as \u003ca href=\"#en/api/ProcessHitBoxesWithoutCallback\">ProcessHitBoxesWithoutCallback\u003c/a>.\u003c/td>\u003ctd>Checks the entire pose and runs its actions. Carry indicates whether \u003ccode>!HitmanDefault\u003c/code> is nonzero.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>; X = Normal sprite slot. A and indices are 8-bit.\nLDY #$00\nJSL !Hitman_Base_LoadNormalHitbox\nBCC .SinCaja\nJSL !Hitman_Base_PlayerClippingRoutine\nJSL !Hitman_Base_CheckContact\nBCC .SinContacto\n; Mario collided with the first box.\n.SinContacto\n.SinCaja\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2 id=\"Status_routines,_points,_and_effects\">\u003ca class=\"heading-link\" href=\"#en/api/Status_routines%2C_points%2C_and_effects\">Status routines, points, and effects\u003c/a>\u003c/h2>\n\u003ch3 id=\"RunVanillaStatus\">\u003ca class=\"heading-link\" href=\"#en/api/RunVanillaStatus\">RunVanillaStatus\u003c/a>\u003c/h3>\n\u003cp>Call \u003ccode>JSL !Hitman_Base_RunVanillaStatus\u003c/code> followed by the suffix below. Put the Normal sprite slot in X and use 8-bit registers. Each entry runs the original handler for that status. It may move the sprite, draw it, or change its status. Handle \u003ccode>$08\u003c/code> in MAIN.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Status\u003c/th>\u003cth>Suffix\u003c/th>\u003cth>Status\u003c/th>\u003cth>Suffix\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$00\u003c/code>\u003c/td>\u003ctd>Erase\u003c/td>\u003ctd>\u003ccode>$07\u003c/code>\u003c/td>\u003ctd>Unused\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01\u003c/code>\u003c/td>\u003ctd>Init\u003c/td>\u003ctd>\u003ccode>$09\u003c/code>\u003c/td>\u003ctd>Stunned\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02\u003c/code>\u003c/td>\u003ctd>Killed\u003c/td>\u003ctd>\u003ccode>$0A\u003c/code>\u003c/td>\u003ctd>Kicked\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$03\u003c/code>\u003c/td>\u003ctd>Smushed\u003c/td>\u003ctd>\u003ccode>$0B\u003c/code>\u003c/td>\u003ctd>Carried\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$04\u003c/code>\u003c/td>\u003ctd>SpinJumped\u003c/td>\u003ctd>\u003ccode>$0C\u003c/code>\u003c/td>\u003ctd>GoalPowerup\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$05\u003c/code>\u003c/td>\u003ctd>Sinking\u003c/td>\u003ctd>\u003ccode>$06\u003c/code>\u003c/td>\u003ctd>LevelEndCoin\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>For a slot already in status \u003ccode>$0B\u003c/code>, \u003ccode>JSL !Hitman_Base_RunVanillaStatusCarried\u003c/code> runs the game&#x27;s carried logic.\u003c/p>\n\u003ch3 id=\"Status_response_vectors\">\u003ca class=\"heading-link\" href=\"#en/api/Status_response_vectors\">Status response vectors\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>NormalSpriteExecuteCollissionResultVector\u003c/code> reads the status of the other sprite in Y. \u003ccode>NormalSpriteExecuteFullCollissionResultVector\u003c/code> also reads the current sprite&#x27;s status in X. Call with \u003ccode>JSL\u003c/code> and 8-bit registers. Put your routine&#x27;s return instruction immediately after the call, then the table of same-bank, 16-bit handler addresses. The selected handler uses \u003ccode>RTL\u003c/code> to return to the instruction after the call. If the status check fails, the routine returns to that same instruction directly.\u003c/p>\n\u003cp>Use the order normal, stationary, kicked, and carried in each group. The full version uses four groups in that order for the current sprite&#x27;s own status.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>Responder:\n    JSL !Hitman_Base_NormalSpriteExecuteCollissionResultVector\n    RTS\n    dw .Normal, .Estacionario, .Pateado, .Cargado\n.Normal\n    RTL\n.Estacionario\n    RTL\n.Pateado\n    RTL\n.Cargado\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"Utilities\">\u003ca class=\"heading-link\" href=\"#en/api/Utilities\">Utilities\u003c/a>\u003c/h3>\n\u003cp>Call with \u003ccode>JSL\u003c/code> and the \u003ccode>!Hitman_Base_\u003c/code> prefix. Use 8-bit registers.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Routine\u003c/th>\u003cth>Input\u003c/th>\u003cth>Result or effect\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>SubHorzPos\u003c/code>\u003c/td>\u003ctd>X = Normal sprite slot.\u003c/td>\u003ctd>Y is 0 for Mario at or to the right of the sprite and 1 for Mario to the left. \u003ccode>$0E–$0F\u003c/code> hold Mario X minus sprite X.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>SubVertPos\u003c/code>\u003c/td>\u003ctd>X = Normal sprite slot.\u003c/td>\u003ctd>Y is 1 if Mario is above the sprite and 0 otherwise. \u003ccode>$0F\u003c/code> holds the low byte of the vertical difference.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>CapeStomping\u003c/code>, \u003ccode>YoshiStomping\u003c/code>\u003c/td>\u003ctd>X = Normal sprite slot.\u003c/td>\u003ctd>Set Carry if the cape or Yoshi stomp checks pass.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>GivePointsConsecutiveJump\u003c/code>, \u003ccode>GivePointsConsecutiveShell\u003c/code>\u003c/td>\u003ctd>X = Normal sprite slot.\u003c/td>\u003ctd>Update the consecutive-hit counter, sound, and score.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>DisplayContactEffectAtSpritePosition\u003c/code>\u003c/td>\u003ctd>X = Normal sprite slot.\u003c/td>\u003ctd>Plays the contact effect at the sprite&#x27;s position and uses scratch starting at \u003ccode>$00\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>StunKickedSprite\u003c/code>\u003c/td>\u003ctd>X = Normal sprite slot, A = initial vertical speed, such as \u003ccode>$C0\u003c/code>.\u003c/td>\u003ctd>Stuns the sprite and applies that speed. Use \u003ccode>DisplayContactEffectAtSpritePosition\u003c/code> for the visual effect.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>DispatchVanillaCallback\u003c/code>\u003c/td>\u003ctd>A = event, X = Normal sprite being hit, Y = source.\u003c/td>\u003ctd>Checks whether to run the callback and calls it. Preserves X, Y, DBR, D, and \u003ccode>$0E\u003c/code>. See \u003ca href=\"#en/api/Event_flags_and_callbacks\">Event flags and callbacks\u003c/a>.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"Spawn_sprites_with_PIXI\">\u003ca class=\"heading-link\" href=\"#en/api/Spawn_sprites_with_PIXI\">Spawn sprites with PIXI\u003c/a>\u003c/h3>\n\u003cp>Call \u003ccode>%Spawn_Sprite()\u003c/code> or \u003ccode>%Spawn_SpriteSafe()\u003c/code> with the sprite number in A. Set Carry for a custom sprite or clear it for vanilla. Supply X and Y offsets in \u003ccode>$00–$01\u003c/code> and the initial speeds in \u003ccode>$02–$03\u003c/code>. \u003ccode>SpriteSafe\u003c/code> also takes the first slot to search in \u003ccode>$04\u003c/code>. If a sprite is created, Carry is clear and Y contains the new slot. Otherwise Carry is set and Y contains \u003ccode>$FF\u003c/code>.\u003c/p>","headings":[{"id":"Set_up_your_code","title":"Set up your code","level":2},{"id":"Hitman_defines","title":"Hitman defines","level":2},{"id":"Read_or_change_a_property","title":"Read or change a property","level":3},{"id":"Publish_a_Normal_sprite's_hitbox","title":"Publish a Normal sprite's hitbox","level":2},{"id":"Vanilla_interactions","title":"Vanilla interactions","level":2},{"id":"Event_flags_and_callbacks","title":"Event flags and callbacks","level":3},{"id":"Filter_collisions_between_Normal_sprites","title":"Filter collisions between Normal sprites","level":2},{"id":"SetSpritePairCollision","title":"SetSpritePairCollision","level":3},{"id":"SetSpriteSlotCollision","title":"SetSpriteSlotCollision","level":3},{"id":"Configure_Extended_sprites","title":"Configure Extended sprites","level":2},{"id":"Included_callbacks","title":"Included callbacks","level":2},{"id":"Call_a_callback_from_ASM","title":"Call a callback from ASM","level":3},{"id":"Create_a_callback","title":"Create a callback","level":3},{"id":"Create_a_base_routine","title":"Create a base routine","level":2},{"id":"Move_Hitman's_RAM_block","title":"Move Hitman's RAM block","level":2},{"id":"Manual_interaction_routines","title":"Manual interaction routines","level":2},{"id":"CheckNormalPair","title":"CheckNormalPair","level":3},{"id":"CheckExtendedNormalPair","title":"CheckExtendedNormalPair","level":3},{"id":"ProcessHitBoxesWithoutCallback","title":"ProcessHitBoxesWithoutCallback","level":3},{"id":"PlayerNormalSpriteInteraction","title":"PlayerNormalSpriteInteraction","level":3},{"id":"PlayerSpriteInteraction","title":"PlayerSpriteInteraction","level":3},{"id":"CapeSpriteInteraction","title":"CapeSpriteInteraction","level":3},{"id":"FireballNormalSpriteInteraction_and_YoshiFireballNormalSpriteInteraction","title":"FireballNormalSpriteInteraction and YoshiFireballNormalSpriteInteraction","level":3},{"id":"Scan_Normal_sprites","title":"Scan Normal sprites","level":3},{"id":"AnyNormalSpriteInteraction","title":"AnyNormalSpriteInteraction","level":3},{"id":"Prepare_and_compare_boxes","title":"Prepare and compare boxes","level":2},{"id":"Status_routines,_points,_and_effects","title":"Status routines, points, and effects","level":2},{"id":"RunVanillaStatus","title":"RunVanillaStatus","level":3},{"id":"Status_response_vectors","title":"Status response vectors","level":3},{"id":"Utilities","title":"Utilities","level":3},{"id":"Spawn_sprites_with_PIXI","title":"Spawn sprites with PIXI","level":3}]},"internals":{"title":"How Hitman Tool Works","html":"\u003cp>When a fireball hits a sprite, Hitman needs to know which boxes to compare and how the sprite should respond. That information comes from the files you set up before installing the patch. A hitbox is an invisible rectangle used to check collisions. Each pose, or frame of a sprite&#x27;s animation, can have its own boxes. A callback is a routine you choose for Hitman to run when something happens, such as a box colliding with Mario.\u003c/p>\n\u003ch2 id=\"How_Hitman_prepares_the_ROM\">\u003ca class=\"heading-link\" href=\"#en/internals/How_Hitman_prepares_the_ROM\">How Hitman prepares the ROM\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>Hitman uses the PIXI list to find sprites. If you supplied an UberASMTool list, it checks that list as well. It reads the directives that link hitboxes (\u003ccode>;#inchbi\u003c/code>) and properties (\u003ccode>;#inchmprop\u003c/code>). It also checks its own resource folders.\u003c/li>\n\u003cli>Hitman reads the files to find the hitboxes each pose uses, the callbacks that belong to each box, and the initial property values for each sprite.\u003c/li>\n\u003cli>It builds tables the game can read from ROM and gathers the routines and callbacks it needs to install.\u003c/li>\n\u003cli>Asar patches a temporary copy of the input ROM. If it succeeds, Hitman writes the output ROM and publishes the defines for PIXI and UberASMTool.\u003c/li>\n\u003c/ol>\n\u003cp>Then run PIXI and UberASMTool on the output ROM. A number in the sprite list identifies a type, such as a particular enemy. Two enemies of that type in a level each occupy their own slot, meaning their own entry in the tables the game uses to track active sprites.\u003c/p>\n\u003ch2 id=\"What_Hitman_changes_in_the_game\">\u003ca class=\"heading-link\" href=\"#en/internals/What_Hitman_changes_in_the_game\">What Hitman changes in the game\u003c/a>\u003c/h2>\n\u003cp>A \u003cem>hijack\u003c/em> redirects the game from a particular ROM address to code in the patch. When Mario shoots a fireball, for instance, the game reaches its usual impact check. Hitman takes over there to choose the box and the response if it hits a Normal sprite.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>SMW address\u003c/th>\u003cth>What changes\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$07F7D2\u003c/code>\u003c/td>\u003ctd>When a Normal sprite slot is prepared, load its Hitman properties and reset the collision pairs it belongs to. Then run SMW&#x27;s initialization steps.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$01A411\u003c/code>\u003c/td>\u003ctd>Check collisions between Normal sprites using their configured hitboxes and pair mask, while keeping filters such as sprite status. Handle ordinary collisions and shell impacts.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$02A0AC\u003c/code>\u003c/td>\u003ctd>Check Mario and Yoshi fireballs against Normal sprites using the box and event configured for the Extended sprite number. A different routine handles impacts with level blocks.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$028139\u003c/code>\u003c/td>\u003ctd>Compare both sprites&#x27; boxes before resolving an explosion from a Normal sprite.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$0293AE\u003c/code>\u003c/td>\u003ctd>Find Normal sprites a Quake sprite can affect. Its timer and impact response are handled separately.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$0294C1\u003c/code>\u003c/td>\u003ctd>Find grounded sprites affected when Mario lands during a cape dive, subject to status checks.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>$019F74\u003c/code>\u003c/td>\u003ctd>Let a carried sprite skip the game&#x27;s extra drawing code with \u003ccode>SkipVanillaCarriedDraw\u003c/code>. It can draw itself and still use the game&#x27;s carried-state logic.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>The table shows SMW&#x27;s addresses before the patch applies \u003ccode>|!rom\u003c/code>. The initialization hook sits next to \u003ccode>$07F7D6\u003c/code>, where the patch writes the pointer PIXI and UberASMTool use to find installed routines.\u003c/p>\n\u003ch3 id=\"Why_Hitman_supplies_its_own_spawn_routines\">\u003ca class=\"heading-link\" href=\"#en/internals/Why_Hitman_supplies_its_own_spawn_routines\">Why Hitman supplies its own spawn routines\u003c/a>\u003c/h3>\n\u003cp>A newly spawned sprite occupies a free slot. The previous sprite in that slot might have had different properties or a collision blocked with another sprite. Skipping Hitman&#x27;s initialization can leave those values behind.\u003c/p>\n\u003cp>The installer copies Hitman&#x27;s versions of \u003ccode>Spawn/Sprite.asm\u003c/code> and \u003ccode>Spawn/SpriteSafe.asm\u003c/code> into PIXI. Both find a free slot and call the initialization code at \u003ccode>$07F7D2\u003c/code>. For a custom sprite, they set its custom number and flag first so Hitman can look up the right values.\u003c/p>\n\u003cp>Initialization writes the property values to RAM, allows collisions for the slot&#x27;s pairs again, and runs the game&#x27;s initialization routines. It preserves the offsets and speeds the spawn code needs. For custom sprites, the spawn routines also save those values while PIXI loads the sprite&#x27;s data. Then they mark the slot for INIT and set the requested position and speed.\u003c/p>\n\u003cp>For example, a passenger&#x27;s blocked collision is cleared when another sprite takes its slot. On success, the spawn call returns the new slot in Y and clears Carry. If there is no free slot, Y is \u003ccode>$FF\u003c/code> and Carry is set. See \u003ca href=\"#en/api/Spawn_sprites_with_PIXI\">Spawn sprites with PIXI\u003c/a>.\u003c/p>\n\u003ch2 id=\"How_hitboxes_are_stored\">\u003ca class=\"heading-link\" href=\"#en/internals/How_hitboxes_are_stored\">How hitboxes are stored\u003c/a>\u003c/h2>\n\u003cp>Hitman stores each box&#x27;s shape, its actions, and the list of boxes in a pose separately. Two poses can share a 16 × 16 pixel shape even if they use different callbacks.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Shared data\u003c/th>\u003cth>When it can be reused\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Geometry\u003c/td>\u003ctd>Width, height, and offsets in both orientations match.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Action profile\u003c/td>\u003ctd>The box&#x27;s actions match, including inherited callbacks.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Pose list\u003c/td>\u003ctd>Both poses use the same geometry, actions, and callback box IDs in the same order.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"From_a_context_to_its_boxes\">\u003ca class=\"heading-link\" href=\"#en/internals/From_a_context_to_its_boxes\">From a context to its boxes\u003c/a>\u003c/h3>\n\u003cp>Suppose a sprite&#x27;s poses start at entry 40. Pose 0 is at entry 40 and pose 2 is at entry 42. That starting index is the base context. The \u003ccode>!MiSpriteHitboxContext\u003c/code> define holds it so you can add a pose index without looking up the starting entry yourself.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode>Base context + pose\n    → ContextPosesHitboxes\n    → PoseHitboxesIndexers\n    → list in PoseHitboxes\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>PoseHitboxes\u003c/code> stores two-byte offsets to the geometry and ends with \u003ccode>$FFFF\u003c/code>. At the same positions, \u003ccode>PoseHitboxProfiles\u003c/code> identifies the action profiles and \u003ccode>PoseHitboxCallbackIds\u003c/code> holds the historical box ID passed to callbacks in Y.\u003c/p>\n\u003cp>An action profile selects a routine address from \u003ccode>HitboxActions\u003c/code>. Each address takes three bytes. The geometry tables and their indexes share a ROM bank. Hitman checks their size when building the tables, and Asar checks where they end up.\u003c/p>\n\u003ch2 id=\"What_goes_in_RAM\">\u003ca class=\"heading-link\" href=\"#en/internals/What_goes_in_RAM\">What goes in RAM\u003c/a>\u003c/h2>\n\u003cp>A sprite with pose hitboxes stores its current pose and flip. A sprite with an adjustable box stores its size and offsets. Some of these values use the same bytes, so write the data for the new mode whenever you switch.\u003c/p>\n\u003cp>For each Normal sprite property, Hitman builds one 256-entry ROM table for vanilla sprite numbers and one for custom numbers. When a slot is initialized, Hitman copies the value for that sprite type to RAM. Two instances of the same type can start with the same value and change it independently.\u003c/p>\n\u003cp>The pair mask stores one bit per pair of Normal sprite slots. When a slot is reused, Hitman allows collision for its pairs again. The larger slot selects a row and the smaller slot selects a bit within it. Each row begins at a new byte. The table takes 14 bytes in LoROM (12 slots) and 39 bytes in SA-1 (22 slots).\u003c/p>\n\u003cp>HB1, HB2, and the callback result are temporary. Copy any box edge you still need before running another check. See \u003ca href=\"#en/api/Move_Hitman%27s_RAM_block\">Move Hitman&#x27;s RAM block\u003c/a> to relocate the persistent tables.\u003c/p>\n\u003ch2 id=\"How_a_collision_is_checked\">\u003ca class=\"heading-link\" href=\"#en/internals/How_a_collision_is_checked\">How a collision is checked\u003c/a>\u003c/h2>\n\u003ch3 id=\"Prepare_both_rectangles\">\u003ca class=\"heading-link\" href=\"#en/internals/Prepare_both_rectangles\">Prepare both rectangles\u003c/a>\u003c/h3>\n\u003cp>Hitman calculates each box&#x27;s left, top, right, and bottom edges. For each box of a pose, it adds the offset for the current orientation to the object&#x27;s position. It adds width and height to get the right and bottom edges. Clipping routines convert the original game&#x27;s boxes to the same coordinate system.\u003c/p>\n\u003cp>Hitman stores the rectangles temporarily in HB1 and HB2. HB1 might hold the sprite&#x27;s box and HB2 Mario&#x27;s. If they are separated on either axis, they do not collide. Edges that meet count as contact.\u003c/p>\n\u003ch3 id=\"Check_the_boxes_and_run_callbacks\">\u003ca class=\"heading-link\" href=\"#en/internals/Check_the_boxes_and_run_callbacks\">Check the boxes and run callbacks\u003c/a>\u003c/h3>\n\u003cp>A check without callbacks can stop as soon as a box collides. A check with callbacks goes through every box in pose order. Each box can run its own routine. For example, the top box can serve as a platform and a side box can keep Mario from walking through the sprite.\u003c/p>\n\u003cp>Hitman clears \u003ccode>!HitmanDefault\u003c/code> before the check. Callbacks can set bits there for the calling code to interpret. In this mode, Carry is set when that result is nonzero. A geometry-only check sets Carry when a collision occurs. A box that hits Mario and runs \u003ccode>Nothing\u003c/code>, for example, can leave the callback result at zero.\u003c/p>\n\u003ch2 id=\"How_Hitman_handles_vanilla_interactions\">\u003ca class=\"heading-link\" href=\"#en/internals/How_Hitman_handles_vanilla_interactions\">How Hitman handles vanilla interactions\u003c/a>\u003c/h2>\n\u003cp>The patch connects to the game&#x27;s routines for Normal sprite collisions, fireballs, explosions, Quake sprites, and cape dives. Before comparing boxes, Hitman can skip an inactive sprite or a pair blocked by the collision mask.\u003c/p>\n\u003cp>When a hit occurs, the receiver&#x27;s \u003ccode>VanillaResponseMask\u003c/code> controls the game&#x27;s response. \u003ccode>VanillaEventMask\u003c/code> enables the notification. Hitman adds the bit to \u003ccode>ActionFlag\u003c/code> and runs any assigned callback after the response. This lets you disable the game&#x27;s fireball response but still handle the hit yourself.\u003c/p>\n\u003cp>In a vanilla fireball callback, A identifies the event, X identifies the sprite that was hit, and Y identifies the fireball. In a hitbox callback, Y identifies the box. The \u003ca href=\"#en/api/Event_flags_and_callbacks\">API event table\u003c/a> explains each event&#x27;s inputs.\u003c/p>\n\u003ch3 id=\"What_changes_for_projectiles\">\u003ca class=\"heading-link\" href=\"#en/internals/What_changes_for_projectiles\">What changes for projectiles\u003c/a>\u003c/h3>\n\u003cp>The fireball routine chooses the box geometry and the event by Extended sprite number. You can change a projectile&#x27;s shape and keep Mario&#x27;s fireball response. You can also check its boxes manually and handle the impact in your own code.\u003c/p>\n\u003ch2 id=\"How_PIXI_and_UberASMTool_find_the_routines\">\u003ca class=\"heading-link\" href=\"#en/internals/How_PIXI_and_UberASMTool_find_the_routines\">How PIXI and UberASMTool find the routines\u003c/a>\u003c/h2>\n\u003cp>The ROM stores a pointer to \u003ccode>RoutinesTable\u003c/code> at \u003ccode>$07F7D6\u003c/code>. The table lists the addresses of the base routines and callbacks included in the patch. While assembling a resource, \u003ccode>HitmanDefines.asm\u003c/code> reads the table to resolve \u003ccode>!Hitman_Base_*\u003c/code> and \u003ccode>!Hitman_Callback_*\u003c/code>.\u003c/p>\n\u003cp>Adding a callback or base routine can move entries in the table. Run Hitman first, then reassemble the resources that use its defines with PIXI and UberASMTool so their calls point to the new addresses.\u003c/p>","headings":[{"id":"How_Hitman_prepares_the_ROM","title":"How Hitman prepares the ROM","level":2},{"id":"What_Hitman_changes_in_the_game","title":"What Hitman changes in the game","level":2},{"id":"Why_Hitman_supplies_its_own_spawn_routines","title":"Why Hitman supplies its own spawn routines","level":3},{"id":"How_hitboxes_are_stored","title":"How hitboxes are stored","level":2},{"id":"From_a_context_to_its_boxes","title":"From a context to its boxes","level":3},{"id":"What_goes_in_RAM","title":"What goes in RAM","level":2},{"id":"How_a_collision_is_checked","title":"How a collision is checked","level":2},{"id":"Prepare_both_rectangles","title":"Prepare both rectangles","level":3},{"id":"Check_the_boxes_and_run_callbacks","title":"Check the boxes and run callbacks","level":3},{"id":"How_Hitman_handles_vanilla_interactions","title":"How Hitman handles vanilla interactions","level":2},{"id":"What_changes_for_projectiles","title":"What changes for projectiles","level":3},{"id":"How_PIXI_and_UberASMTool_find_the_routines","title":"How PIXI and UberASMTool find the routines","level":2}]}},"es":{"main":{"title":"Hitman Tool","html":"\u003cp>\u003cstrong>Hitman Tool\u003c/strong> es una herramienta creada por anonimzwx para facilitar el manejo de colisiones e interacciones en \u003cem>Super Mario World\u003c/em>. Permite configurar las interacciones del juego original (vanilla) y crear respuestas propias para sprites custom.\u003c/p>\n\u003ch2 id=\"Funcionalidades\">\u003ca class=\"heading-link\" href=\"#es/main/Funcionalidades\">Funcionalidades\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Hitboxes configurables.\u003c/strong> Un sprite custom puede usar la caja de colisión del juego original, una sola caja cuyo tamaño y posición se ajustan desde el código, o varias cajas por pose.\u003c/li>\n\u003cli>\u003cstrong>Callbacks por hitbox.\u003c/strong> En las interacciones con Mario, puedes asignar una rutina a cada caja para actuar cuando hay contacto y otra para cuando no lo hay.\u003c/li>\n\u003cli>\u003cstrong>Interacciones vanilla configurables.\u003c/strong> Puedes consultar flags para saber qué interacción recibió un sprite o asignar callbacks para responder a ella. Entre los eventos disponibles están las bolas de fuego de Mario y Yoshi, las explosiones, los \u003cem>quake sprites\u003c/em> y el contacto entre sprites. Por ejemplo, un enemigo puede reaccionar al impacto de un caparazón o cambiar de dirección al encontrarse con otro sprite.\u003c/li>\n\u003cli>\u003cstrong>Colisiones con sprites extendidos.\u003c/strong> Un proyectil custom puede usar hitboxes personalizadas para comprobar si toca a Mario o a un sprite normal y decidir cómo reaccionar.\u003c/li>\n\u003cli>\u003cstrong>Propiedades personalizadas.\u003c/strong> Puedes añadir propiedades a sprites normales, tanto vanilla como custom. Por ejemplo, una propiedad puede indicar si un sprite es grande o pequeño. Otros sprites pueden leerla y reaccionar de forma distinta según su tamaño.\u003c/li>\n\u003cli>\u003cstrong>Rutinas de colisión reutilizables.\u003c/strong> Hitman Tool incluye rutinas para preparar cajas de colisión, comprobar si se tocan y aplicar respuestas como el rebote.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"Quick_Start\">\u003ca class=\"heading-link\" href=\"#es/main/Quick_Start\">Quick Start\u003c/a>\u003c/h2>\n\u003cp>\u003cstrong>Guía rápida de instalación:\u003c/strong> \u003ca href=\"#es/quick-start\">Quick Start\u003c/a>\u003c/p>\n\u003ch2 id=\"Archivos_y_Formatos\">\u003ca class=\"heading-link\" href=\"#es/main/Archivos_y_Formatos\">Archivos y Formatos\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#es/formats\">Archivos y formatos de Hitman Tool\u003c/a>\u003c/p>\n\u003ch2 id=\"Hitman_Tool_y_Sprites\">\u003ca class=\"heading-link\" href=\"#es/main/Hitman_Tool_y_Sprites\">Hitman Tool y Sprites\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#es/sprites\">Usar Hitman Tool con sprites\u003c/a>\u003c/p>\n\u003ch2 id=\"Hitman_Tool_en_UberASM\">\u003ca class=\"heading-link\" href=\"#es/main/Hitman_Tool_en_UberASM\">Hitman Tool en UberASM\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#es/uberasm\">Usar Hitman Tool con UberASM\u003c/a>\u003c/p>\n\u003ch2 id=\"API\">\u003ca class=\"heading-link\" href=\"#es/main/API\">API\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#es/api\">Referencia de la API ASM de Hitman Tool\u003c/a>\u003c/p>\n\u003ch2 id=\"Funcionamiento_Interno_del_Tool\">\u003ca class=\"heading-link\" href=\"#es/main/Funcionamiento_Interno_del_Tool\">Funcionamiento Interno del Tool\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"#es/internals\">Funcionamiento interno de Hitman Tool\u003c/a>\u003c/p>","headings":[{"id":"Funcionalidades","title":"Funcionalidades","level":2},{"id":"Quick_Start","title":"Quick Start","level":2},{"id":"Archivos_y_Formatos","title":"Archivos y Formatos","level":2},{"id":"Hitman_Tool_y_Sprites","title":"Hitman Tool y Sprites","level":2},{"id":"Hitman_Tool_en_UberASM","title":"Hitman Tool en UberASM","level":2},{"id":"API","title":"API","level":2},{"id":"Funcionamiento_Interno_del_Tool","title":"Funcionamiento Interno del Tool","level":2}]},"quick-start":{"title":"Quick Start","html":"\u003cp>Esta guía explica cómo instalar \u003ca href=\"#es/main\">Hitman Tool\u003c/a> en Windows o Linux.\u003c/p>\n\u003ch2 id=\"Requisitos\">\u003ca class=\"heading-link\" href=\"#es/quick-start/Requisitos\">Requisitos\u003c/a>\u003c/h2>\n\u003cp>Instala el \u003ca href=\"https://dotnet.microsoft.com/download/dotnet/8.0\">runtime de .NET 8\u003c/a> para tu sistema operativo. Con el runtime basta.\u003c/p>\n\u003cp>Descarga Hitman Tool desde \u003ca href=\"https://snestorage.dev/Resource/16\">SNEStorage\u003c/a> y extrae el paquete completo.\u003c/p>\n\u003ch2 id=\"Preparar_los_recursos\">\u003ca class=\"heading-link\" href=\"#es/quick-start/Preparar_los_recursos\">Preparar los recursos\u003c/a>\u003c/h2>\n\u003ch3 id=\"Sprites_para_PIXI\">\u003ca class=\"heading-link\" href=\"#es/quick-start/Sprites_para_PIXI\">Sprites para PIXI\u003c/a>\u003c/h3>\n\u003cp>Copia el paquete de cada sprite a la carpeta de PIXI que le corresponda. Mantén los archivos y subcarpetas del paquete en su sitio.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>sprites/\u003c/code> para sprites normales.\u003c/li>\n\u003cli>\u003ccode>cluster/\u003c/code> para cluster sprites.\u003c/li>\n\u003cli>\u003ccode>extended/\u003c/code> para sprites extendidos.\u003c/li>\n\u003c/ul>\n\u003cp>Luego añade el sprite a la lista de PIXI. Si el ASM del sprite ya enlaza archivos mediante \u003ccode>;#inchbi\u003c/code> o \u003ccode>;#inchmprop\u003c/code>, conserva esos archivos en las rutas que indica el ASM.\u003c/p>\n\u003ch3 id=\"Recursos_para_UberASMTool\">\u003ca class=\"heading-link\" href=\"#es/quick-start/Recursos_para_UberASMTool\">Recursos para UberASMTool\u003c/a>\u003c/h3>\n\u003cp>Si usas UberASMTool, copia cada recurso a la carpeta que corresponda (\u003ccode>level/\u003c/code>, \u003ccode>overworld/\u003c/code> o \u003ccode>gamemode/\u003c/code>, por ejemplo) y añádelo a su lista. Si el ASM enlaza un archivo \u003ccode>.hitboxinfo\u003c/code> con \u003ccode>;#inchbi\u003c/code>, conserva la ruta indicada en el recurso.\u003c/p>\n\u003ch3 id=\"Carpetas_tradicionales\">\u003ca class=\"heading-link\" href=\"#es/quick-start/Carpetas_tradicionales\">Carpetas tradicionales\u003c/a>\u003c/h3>\n\u003cp>Si el recurso indica que debes colocar archivos en la carpeta de Hitman Tool, usa estas rutas.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Archivo\u003c/th>\u003cth>Carpeta\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Archivo \u003ccode>.hitboxinfo\u003c/code>\u003c/td>\u003ctd>\u003ccode>HitboxInfo/\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>JSON de propiedades de un sprite\u003c/td>\u003ctd>\u003ccode>CustomProperties/PerSprite/\u003c/code>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"Instalar_Hitman_Tool\">\u003ca class=\"heading-link\" href=\"#es/quick-start/Instalar_Hitman_Tool\">Instalar Hitman Tool\u003c/a>\u003c/h2>\n\u003cp>Crea una copia de la ROM de tu proyecto para usarla como salida. El archivo de salida debe existir antes de ejecutar la herramienta.\u003c/p>\n\u003cp>Abre una terminal en la carpeta de Hitman Tool y ejecuta \u003ccode>.\\ht.exe\u003c/code> en Windows o \u003ccode>./ht\u003c/code> en Linux. La herramienta te pedirá estas rutas.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Pregunta\u003c/th>\u003cth>Ejemplo\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>ROM de entrada\u003c/td>\u003ctd>\u003ccode>C:\\MiHack\\MiHack.smc\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ROM de salida\u003c/td>\u003ctd>\u003ccode>C:\\MiHack\\MiHack_Hitman.smc\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Carpeta de PIXI\u003c/td>\u003ctd>\u003ccode>C:\\MiHack\\PIXI\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lista de PIXI\u003c/td>\u003ctd>\u003ccode>C:\\MiHack\\PIXI\\list.txt\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Carpeta de UberASMTool (opcional)\u003c/td>\u003ctd>\u003ccode>C:\\MiHack\\UberASMTool\u003c/code>. Pulsa Enter para omitir la integración.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lista de UberASMTool (si indicaste la carpeta)\u003c/td>\u003ctd>\u003ccode>list.txt\u003c/code> si está dentro de esa carpeta. Pulsa Enter para instalar solo las definiciones de Hitman Tool.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Las rutas se guardan en \u003ccode>Json/Settings.json\u003c/code>. Para repetir la instalación con las rutas guardadas, añade \u003ccode>-use-settings\u003c/code> al comando. Para cambiar o desactivar la integración, ejecuta la herramienta sin ese argumento y responde de nuevo a las preguntas.\u003c/p>\n\u003ch2 id=\"Finalizar_la_instalación\">\u003ca class=\"heading-link\" href=\"#es/quick-start/Finalizar_la_instalaci%C3%B3n\">Finalizar la instalación\u003c/a>\u003c/h2>\n\u003cp>Ejecuta PIXI sobre la ROM de salida con la misma lista de sprites. Si configuraste UberASMTool, ejecútalo también sobre esa ROM.\u003c/p>\n\u003cp>Si cambias los archivos de hitboxes o las propiedades que lee Hitman Tool, vuelve a ejecutar Hitman Tool antes de ejecutar PIXI y, si lo usas, UberASMTool.\u003c/p>","headings":[{"id":"Requisitos","title":"Requisitos","level":2},{"id":"Preparar_los_recursos","title":"Preparar los recursos","level":2},{"id":"Sprites_para_PIXI","title":"Sprites para PIXI","level":3},{"id":"Recursos_para_UberASMTool","title":"Recursos para UberASMTool","level":3},{"id":"Carpetas_tradicionales","title":"Carpetas tradicionales","level":3},{"id":"Instalar_Hitman_Tool","title":"Instalar Hitman Tool","level":2},{"id":"Finalizar_la_instalación","title":"Finalizar la instalación","level":2}]},"formats":{"title":"Archivos y Formatos","html":"\u003cp>\u003ca href=\"#es/main\">Hitman Tool\u003c/a> lee archivos que definen propiedades, cambian sus valores para sprites específicos o describen las cajas de colisión de un recurso.\u003c/p>\n\u003ch2 id=\"Tipos_de_archivos\">\u003ca class=\"heading-link\" href=\"#es/formats/Tipos_de_archivos\">Tipos de archivos\u003c/a>\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>Para qué sirve\u003c/th>\u003cth>Dónde se coloca\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Definición de propiedad (JSON)\u003c/td>\u003ctd>Crea una propiedad y fija sus valores iniciales.\u003c/td>\u003ctd>\u003ccode>CustomProperties/\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Configuración por sprite (JSON)\u003c/td>\u003ctd>Cambia propiedades para un tipo de sprite normal y permite asignarle callbacks de interacciones vanilla.\u003c/td>\u003ctd>Junto al recurso, mediante \u003ccode>;#inchmprop\u003c/code>, o en \u003ccode>CustomProperties/PerSprite/\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Archivo \u003ccode>.hitboxinfo\u003c/code>\u003c/td>\u003ctd>Define cajas de colisión y las asigna a poses.\u003c/td>\u003ctd>Junto al recurso, mediante \u003ccode>;#inchbi\u003c/code>, o en \u003ccode>HitboxInfo/\u003c/code>.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Las carpetas \u003ccode>CustomProperties/\u003c/code> y \u003ccode>HitboxInfo/\u003c/code> están dentro de la carpeta de Hitman Tool.\u003c/p>\n\u003ch2 id=\"Inclusión_de_archivos_desde_PIXI_y_UberASMTool\">\u003ca class=\"heading-link\" href=\"#es/formats/Inclusi%C3%B3n_de_archivos_desde_PIXI_y_UberASMTool\">Inclusión de archivos desde PIXI y UberASMTool\u003c/a>\u003c/h2>\n\u003cp>Coloca las directivas en el archivo ASM principal del recurso. Las rutas se escriben desde la carpeta de ese archivo.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>;#inchbi &quot;MiSprite.hitboxinfo&quot;\n;#inchmprop &quot;MiSprite.hitman.json&quot;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Puedes incluir varios archivos \u003ccode>.hitboxinfo\u003c/code> desde un mismo ASM de PIXI o UberASMTool. Cada archivo genera un define de contexto a partir de su nombre. Por ejemplo, \u003ccode>MiSprite.hitboxinfo\u003c/code> genera \u003ccode>!MiSpriteHitboxContext\u003c/code> en \u003ccode>HitmanDefines.asm\u003c/code>. Si un archivo vinculado tiene el mismo nombre que otro de \u003ccode>HitboxInfo/\u003c/code>, se usa el vinculado.\u003c/p>\n\u003cp>Usa \u003ccode>;#inchmprop\u003c/code> una sola vez en el ASM principal de un sprite normal de PIXI. Para instalar los recursos y regenerar sus definiciones, consulta el \u003ca href=\"#es/quick-start\">Quick Start\u003c/a>.\u003c/p>\n\u003ch2 id=\"Definir_propiedades\">\u003ca class=\"heading-link\" href=\"#es/formats/Definir_propiedades\">Definir propiedades\u003c/a>\u003c/h2>\n\u003cp>Crea un JSON en \u003ccode>CustomProperties/\u003c/code> con el nombre de la propiedad y un valor inicial para sprites normales vanilla y otro para sprites normales custom. Cada valor ocupa un byte y se escribe en hexadecimal entre comillas.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>{\n  &quot;Name&quot;: &quot;IsLarge&quot;,\n  &quot;DefaultValueVanilla&quot;: &quot;00&quot;,\n  &quot;DefaultValueCustom&quot;: &quot;00&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>En este ejemplo, todos los sprites empiezan con \u003ccode>00\u003c/code> (pequeño). Puedes asignar \u003ccode>01\u003c/code> a un sprite grande. Otros sprites pueden leer la propiedad para decidir cómo reaccionar según su tamaño.\u003c/p>\n\u003ch2 id=\"Cambiar_propiedades_para_un_sprite\">\u003ca class=\"heading-link\" href=\"#es/formats/Cambiar_propiedades_para_un_sprite\">Cambiar propiedades para un sprite\u003c/a>\u003c/h2>\n\u003cp>El siguiente JSON asigna \u003ccode>01\u003c/code> a \u003ccode>IsLarge\u003c/code> para todas las instancias de un sprite custom. Las propiedades que omitas conservan su valor inicial.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>{\n  &quot;Name&quot;: &quot;MiSprite&quot;,\n  &quot;IsCustom&quot;: true,\n  &quot;Properties&quot;: [\n    { &quot;PropertyName&quot;: &quot;IsLarge&quot;, &quot;Value&quot;: &quot;01&quot; }\n  ]\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Si colocas el JSON en \u003ccode>CustomProperties/PerSprite/\u003c/code>, el campo \u003ccode>Name\u003c/code> de un sprite custom debe coincidir con el nombre base de su archivo CFG o JSON en PIXI. Por ejemplo, usa \u003ccode>MiSprite\u003c/code> para \u003ccode>MiSprite.json\u003c/code>. Si usas \u003ccode>;#inchmprop\u003c/code>, Hitman Tool obtiene ese nombre de la entrada de PIXI. Para configurar un sprite vanilla desde la carpeta central, usa \u003ccode>&quot;IsCustom&quot;: false\u003c/code> e indica su número hexadecimal en \u003ccode>ID\u003c/code>.\u003c/p>\n\u003cp>El mismo JSON admite un bloque opcional \u003ccode>VanillaCallbacks\u003c/code>. Sus campos son \u003ccode>SpriteSprite\u003c/code>, \u003ccode>Fireball\u003c/code>, \u003ccode>YoshiFireball\u003c/code>, \u003ccode>Quake\u003c/code> y \u003ccode>CapeDive\u003c/code>. Cada valor es el nombre de una rutina. Para recibir el evento, habilita su bit en la propiedad \u003ccode>VanillaEventMask\u003c/code>. Los archivos anteriores también pueden usar \u003ccode>VanillaInteractionCallback\u003c/code> como respaldo y para explosiones.\u003c/p>\n\u003ch2 id=\"HitboxInfo\">\u003ca class=\"heading-link\" href=\"#es/formats/HitboxInfo\">HitboxInfo\u003c/a>\u003c/h2>\n\u003cp>Cada archivo \u003ccode>.hitboxinfo\u003c/code> define las cajas de un contexto. Una pose puede tener varias cajas, compartirlas con otras poses o quedar vacía. Puedes usar archivos de ambos formatos en una instalación. Cada archivo debe seguir un solo formato.\u003c/p>\n\u003ch3 id=\"Formato_actual\">\u003ca class=\"heading-link\" href=\"#es/formats/Formato_actual\">Formato actual\u003c/a>\u003c/h3>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>AllHitboxes:\n    .XOffset $08\n    .XPivot $08\n\nHitboxesPerPose:\n    .Pose0 0\n    .Pose1..2 0,1\n    .Pose[4,6] 1\n    .Pose7\n\nAllHitboxCallbacks:\n    .OnPlayerNonCollision CheckPlayerIsAbove\n\nHitbox0:\n    .YOffset $FFFF\n    .Width $10\n    .Height $08\n    .OnPlayerCollision CheckBounce\n\nHitbox1:\n    .XOffset $0C\n    .Width $08\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\n\u003cli>\u003ccode>HitboxesPerPose:\u003c/code> indica qué cajas usa cada pose, en el orden en que se comprueban. Los números de pose y de caja son decimales. \u003ccode>.Pose1..2\u003c/code> asigna las mismas cajas a las poses 1 y 2. \u003ccode>.Pose[4,6]\u003c/code> selecciona solo las poses 4 y 6. Una pose sin cajas, como la 7, queda vacía. Los números omitidos también quedan vacíos.\u003c/li>\n\u003cli>\u003ccode>HitboxN:\u003c/code> define una caja. \u003ccode>.XOffset\u003c/code> y \u003ccode>.YOffset\u003c/code> desplazan la caja desde el origen del recurso. Empiezan en \u003ccode>$00\u003c/code>. \u003ccode>.Width\u003c/code> y \u003ccode>.Height\u003c/code> son sus dimensiones en píxeles. Deben ser positivas y empiezan en \u003ccode>$10\u003c/code>. Para desplazar la caja un píxel hacia arriba, usa \u003ccode>$FFFF\u003c/code> (−1) en Y. \u003ccode>$FF\u003c/code> representa +255 en este formato.\u003c/li>\n\u003cli>\u003ccode>AllHitboxes:\u003c/code> permite desplazar todas las cajas. \u003ccode>.XPivot\u003c/code> y \u003ccode>.YPivot\u003c/code> fijan el punto alrededor del cual se refleja cada eje al voltear la caja. Una caja puede fijar su propio pivote, incluso a \u003ccode>$00\u003c/code>. Si no hay pivote para un eje, su desplazamiento se mantiene al voltear. El desplazamiento global se suma después de calcular el reflejo.\u003c/li>\n\u003cli>\u003ccode>AllHitboxCallbacks:\u003c/code> define callbacks comunes. Cada caja puede sustituirlos por separado. \u003ccode>.OnPlayerCollision\u003c/code> se usa al tocar a Mario y \u003ccode>.OnPlayerNonCollision\u003c/code> cuando la caja no lo toca. El lector reconoce campos para otras familias, pero el parche actual solo ejecuta estos dos callbacks por caja del formato actual.\u003c/li>\n\u003c/ul>\n\u003cp>Algunos archivos del formato actual usan \u003ccode>AllHitboxXOffset:\u003c/code> y \u003ccode>AllHitboxYOffset:\u003c/code>. Esas secciones siguen funcionando y aplican el desplazamiento antes de reflejar la caja. Usa esas secciones o \u003ccode>AllHitboxes:\u003c/code> en un mismo archivo.\u003c/p>\n\u003ch4 id=\"Valores_por_defecto\">\u003ca class=\"heading-link\" href=\"#es/formats/Valores_por_defecto\">Valores por defecto\u003c/a>\u003c/h4>\n\u003cp>Si omites un campo, Hitman Tool usa estos valores.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Campo\u003c/th>\u003cth>Valor al omitirlo\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.XOffset\u003c/code> y \u003ccode>.YOffset\u003c/code>\u003c/td>\u003ctd>\u003ccode>$00\u003c/code>. Si hay un desplazamiento en \u003ccode>AllHitboxes:\u003c/code>, se suma al de la caja.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.Width\u003c/code> y \u003ccode>.Height\u003c/code>\u003c/td>\u003ctd>\u003ccode>$10\u003c/code> (16 píxeles) por eje.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.XPivot\u003c/code> y \u003ccode>.YPivot\u003c/code>\u003c/td>\u003ctd>Se usa el pivote de \u003ccode>AllHitboxes:\u003c/code>. Si tampoco se define allí, el desplazamiento de ese eje se conserva al voltear.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>.OnPlayerCollision\u003c/code> y \u003ccode>.OnPlayerNonCollision\u003c/code>\u003c/td>\u003ctd>Se usa el callback de \u003ccode>AllHitboxCallbacks:\u003c/code> para ese campo. Si tampoco se define allí, se usa \u003ccode>Nothing\u003c/code>.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"Formato_legacy\">\u003ca class=\"heading-link\" href=\"#es/formats/Formato_legacy\">Formato legacy\u003c/a>\u003c/h3>\n\u003cp>El formato legacy organiza las cajas en tablas paralelas. La primera entrada de cada tabla corresponde a la caja \u003ccode>$00\u003c/code>.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>PoseHitBoxes:\n    db $00,$FF\n    db $FF\n\nHitboxXOffset:\n    dw $0000\nHitboxYOffset:\n    dw $FFFF\nHitboxWidth:\n    dw $0010\nHitboxHeight:\n    dw $0008\nHitboxAction1:\n    dw $0000\nHitboxAction2:\n    dw $0002\nActions:\n    dw CheckBounce\n    dw CheckPlayerIsAbove\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\n\u003cli>La pose 0 usa la caja \u003ccode>$00\u003c/code>. Cada pose termina en \u003ccode>$FF\u003c/code>. La pose 1 solo contiene el terminador y queda vacía.\u003c/li>\n\u003cli>Las tablas de desplazamiento, ancho y alto tienen una entrada por caja. Las tablas opcionales \u003ccode>HitboxXOffsetFlip\u003c/code> y \u003ccode>HitboxYOffsetFlip\u003c/code> permiten indicar desplazamientos al voltear. Si se omiten, se usan los desplazamientos normales.\u003c/li>\n\u003cli>\u003ccode>HitboxAction1\u003c/code> selecciona la rutina de contacto y \u003ccode>HitboxAction2\u003c/code> la de ausencia de contacto. Los valores son desplazamientos dentro de \u003ccode>Actions:\u003c/code>. Usa \u003ccode>$0000\u003c/code> para la primera rutina, \u003ccode>$0002\u003c/code> para la segunda y así sucesivamente. Si no declaras acciones, se usa \u003ccode>Nothing\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"Incluir_rutinas_auxiliares\">\u003ca class=\"heading-link\" href=\"#es/formats/Incluir_rutinas_auxiliares\">Incluir rutinas auxiliares\u003c/a>\u003c/h4>\n\u003cp>Usa \u003ccode>Dependencies:\u003c/code> cuando un callback necesite una rutina auxiliar que Hitman Tool no pueda detectar por sí solo, por ejemplo si el nombre de la rutina aparece únicamente dentro de una macro. Escribe \u003ccode>dw\u003c/code> seguido del nombre de la rutina, sin la extensión \u003ccode>.asm\u003c/code>. Hitman Tool busca el archivo en \u003ccode>Routines/\u003c/code> y lo incluye al instalar el parche.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>Dependencies:\n    dw PlayerFloor\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Este ejemplo incluye \u003ccode>Routines/PlayerFloor.asm\u003c/code>. La declaración no llama a la rutina ni le asigna una caja. Los valores de \u003ccode>HitboxAction1\u003c/code> y \u003ccode>HitboxAction2\u003c/code> siguen apuntando a las entradas de \u003ccode>Actions:\u003c/code>.\u003c/p>","headings":[{"id":"Tipos_de_archivos","title":"Tipos de archivos","level":2},{"id":"Inclusión_de_archivos_desde_PIXI_y_UberASMTool","title":"Inclusión de archivos desde PIXI y UberASMTool","level":2},{"id":"Definir_propiedades","title":"Definir propiedades","level":2},{"id":"Cambiar_propiedades_para_un_sprite","title":"Cambiar propiedades para un sprite","level":2},{"id":"HitboxInfo","title":"HitboxInfo","level":2},{"id":"Formato_actual","title":"Formato actual","level":3},{"id":"Valores_por_defecto","title":"Valores por defecto","level":4},{"id":"Formato_legacy","title":"Formato legacy","level":3},{"id":"Incluir_rutinas_auxiliares","title":"Incluir rutinas auxiliares","level":4}]},"sprites":{"title":"Hitman Tool y Sprites","html":"\u003cp>En esta guía vas a crear hitboxes para un sprite y usarlas para detectar choques con Mario, con proyectiles y con otros sprites.\u003c/p>\n\u003ch2 id=\"Qué_necesitas\">\u003ca class=\"heading-link\" href=\"#es/sprites/Qu%C3%A9_necesitas\">Qué necesitas\u003c/a>\u003c/h2>\n\u003cp>Si es la primera vez que instalas Hitman Tool, sigue el \u003ca href=\"#es/quick-start\">Quick Start\u003c/a> para preparar las rutas y saber en qué ROM insertar el sprite.\u003c/p>\n\u003ch2 id=\"Crear_hitboxes_para_un_Normal_sprite\">\u003ca class=\"heading-link\" href=\"#es/sprites/Crear_hitboxes_para_un_Normal_sprite\">Crear hitboxes para un Normal sprite\u003c/a>\u003c/h2>\n\u003ch3 id=\"Define_las_cajas_y_enlaza_los_archivos\">\u003ca class=\"heading-link\" href=\"#es/sprites/Define_las_cajas_y_enlaza_los_archivos\">Define las cajas y enlaza los archivos\u003c/a>\u003c/h3>\n\u003cp>Para empezar, vamos a usar un sprite con dos poses. La pose 0 ocupa un cuadrado de 16 × 16 píxeles. La pose 1 conserva el ancho, pero su caja se desplaza 8 píxeles hacia abajo y solo mide 8 píxeles de alto.\u003c/p>\n\u003cp>Guarda este archivo como \u003ccode>MiSprite.hitboxinfo\u003c/code> junto al ASM principal.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>HitboxesPerPose:\n    .Pose0 0\n    .Pose1 1\n\nHitbox0:\n    .Width $10\n    .Height $10\n\nHitbox1:\n    .YOffset $08\n    .Width $10\n    .Height $08\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Crea \u003ccode>MiSprite.hitman.json\u003c/code> en la misma carpeta. Con \u003ccode>HitboxSystem\u003c/code> en \u003ccode>03\u003c/code>, Hitman usa las cajas de la pose actual cuando otro sprite comprueba si choca con el tuyo.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>{\n  &quot;Name&quot;: &quot;MiSprite&quot;,\n  &quot;IsCustom&quot;: true,\n  &quot;Properties&quot;: [\n    { &quot;PropertyName&quot;: &quot;HitboxSystem&quot;, &quot;Value&quot;: &quot;03&quot; }\n  ]\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Añade estas líneas al ASM principal del sprite.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>;#inchbi &quot;MiSprite.hitboxinfo&quot;\n;#inchmprop &quot;MiSprite.hitman.json&quot;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Si quieres consultar otros modos de hitbox o reutilizar cajas entre poses, consulta \u003ca href=\"#es/formats/HitboxInfo\">HitboxInfo\u003c/a> y \u003ca href=\"#es/api/Publicar_la_hitbox_de_un_Normal_sprite\">Publicar la hitbox de un Normal sprite\u003c/a>.\u003c/p>\n\u003ch3 id=\"Indica_qué_pose_está_usando_el_sprite\">\u003ca class=\"heading-link\" href=\"#es/sprites/Indica_qu%C3%A9_pose_est%C3%A1_usando_el_sprite\">Indica qué pose está usando el sprite\u003c/a>\u003c/h3>\n\u003cp>Para que las hitboxes sigan la animación, usa el mismo índice de pose que al dibujar. Guarda el contexto base más ese índice en INIT y actualízalo cada vez que cambie la pose. En el ejemplo, el sprite empieza en la pose 0 y sin volteo.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; A e índices de 8 bits. X = slot del Normal sprite.\nLDA.b #!MiSpriteHitboxContext\nSTA !HitmanNormalContextIDLow,x\nLDA.b #!MiSpriteHitboxContext&gt;&gt;8\nSTA !HitmanNormalContextIDHigh,x\nLDA #$00\nSTA !HitmanNormalFlip,x\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Para la pose 1, usa \u003ccode>!MiSpriteHitboxContext+1\u003c/code> antes de separar los dos bytes. Al voltear el sprite, actualiza \u003ccode>!HitmanNormalFlip,x\u003c/code>. Los valores 0, 1, 2 y 3 indican sin volteo, horizontal, vertical y ambos, respectivamente. Si quieres que un desplazamiento se refleje con el volteo, define un pivote para ese eje en el archivo de hitboxes.\u003c/p>\n\u003ch3 id=\"Detectar_un_choque_con_Mario\">\u003ca class=\"heading-link\" href=\"#es/sprites/Detectar_un_choque_con_Mario\">Detectar un choque con Mario\u003c/a>\u003c/h3>\n\u003cp>Pasa a Hitman el contexto base más la pose actual. \u003ccode>!PoseIndex\u003c/code> guarda el índice de la pose actual del sprite. Puedes definir tu propia tabla de un byte por slot y actualizarla al cambiar de pose. Si usas Dynamic Xtreme, puedes leer \u003ccode>!LastPoseIndex,x\u003c/code> en su lugar cuando tenga una pose válida y uses los mismos índices en el archivo de hitboxes. En este ejemplo, el sprite salta hacia arriba cuando choca con Mario.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; A e índices de 8 bits. X = slot del Normal sprite.\nLDA !HitmanNormalFlip,x\nSTA !HitmanSprite1Flip\nLDA !PoseIndex,x\nREP #$21\nAND.w #$00FF\nADC.w #!MiSpriteHitboxContext\nJSL !Hitman_Base_PlayerNormalSpriteInteractionWithoutCallback\nBCC .SinContacto\nLDA #$E0\nSTA !SpriteYSpeed,x\n.SinContacto\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Con \u003ccode>WithoutCallback\u003c/code>, Carry queda en 1 si el sprite choca con Mario. Si quieres ejecutar una acción distinta según la caja, asigna \u003ccode>.OnPlayerCollision\u003c/code> o \u003ccode>.OnPlayerNonCollision\u003c/code> y llama a \u003ccode>!Hitman_Base_PlayerNormalSpriteInteraction\u003c/code>. En esa variante, Carry indica si el callback dejó un resultado en \u003ccode>!HitmanDefault\u003c/code>. Consulta \u003ca href=\"#es/api/PlayerSpriteInteraction\">PlayerSpriteInteraction\u003c/a> y \u003ca href=\"#es/api/Crear_un_callback\">Crear un callback\u003c/a>.\u003c/p>\n\u003ch3 id=\"Usar_una_sola_hitbox_en_un_Normal_sprite\">\u003ca class=\"heading-link\" href=\"#es/sprites/Usar_una_sola_hitbox_en_un_Normal_sprite\">Usar una sola hitbox en un Normal sprite\u003c/a>\u003c/h3>\n\u003cp>Si tu sprite usa una sola caja, puedes darle un tamaño y una posición desde el ASM. Guarda el desplazamiento horizontal, el vertical, el ancho y el alto en las tablas del sprite. Luego llama a \u003ccode>PlayerNormalSpriteOneHitboxInteraction\u003c/code> para comprobar si choca con Mario.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; A e índices de 8 bits. X = slot del Normal sprite.\nLDA #$02\nSTA !HitmanNormalXOffLow,x\nLDA #$FC\nSTA !HitmanNormalYOffLow,x\nLDA #$0C\nSTA !HitmanNormalWidthLow,x\nLDA #$10\nSTA !HitmanNormalHeightLow,x\n\nJSL !Hitman_Base_PlayerNormalSpriteOneHitboxInteraction\nBCC .SinChoque\n; Aquí va la respuesta al choque con Mario.\n.SinChoque\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>La caja mide 12 × 16 píxeles y empieza 2 píxeles a la derecha y 4 por encima del origen del sprite. Si la caja es fija, guarda los cuatro valores en INIT y deja la llamada en MAIN. Si además quieres que otros sprites usen esa misma caja al consultar la geometría del tuyo, configura \u003ccode>HitboxSystem\u003c/code> en \u003ccode>02\u003c/code>.\u003c/p>\n\u003ch3 id=\"Usar_una_hitbox_de_16_bits\">\u003ca class=\"heading-link\" href=\"#es/sprites/Usar_una_hitbox_de_16_bits\">Usar una hitbox de 16 bits\u003c/a>\u003c/h3>\n\u003cp>Si necesitas una caja más grande o más alejada del origen, usa \u003ccode>PlayerNormalSpriteOneLongHitboxInteraction\u003c/code>. Guarda los bytes bajo y alto de cada valor. Por ejemplo, esta caja mide 288 × 32 píxeles y empieza 144 píxeles a la izquierda y 4 por encima del origen del sprite.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>; A e índices de 8 bits. X = slot del Normal sprite.\n; X offset = $FF70 (-144), Y offset = $FFFC (-4).\nLDA #$70\nSTA !HitmanNormalXOffLow,x\nLDA #$FC\nSTA !HitmanNormalYOffLow,x\nLDA #$FF\nSTA !HitmanNormalXOffHigh,x\nSTA !HitmanNormalYOffHigh,x\n\n; Ancho = $0120 (288), alto = $0020 (32).\nLDA #$20\nSTA !HitmanNormalWidthLow,x\nSTA !HitmanNormalHeightLow,x\nLDA #$01\nSTA !HitmanNormalWidthHigh,x\nLDA #$00\nSTA !HitmanNormalHeightHigh,x\n\nJSL !Hitman_Base_PlayerNormalSpriteOneLongHitboxInteraction\nBCC .SinChoque\n; Aquí va la respuesta al choque con Mario.\n.SinChoque\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Si la caja es fija, guarda los valores en INIT y deja la llamada en MAIN. Para que otros sprites consulten esa misma caja, configura \u003ccode>HitboxSystem\u003c/code> en \u003ccode>04\u003c/code>.\u003c/p>\n\u003ch2 id=\"Reaccionar_a_una_interacción_vanilla\">\u003ca class=\"heading-link\" href=\"#es/sprites/Reaccionar_a_una_interacci%C3%B3n_vanilla\">Reaccionar a una interacción vanilla\u003c/a>\u003c/h2>\n\u003cp>Supongamos que quieres que una bola de fuego haga saltar al sprite en vez de activar la respuesta del juego. Puedes desactivar esa respuesta y seguir recibiendo el aviso del impacto.\u003c/p>\n\u003cp>Por ejemplo, añade estas propiedades al JSON del sprite para recibir el evento de bola de fuego de Mario y omitir su respuesta vanilla. Conserva \u003ccode>HitboxSystem\u003c/code> en la misma lista si ya lo configuraste.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>{ &quot;PropertyName&quot;: &quot;VanillaEventMask&quot;, &quot;Value&quot;: &quot;08&quot; },\n{ &quot;PropertyName&quot;: &quot;VanillaResponseMask&quot;, &quot;Value&quot;: &quot;77&quot; }\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Luego añade \u003ccode>&quot;VanillaCallbacks&quot;: { &quot;Fireball&quot;: &quot;MiSpriteAlRecibirFuego&quot; }\u003c/code> como campo del JSON. Guarda \u003ccode>MiSpriteAlRecibirFuego.asm\u003c/code> en \u003ccode>Routines/\u003c/code> dentro de Hitman Tool.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>MiSpriteAlRecibirFuego:\n    ; A = evento, X = receptor, Y = slot del Extended sprite.\n    LDA #$E0\n    STA !SpriteYSpeed,x\n    RTL\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Si prefieres responder en MAIN, habilita el evento y consulta su bit en \u003ccode>!Hitman_Prop_ActionFlag,x\u003c/code>. Limpia ese bit cuando termines de procesarlo. Puedes consultar los demás eventos y sus máscaras en \u003ca href=\"#es/api/Flags_y_callbacks_de_eventos\">Flags y callbacks de eventos\u003c/a>.\u003c/p>\n\u003ch2 id=\"Adaptar_los_ejemplos_a_Cluster_sprites_y_Extended_sprites\">\u003ca class=\"heading-link\" href=\"#es/sprites/Adaptar_los_ejemplos_a_Cluster_sprites_y_Extended_sprites\">Adaptar los ejemplos a Cluster sprites y Extended sprites\u003c/a>\u003c/h2>\n\u003cp>El mismo \u003ccode>MiSprite.hitboxinfo\u003c/code> sirve para las tres familias. Usa \u003ccode>;#inchbi\u003c/code> en el ASM principal y conserva el cálculo de contexto base más pose. El JSON con \u003ccode>HitboxSystem\u003c/code> y la directiva \u003ccode>;#inchmprop\u003c/code> del ejemplo se usan para Normal sprites.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>En el ejemplo original\u003c/th>\u003cth>Para un Cluster sprite\u003c/th>\u003cth>Para un Extended sprite\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>X contiene el slot del Normal sprite.\u003c/td>\u003ctd>Pon en X el slot del Cluster sprite.\u003c/td>\u003ctd>Pon en X el slot del Extended sprite.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Guarda la pose en \u003ccode>!HitmanNormalContextIDLow,x\u003c/code> y \u003ccode>!HitmanNormalContextIDHigh,x\u003c/code>.\u003c/td>\u003ctd>Usa \u003ccode>!HitmanClusterContextIDLow,x\u003c/code> y \u003ccode>!HitmanClusterContextIDHigh,x\u003c/code>.\u003c/td>\u003ctd>Usa \u003ccode>!HitmanExtendedContextIDLow,x\u003c/code> y \u003ccode>!HitmanExtendedContextIDHigh,x\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lee o guarda el volteo en \u003ccode>!HitmanNormalFlip,x\u003c/code>.\u003c/td>\u003ctd>Usa \u003ccod

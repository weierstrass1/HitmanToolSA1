/internals/C%C3%B3mo_se_guardan_las_hitboxes\">Cómo se guardan las hitboxes\u003c/a>\u003c/h2>\n\u003cp>Hitman guarda por separado la forma de cada caja, sus acciones y las cajas de cada pose. Así puede reutilizar una caja de 16 × 16 píxeles en dos poses e incluso asignarle un callback distinto en cada una.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Dato compartido\u003c/th>\u003cth>Cuándo se puede reutilizar\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Geometría\u003c/td>\u003ctd>Coinciden el ancho, el alto y los desplazamientos normales y espejados.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Perfil de acciones\u003c/td>\u003ctd>Coinciden las acciones asociadas a la caja, incluidas las que resultan de la herencia.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lista de una pose\u003c/td>\u003ctd>Las dos poses usan las mismas cajas en el mismo orden, con las mismas acciones y los mismos identificadores de caja para sus callbacks.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"De_un_contexto_a_la_lista_de_cajas\">\u003ca class=\"heading-link\" href=\"#es/internals/De_un_contexto_a_la_lista_de_cajas\">De un contexto a la lista de cajas\u003c/a>\u003c/h3>\n\u003cp>Imagina que las poses de tu sprite empiezan en la entrada 40 de las tablas de Hitman. La pose 0 está en la entrada 40 y la pose 2 en la 42. A ese índice inicial le llamamos contexto base. El define \u003ccode>!MiSpriteHitboxContext\u003c/code> guarda ese número para que puedas sumar la pose actual sin tener que averiguar en qué entrada empieza tu sprite.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cbutton class=\"copy-code\" type=\"button\">Copiar\u003c/button>\u003cpre>\u003ccode>Contexto base + pose\n    → ContextPosesHitboxes\n    → PoseHitboxesIndexers\n    → lista en PoseHitboxes\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>PoseHitboxes\u003c/code> contiene desplazamientos a las entradas de geometría. Cada entrada ocupa dos bytes y \u003ccode>$FFFF\u003c/code> indica el final de la lista. En paralelo, \u003ccode>PoseHitboxProfiles\u003c/code> indica qué perfil de acciones corresponde a cada entrada. \u003ccode>PoseHitboxCallbackIds\u003c/code> conserva el ID histórico que recibe el callback en Y.\u003c/p>\n\u003cp>Al comparar una caja, Hitman usa su perfil de acciones para encontrar en \u003ccode>HitboxActions\u003c/code> la dirección de la rutina que debe ejecutar. Cada dirección ocupa tres bytes. Las tablas de geometría y sus índices deben caber en un mismo banco de ROM. Hitman comprueba el tamaño al crearlas y Asar comprueba dónde quedaron al instalarlas.\u003c/p>\n\u003ch2 id=\"Qué_se_guarda_en_RAM\">\u003ca class=\"heading-link\" href=\"#es/internals/Qu%C3%A9_se_guarda_en_RAM\">Qué se guarda en RAM\u003c/a>\u003c/h2>\n\u003cp>En la RAM se guarda lo que puede cambiar durante el juego. Un sprite con varias poses guarda cuál está usando y si está volteado. Un sprite con una caja ajustable guarda su tamaño y su posición respecto al origen del sprite. Algunos de esos datos ocupan los mismos bytes, así que al cambiar de modo debes escribir los valores del modo nuevo.\u003c/p>\n\u003cp>Las propiedades de los Normal sprites funcionan de otra forma. Hitman genera una tabla ROM de 256 entradas para vanilla y otra para custom por cada propiedad. Al inicializar un slot, el parche busca el número del sprite, lee el valor que le corresponde y lo copia a la tabla RAM de la propiedad. Por eso dos instancias del mismo tipo empiezan con el mismo valor pero pueden cambiarlo por separado.\u003c/p>\n\u003cp>La máscara de parejas usa un bit por cada par de slots normales. Al reutilizar un slot, el parche vuelve a permitir sus parejas. Esto evita que un sprite recién creado herede el bloqueo de una pareja anterior. Para encontrar el bit, Hitman usa el mayor de los dos números de slot para elegir una fila. El menor indica qué bit de esa fila corresponde a la pareja. Cada fila empieza en un byte nuevo. La tabla ocupa 14 bytes en LoROM (12 slots) y 39 bytes en SA-1 (22 slots).\u003c/p>\n\u003cp>HB1, HB2 y el resultado de los callbacks viven en memoria temporal. Por ejemplo, si vas a conservar el borde de una caja para usarlo después, cópialo antes de hacer otra consulta. Para cambiar el bloque de RAM persistente, consulta \u003ca href=\"#es/api/Reubicar_la_RAM_de_Hitman\">Reubicar la RAM de Hitman\u003c/a>.\u003c/p>\n\u003ch2 id=\"Cómo_se_comprueba_un_choque\">\u003ca class=\"heading-link\" href=\"#es/internals/C%C3%B3mo_se_comprueba_un_choque\">Cómo se comprueba un choque\u003c/a>\u003c/h2>\n\u003ch3 id=\"Preparar_los_dos_rectángulos\">\u003ca class=\"heading-link\" href=\"#es/internals/Preparar_los_dos_rect%C3%A1ngulos\">Preparar los dos rectángulos\u003c/a>\u003c/h3>\n\u003cp>Hitman calcula los bordes izquierdo, superior, derecho e inferior de cada caja. Para cada caja de la pose, suma su desplazamiento a la posición del objeto. Si el sprite está volteado, usa el desplazamiento que corresponde a esa orientación. Añade el ancho y el alto para obtener los bordes derecho e inferior. Las rutinas de clipping convierten la caja vanilla al mismo formato que usa Hitman.\u003c/p>\n\u003cp>Hitman guarda temporalmente ambos rectángulos con los nombres HB1 y HB2. Por ejemplo, HB1 puede ser una caja del sprite y HB2 la caja de Mario. Si la caja del sprite termina antes de que empiece la de Mario en cualquiera de los dos ejes, no chocan. Si los bordes llegan a encontrarse, Hitman cuenta el choque.\u003c/p>\n\u003ch3 id=\"Recorrer_las_cajas_y_ejecutar_callbacks\">\u003ca class=\"heading-link\" href=\"#es/internals/Recorrer_las_cajas_y_ejecutar_callbacks\">Recorrer las cajas y ejecutar callbacks\u003c/a>\u003c/h3>\n\u003cp>Una comprobación sin callbacks puede terminar en cuanto encuentra una caja que choca. Si la llamada usa callbacks, Hitman comprueba todas las cajas en el orden de la pose. Cada caja puede ejecutar su propia rutina. Por ejemplo, una caja en la parte superior puede servir de plataforma y otra en el costado puede impedir que Mario atraviese el sprite.\u003c/p>\n\u003cp>Antes del recorrido, Hitman limpia \u003ccode>!HitmanDefault\u003c/code>. Los callbacks pueden añadir bits y el código que inició la comprobación decide qué hacer con ellos. En este recorrido, Carry queda en 1 si el resultado acumulado es distinto de cero. En una consulta geométrica, Carry queda en 1 si hubo choque. Por ejemplo, una caja que choca con Mario y usa \u003ccode>Nothing\u003c/code> puede dejar el resultado acumulado en cero.\u003c/p>\n\u003ch2 id=\"Cómo_se_resuelve_una_interacción_vanilla\">\u003ca class=\"heading-link\" href=\"#es/internals/C%C3%B3mo_se_resuelve_una_interacci%C3%B3n_vanilla\">Cómo se resuelve una interacción vanilla\u003c/a>\u003c/h2>\n\u003cp>El parche conecta Hitman con las rutinas del juego para los choques entre Normal sprites, los impactos de bolas de fuego, las explosiones, los Quake sprites y el cape dive. Antes de comparar las hitboxes, Hitman decide si debe comprobar a esos sprites. Por ejemplo, puede saltarse un sprite inactivo o una pareja cuyo choque bloqueaste con la máscara de colisión.\u003c/p>\n\u003cp>Cuando se detecta un impacto, la máscara \u003ccode>VanillaResponseMask\u003c/code> del receptor indica si se aplica la respuesta del juego. \u003ccode>VanillaEventMask\u003c/code> habilita el aviso. El bit se acumula en \u003ccode>ActionFlag\u003c/code> y, si existe un callback configurado, se llama después de la respuesta. Puedes desactivar la respuesta vanilla de una bola de fuego y seguir recibiendo el aviso para aplicar tu propia reacción.\u003c/p>\n\u003cp>Si una bola de fuego activa un callback vanilla, A indica el tipo de impacto, X identifica al sprite que recibió el golpe y Y identifica a la bola de fuego. En un callback de hitbox, en cambio, Y identifica la caja. La \u003ca href=\"#es/api/Flags_y_callbacks_de_eventos\">tabla de eventos de la API\u003c/a> muestra qué recibe cada callback.\u003c/p>\n\u003ch3 id=\"Qué_cambia_para_los_proyectiles\">\u003ca class=\"heading-link\" href=\"#es/internals/Qu%C3%A9_cambia_para_los_proyectiles\">Qué cambia para los proyectiles\u003c/a>\u003c/h3>\n\u003cp>El recorrido de bolas de fuego selecciona la geometría y el evento por número de Extended sprite. Puedes cambiar la forma del proyectil y conservar la respuesta de una bola de fuego de Mario. También puede usar sus cajas para una consulta manual y decidir por código qué hacer al chocar.\u003c/p>\n\u003ch2 id=\"Cómo_encuentran_las_rutinas_PIXI_y_UberASMTool\">\u003ca class=\"heading-link\" href=\"#es/internals/C%C3%B3mo_encuentran_las_rutinas_PIXI_y_UberASMTool\">Cómo encuentran las rutinas PIXI y UberASMTool\u003c/a>\u003c/h2>\n\u003cp>La ROM guarda en \u003ccode>$07F7D6\u003c/code> un puntero a \u003ccode>RoutinesTable\u003c/code>. Esa tabla contiene las direcciones de las rutinas base y los callbacks incluidos en la instalación. Al ensamblar un recurso, \u003ccode>HitmanDefines.asm\u003c/code> lee esa tabla en la ROM y resuelve los símbolos \u003ccode>!Hitman_Base_*\u003c/code> y \u003ccode>!Hitman_Callback_*\u003c/code>.\u003c/p>\n\u003cp>Si añades un callback o una rutina base, pueden cambiar las entradas de la tabla. Ejecuta Hitman primero y vuelve a ensamblar con PIXI y UberASMTool los recursos que usan los defines. Así sus llamadas apuntarán a las rutinas de la nueva instalación.\u003c/p>","headings":[{"id":"Cómo_se_prepara_la_ROM","title":"Cómo se prepara la ROM","level":2},{"id":"Qué_partes_del_juego_modifica_Hitman","title":"Qué partes del juego modifica Hitman","level":2},{"id":"Por_qué_Hitman_incluye_sus_propias_rutinas_de_spawn","title":"Por qué Hitman incluye sus propias rutinas de spawn","level":3},{"id":"Cómo_se_guardan_las_hitboxes","title":"Cómo se guardan las hitboxes","level":2},{"id":"De_un_contexto_a_la_lista_de_cajas","title":"De un contexto a la lista de cajas","level":3},{"id":"Qué_se_guarda_en_RAM","title":"Qué se guarda en RAM","level":2},{"id":"Cómo_se_comprueba_un_choque","title":"Cómo se comprueba un choque","level":2},{"id":"Preparar_los_dos_rectángulos","title":"Preparar los dos rectángulos","level":3},{"id":"Recorrer_las_cajas_y_ejecutar_callbacks","title":"Recorrer las cajas y ejecutar callbacks","level":3},{"id":"Cómo_se_resuelve_una_interacción_vanilla","title":"Cómo se resuelve una interacción vanilla","level":2},{"id":"Qué_cambia_para_los_proyectiles","title":"Qué cambia para los proyectiles","level":3},{"id":"Cómo_encuentran_las_rutinas_PIXI_y_UberASMTool","title":"Cómo encuentran las rutinas PIXI y UberASMTool","level":2}]}}}</script>
<script>'use strict';
const DOCS = JSON.parse(document.getElementById('documentation-data').textContent);
const KEYS = Object.keys(DOCS.en);
const UI = {
 en:{documentation:'Documentation',language:'Language',menu:'Menu',searchLabel:'Search documentation',searchPlaceholder:'Search articles and sections…',articles:'Articles',contents:'On this page',offline:'Available offline',manual:'USER MANUAL',footer:'Hitman Tool documentation',top:'Back to top ↑',credits:'Credits to',previous:'Previous',next:'Next',copy:'Copy',copied:'Copied',copyFail:'Select and copy the code manually.',none:'No matching sections.',results:'results',theme:'Change theme'},
 es:{documentation:'Documentación',language:'Idioma',menu:'Menú',searchLabel:'Buscar en la documentación',searchPlaceholder:'Buscar artículos y secciones…',articles:'Artículos',contents:'En este artículo',offline:'Disponible sin conexión',manual:'MANUAL DE USUARIO',footer:'Documentación de Hitman Tool',top:'Volver arriba ↑',credits:'Créditos a',previous:'Anterior',next:'Siguiente',copy:'Copiar',copied:'Copiado',copyFail:'Selecciona y copia el código manualmente.',none:'No se encontraron secciones.',results:'resultados',theme:'Cambiar tema'}
};
const $ = id => document.getElementById(id);
let state = {lang:'en',page:'main',section:''};
let observer;
const searchIndex = {};
const safe = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const url = (lang,page,section='') => '#'+lang+'/'+page+(section?'/'+encodeURIComponent(section):'');
function remember(key,value){try{localStorage.setItem('hitman-doc-'+key,value)}catch{}}
function recall(key,fallback){try{return localStorage.getItem('hitman-doc-'+key)||fallback}catch{return fallback}}
function parseRoute(){
 const [language,page,...section] = location.hash.slice(1).split('/');
 return {lang:DOCS[language]?language:recall('lang',navigator.language.startsWith('es')?'es':'en'),page:KEYS.includes(page)?page:'main',section:decodeURIComponent(section.join('/'))};
}
function toast(text){$('notice').textContent=text;$('notice').classList.add('visible');setTimeout(()=>$('notice').classList.remove('visible'),2200)}
function render(){
 const nextState=parseRoute();
 const pageChanged=nextState.lang!==state.lang||nextState.page!==state.page||!$('article').children.length;
 state=nextState;
 const {lang,page,section}=state, labels=UI[lang], doc=DOCS[lang][page];
 document.documentElement.lang=lang;
 document.title=doc.title+' — Hitman Tool';
 $('language').value=lang;
 remember('lang',lang);
 document.querySelectorAll('[data-ui]').forEach(el=>el.textContent=labels[el.dataset.ui]);
 $('search').placeholder=labels.searchPlaceholder;
 $('theme').setAttribute('aria-label',labels.theme);
 if(pageChanged){
   $('article').innerHTML=doc.html;
   $('page-title').textContent=page==='main'?'Hitman Tool':doc.title;
   $('credits').innerHTML=labels.credits+' <a href="https://sneslab.net/wiki/User:Anonimzwx" target="_blank" rel="noopener noreferrer">Anonimzwx</a>';
   $('article-number').textContent=String(KEYS.indexOf(page)+1).padStart(2,'0')+' / 07';
   $('articles').innerHTML=KEYS.map((key,i)=>'<a href="'+url(lang,key)+'"'+(key===page?' aria-current="page"':'')+'><span class="nav-number">'+String(i+1).padStart(2,'0')+'</span><span>'+safe(DOCS[lang][key].title)+'</span></a>').join('');
   $('toc').innerHTML=doc.headings.map(h=>'<a href="'+url(lang,page,h.id)+'" data-level="'+h.level+'">'+safe(h.title)+'</a>').join('');
   const i=KEYS.indexOf(page);
   $('page-nav').innerHTML=[i>0?'<a href="'+url(lang,KEYS[i-1])+'"><small>← '+labels.previous+'</small><strong>'+safe(DOCS[lang][KEYS[i-1]].title)+'</strong></a>':'<span></span>',i<KEYS.length-1?'<a href="'+url(lang,KEYS[i+1])+'"><small>'+labels.next+' →</small><strong>'+safe(DOCS[lang][KEYS[i+1]].title)+'</strong></a>':'<span></span>'].join('');
   const names={"main": "Hitman_Tool", "quick-start": "Hitman_Tool_Quick_Start", "formats": "Hitman_Tool_files_and_formats", "sprites": "Hitman_Tool_sprite_guide", "uberasm": "Hitman_Tool_UberASM_guide", "api": "Hitman_Tool_ASM_API", "internals": "Hitman_Tool_internal_workings"};
   $('wiki-link').href='https://sneslab.net/wiki/'+(lang==='es'?'es/':'')+names[page];
   document.querySelector('.brand').href=url(lang,'main');
   if(observer)observer.disconnect();
   observer=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){document.querySelectorAll('#toc a').forEach(a=>a.removeAttribute('aria-current'));const match=Array.from($('toc').children).find(a=>a.hash===url(lang,page,entry.target.id));if(match)match.setAttribute('aria-current','location')}}},{rootMargin:'-90px 0px -65% 0px'});
   $('article').querySelectorAll('h2,h3,h4,h5').forEach(h=>observer.observe(h));
   $('search').value=''; search();
 }
 requestAnimationFrame(()=>{const target=section&&document.getElementById(section);if(target){target.scrollIntoView({block:'start'});target.setAttribute('tabindex','-1');target.focus({preventScroll:true})}else if(pageChanged){window.scrollTo(0,0)}});
 document.body.classList.remove('menu-open');$('menu').setAttribute('aria-expanded','false');
}
function makeIndex(lang){
 if(searchIndex[lang])return searchIndex[lang];
 const entries=[];
 for(const key of KEYS){
   const doc=DOCS[lang][key],container=document.createElement('div');container.innerHTML=doc.html;
   let title=doc.title,section='',parts=[];
   const flush=()=>{const text=parts.join(' ').replace(/\s+/g,' ').trim();entries.push({key,title,section,text,normalized:normalize(title+' '+text)});parts=[]};
   for(const node of container.children){if(/^H[2-6]$/.test(node.tagName)){flush();title=node.textContent;section=node.id}else parts.push(node.textContent)}
   flush();
 }
 return searchIndex[lang]=entries;
}
function search(){
 const q=$('search').value.trim(),box=$('search-results'),lang=state.lang;
 box.hidden=!q;$('contents').hidden=!!q;$('articles').hidden=!!q;document.querySelector('.article-label').hidden=!!q;
 if(!q){box.innerHTML='';return}
 const tokens=normalize(q).split(/\s+/),hits=makeIndex(lang).filter(e=>tokens.every(t=>e.normalized.includes(t))).slice(0,40);
 box.innerHTML=hits.length?'<p>'+hits.length+' '+UI[lang].results+'</p>'+hits.map(e=>{const pos=normalize(e.text).indexOf(tokens[0]);const start=Math.max(0,pos-35);const snippet=e.text.slice(start,start+140);return '<a href="'+url(lang,e.key,e.section)+'"><strong>'+safe(e.title)+'</strong><small>'+safe(DOCS[lang][e.key].title)+'</small><small>'+(start?'…':'')+safe(snippet)+'…</small></a>'}).join(''):'<p class="empty-search">'+UI[lang].none+'</p>';
}
$('language').addEventListener('change',()=>{
 const lang=$('language').value,old=DOCS[state.lang][state.page],doc=DOCS[lang][state.page];
 const position=old.headings.findIndex(h=>h.id===state.section);
 location.hash=url(lang,state.page,position>=0&&doc.headings[position]?doc.headings[position].id:'');
});
$('search').addEventListener('input',search);
$('menu').addEventListener('click',()=>{const open=document.body.classList.toggle('menu-open');$('menu').setAttribute('aria-expanded',String(open))});
$('top').addEventListener('click',()=>{location.hash=url(state.lang,state.page);window.scrollTo({top:0,behavior:'smooth'})});
$('theme').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;remember('theme',theme)});
document.documentElement.dataset.theme=recall('theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
$('article').addEventListener('click',async e=>{
 const button=e.target.closest('.copy-code');if(!button)return;
 const text=button.parentElement.querySelector('code').textContent;
 try{
   if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(text);
   else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw Error('copy')}
   button.textContent=UI[state.lang].copied;setTimeout(()=>button.textContent=UI[state.lang].copy,1600);
 }catch{const range=document.createRange();range.selectNodeContents(button.parentElement.querySelector('code'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);toast(UI[state.lang].copyFail)}
});
window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('menu-open');$('menu').setAttribute('aria-expanded','false')}});
render();
</script>
</body>
